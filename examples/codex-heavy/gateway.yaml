# yaml-language-server: $schema=../../schemas/gateway.schema.json
# Codex -> halo-proxy -> OpenAI, with Azure OpenAI as the failover tier.
# The provider keys are read by halo-proxy from its own environment; policy only
# names the variable. Developers never see an OpenAI or Azure key.
apiVersion: halos.dev/v1
kind: Gateway
name: codex-gateway
engine: halo-proxy
baseURL: https://ai.codex.example
protocols:
  codex: openai-responses
auth:
  helperCommand: /usr/local/bin/codex-sso-token --audience halos-gateway
  ttlSeconds: 900
upstreams:
  openai:
    url: https://api.openai.com
    kind: openai
    credential:
      env: OPENAI_API_KEY # bearer by default
  azure-openai:
    url: https://example-resource.openai.azure.com
    kind: azure-openai
    credential:
      env: AZURE_OPENAI_API_KEY # api-key scheme by default
models:
  codex-default:
    targets:
      - upstream: openai # tier 0
        model: gpt-5-codex
        timeoutSeconds: 30
      - upstream: azure-openai # tier 1: Azure deployment name
        model: gpt-5-codex-deployment
        priority: 1
  codex-mini:
    upstream: openai
    model: gpt-5-codex-mini
