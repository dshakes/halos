# yaml-language-server: $schema=../../../schemas/experiment.schema.json
# Shadow: 5% of sonnet sessions are mirrored, every step (turns: all), to the
# candidate route on direct Anthropic and graded offline: each step replays the
# real prefix (terminal output included) and compares the next action
# (ADR-0014). Users only ever see the primary response; nothing is executed.
apiVersion: halos.dev/v1
kind: Experiment
name: sonnet-next-shadow
type: shadow
axis: traffic
status: draft
rings: [ring2-early, ring3-ga]
sampleRate: 0.05
turns: all
variants:
  - name: primary
    weight: 1
    control: true
  - name: sonnet-next
    weight: 1
    routes:
      sonnet:
        upstream: anthropic-direct
        model: claude-sonnet-next
metrics:
  primary:
    metric: halo.task.success
    direction: increase
  guardrails:
    - metric: halo.cost.usd_per_session
      direction: decrease
      maxRegression: 0.20
    - metric: halo.latency.p95_ms
      direction: decrease
      maxRegression: 0.15
    # Quality, not just cost/latency: `halo eval online --policy-dir .` grades
    # the mirrored pairs with an LLM-judge rubric (eval receiver, source=eval).
    # A breach opens the pause PR and notifies; judge evidence never trips the
    # kill switch (only gateway evidence does).
    - metric: halo.eval.judge.score
      direction: increase
      maxRegression: 0.05
    # Step level: next action vs production's on the real prefix, per session.
    - metric: halo.eval.agent.fidelity
      direction: increase
      maxRegression: 0.05
    - metric: halo.eval.agent.invalid_call_rate
      direction: decrease
      maxRegression: 0.10
stopping:
  method: msprt
  alpha: 0.05
  minSamples: 2000
  maxDays: 14
  maxSpendUSD: 500
