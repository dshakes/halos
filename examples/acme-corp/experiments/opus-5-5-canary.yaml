# yaml-language-server: $schema=../../../schemas/experiment.schema.json
# Traffic-axis canary: 5% of ring1 users get the new Opus route at the gateway.
apiVersion: halos.dev/v1
kind: Experiment
name: opus-5-5-canary
type: canary
axis: traffic
status: running
rings: [ring1-canary]
variants:
  - name: control
    weight: 95
    control: true
  - name: opus-5-5
    weight: 5
    routes:
      opus:
        upstream: orchestrator
        model: arn:aws:bedrock:us-east-1:123456789012:application-inference-profile/z9w5opus55dd
# Traffic axis: only gateway-sourced metrics (halo-proxy telemetry) carry the
# gateway-assigned variant. Task success is judged offline by `halo eval`.
metrics:
  primary:
    metric: halo.api.error_rate
    direction: decrease
  guardrails:
    - metric: halo.latency.p50_ms
      direction: decrease
      maxRegression: 0.10
    - metric: halo.latency.p95_ms
      direction: decrease
      maxRegression: 0.15
stopping:
  method: msprt
  alpha: 0.05
  minSamples: 500
  maxDays: 14
  maxSpendUSD: 2000
