# yaml-language-server: $schema=../../../schemas/profile.schema.json
apiVersion: halos.dev/v1
kind: Profile
name: base
labels:
  owner: ai-platform
models:
  default: sonnet
  allowed: [sonnet, opus, haiku, codex-default, gemini-default]
  enforce: true
permissions:
  mode: default
  disableBypass: true
  sandbox: workspace-write
  # sandboxRequired: true   # fail closed: Claude refuses to start if bubblewrap/socat are missing (default: runs unsandboxed)
  deny:
    - Read(./.env)
    - Read(./.env.*)
    - Read(./secrets/**)
    - Read(~/.aws/**)
    - Read(~/.ssh/**)
mcp:
  managedOnly: true
  servers:
    - name: acme-docs
      url: https://mcp-docs.internal.acme.example/mcp
    - name: acme-tickets
      url: https://mcp-tickets.internal.acme.example/mcp
hooks:
  managedOnly: true
  items:
    - event: PreToolUse
      matcher: Bash
      command: /usr/local/bin/acme-audit-hook
extensions:
  # Pinned in halos.yaml supplyChain.artifacts; claude-code places them in its
  # managed directory, the other CLIs warn (ADR-0028).
  artifacts: [pr-review, security-reviewer, audit-bash]
telemetry:
  enabled: true
  otlpEndpoint: https://otel.internal.acme.example:4318
  protocol: http/protobuf
  logPrompts: false
  attributes:
    org: acme-corp
# Sandbox and egress (ADR-0032): one policy, rendered natively into every
# harness; what a harness cannot hold is a release warning. Check a host with
#   halo egress test https://registry.npmjs.org --ring ring3-ga
sandbox:
  protectedPaths: ["~/.ssh", "~/.aws", ".env*"]
egress:
  # Unset default + an allowlist = deny everything else. Deny rules always win.
  allowedDomains:
    - ai.acme.example
    - mcp-docs.internal.acme.example
    - mcp-tickets.internal.acme.example
    - otel.internal.acme.example
  presets: [vcs, package-registries]
  deniedDomains: [pastebin.com, transfer.sh]
instructions: |
  # Acme engineering
  - Follow the repo's CONTRIBUTING.md and run tests before proposing a commit.
  - Never paste secrets, tokens or customer data into prompts.
  - Prefer the internal MCP servers (acme-docs, acme-tickets) over web search.
