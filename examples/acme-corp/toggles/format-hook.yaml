# yaml-language-server: $schema=../../../schemas/toggle.schema.json
# A post-edit formatting hook for one IdP group. Toggle hooks get a matcher of
# their own so they never merge into a profile hook's matcher group.
apiVersion: halos.dev/v1
kind: Toggle
name: format-hook
description: Run the formatter after file edits for the platform-eng group
owner: ai-platform
expires: "2026-11-30"
default: false
axis: client
rules:
  - name: platform-eng
    groups: [acme-platform-eng]
client:
  harnesses:
    claude-code:
      hooks:
        - event: PostToolUse
          matcher: Edit|Write
          command: /usr/local/bin/acme-format-hook
    codex:
      hooks:
        - event: PostToolUse
          matcher: Edit|Write
          command: /usr/local/bin/acme-format-hook
