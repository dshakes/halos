# yaml-language-server: $schema=../../../schemas/rollout.schema.json
# Claude Code CLI upgrade 2.1.280 -> 2.1.300: canary ramp on the backing
# experiment's rings (1 -> 5 -> 25 -> 50%), then ring by ring. A guardrail
# breach rolls back automatically (pause PR + rings re-pointed at the
# baseline); every advance is a PR a human merges.
# `halo rollout plan claude-code-2.1.300` shows the timeline.
apiVersion: halos.dev/v1
kind: Rollout
name: claude-code-2.1.300
axis: client
status: draft
experiment: claude-cli-2.1.3xx-ab
change:
  version: 2.1.300
  release: sha256:058c9aeb72b1bd15bbf08142e9dbffe112d1127ccc7a2157626a6be6fffe26a3
baseline:
  release: sha256:79b98ffd0844f5711bcec7db914324801e63f15a72d1cd5f885f42f983d00b54
steps:
  - name: canary-1
    strategy: canary
    percent: 1
    bake: 2h
    minSamples: 100
    gates:
      guardrails: &guardrails
        - metric: halo.tool.error_rate
          direction: decrease
          maxRegression: 0.10
        - metric: halo.api.error_rate
          direction: decrease
          maxRegression: 0.05
  - name: canary-5
    strategy: canary
    percent: 5
    bake: 12h
    minSamples: 300
    gates:
      guardrails: *guardrails
  - name: canary-25
    strategy: canary
    percent: 25
    bake: 24h
    minSamples: 1000
    gates:
      guardrails: *guardrails
      scorecard:
        file: evals/claude-code-2.1.300.scorecard.json
        variant: cli-next
        minPass1: 0.70
        maxRegression: 0.02
  - name: canary-50
    strategy: canary
    percent: 50
    bake: 24h
    minSamples: 2000
    gates:
      guardrails: *guardrails
    onFailure: pause
  - name: ring1
    strategy: progressive
    ring: ring1-canary
    bake: 2d
    gates:
      approval: true
  - name: early
    strategy: progressive
    ring: ring2-early
    bake: 3d
    gates:
      approval: true
  - name: ga
    strategy: progressive
    ring: ring3-ga
    gates:
      approval: true
