name: release

# Tagging vX.Y.Z (or vX.Y.Z-rc.N) runs: gate (vet, race tests, CHANGELOG section, tap token)
# -> web (unprivileged npm build) -> release (GoReleaser: archives, deb/rpm/apk, checksums,
# SBOMs, cosign signatures, ghcr.io images, Homebrew/Scoop on final tags; build provenance
# attestations) -> verify (checks the published artifacts the way a user gets them).
# Cut releases with scripts/release.sh; see RELEASING.md for the process and secrets.
#
# Re-run for an existing tag: Actions > release > Run workflow, choose the TAG itself under
# "Use workflow from" and set `tag` to it. The installers pin the signing identity to
# release.yml@refs/tags/<tag>, so the gate refuses a run started from a branch.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.5.0. Start the run from that tag (Use workflow from)."
        required: true

permissions:
  contents: read

concurrency:
  group: release   # one release at a time; never cancel a half-published one
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
      prerelease: ${{ steps.t.outputs.prerelease }}
    steps:
      - name: Resolve tag
        id: t
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=${INPUT_TAG:-$GITHUB_REF_NAME}
          if ! [[ $tag =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::tag '$tag' is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$tag" ]; then
            echo "::error::run started from $GITHUB_REF; start it from refs/tags/$tag (Use workflow from) so the signing identity matches what the installers verify"
            exit 1
          fi
          pre=false; [[ $tag == *-* ]] && pre=true
          { echo "tag=$tag"; echo "version=${tag#v}"; echo "prerelease=$pre"; } >> "$GITHUB_OUTPUT"
      - name: Tap/bucket token is set (final releases)
        if: steps.t.outputs.prerelease == 'false'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Fail, never skip: a silently skipped publish leaves brew/scoop behind while CI stays green.
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is empty, so the Homebrew formula and Scoop manifest would not be published. Set a PAT with contents:write on dshakes/homebrew-tap and dshakes/scoop-bucket, then re-run from the tag."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.t.outputs.tag }}
          fetch-depth: 0   # origin/main, to check the tag is on it
          persist-credentials: false
      - name: Tag is on main
        env:
          TAG: ${{ steps.t.outputs.tag }}
        run: git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }
      - name: CHANGELOG has a section for the tag
        env:
          TAG: ${{ steps.t.outputs.tag }}
        run: scripts/release-notes.sh "$TAG"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - run: go vet ./...
      - run: go test -race ./...

  # Unprivileged: runs npm code with no release/signing credentials. The release
  # job downloads the result and sets HALO_WEB_PREBUILT=1 so goreleaser skips npm.
  web:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.gate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: web-dist, path: web/dist, if-no-files-found: error}

  release:
    needs: [gate, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release, upload assets
      packages: write      # push ghcr.io images
      id-token: write      # keyless cosign + attestations (GitHub OIDC)
      attestations: write  # build provenance for the archives
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # goreleaser needs full history + tags
          ref: refs/tags/${{ needs.gate.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: web-dist, path: web/dist}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Release notes from CHANGELOG
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with: {version: "~> v2", args: "release --clean --release-notes=${{ runner.temp }}/notes.md"}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HALO_WEB_PREBUILT: "1"
          # The gate fails a final tag when this is empty; rc tags skip tap/bucket (skip_upload: auto).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  # Checks only what was published, the way a user gets it. No write access.
  verify:
    needs: [gate, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ needs.gate.outputs.tag }}
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download checksums, bundle and one archive
        working-directory: ${{ runner.temp }}
        run: gh release download "$TAG" -R "$REPO" -p checksums.txt -p checksums.txt.sigstore.json -p "halo_${VERSION}_linux_amd64.tar.gz"
      - name: checksums.txt Sigstore bundle
        working-directory: ${{ runner.temp }}
        run: cosign verify-blob --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" --bundle checksums.txt.sigstore.json checksums.txt
      - name: Archive matches checksums.txt
        working-directory: ${{ runner.temp }}
        run: grep -E " \*?halo_${VERSION}_linux_amd64\.tar\.gz$" checksums.txt | sha256sum -c -
      - name: Archive build provenance attestation
        working-directory: ${{ runner.temp }}
        run: gh attestation verify "halo_${VERSION}_linux_amd64.tar.gz" -R "$REPO" --signer-workflow "$REPO/.github/workflows/release.yml"
      - name: Image signatures
        run: |
          for img in halo-server halo-proxy halo-shadow kong-halo; do
            cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "ghcr.io/dshakes/$img:$VERSION" >/dev/null
            echo "verified ghcr.io/dshakes/$img:$VERSION"
          done
      - name: install.sh installs this version
        run: |
          curl -fsSL --proto '=https' "https://raw.githubusercontent.com/$REPO/$TAG/install/install.sh" \
            | sh -s -- --version "$TAG" --prefix "$RUNNER_TEMP/prefix"
          out=$("$RUNNER_TEMP/prefix/bin/halo" version)
          echo "$out"
          grep -qF "$VERSION" <<<"$out" || { echo "::error::halo version printed '$out', want $VERSION"; exit 1; }
      - name: Homebrew formula and Scoop manifest reference this version
        if: needs.gate.outputs.prerelease == 'false'
        run: |
          formula=$(gh api repos/dshakes/homebrew-tap/contents/Formula/halo.rb -H "Accept: application/vnd.github.raw")
          grep -qF "version \"$VERSION\"" <<<"$formula" || { echo "::error::dshakes/homebrew-tap Formula/halo.rb is not at $VERSION"; exit 1; }
          scoop=$(gh api repos/dshakes/scoop-bucket/contents/halo.json -H "Accept: application/vnd.github.raw" | jq -r .version)
          [ "$scoop" = "$VERSION" ] || { echo "::error::dshakes/scoop-bucket halo.json is at $scoop, want $VERSION"; exit 1; }
          echo "tap and bucket at $VERSION"
