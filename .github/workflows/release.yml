name: release

# Tagging vX.Y.Z runs GoReleaser (.goreleaser.yaml): archives, deb/rpm/apk, checksums,
# SBOMs, keyless cosign signatures, ghcr.io images and the Homebrew/Scoop manifests.
# See RELEASING.md for the process and the secrets this needs.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.5.0. The tag must already be pushed."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Unprivileged: runs npm code with no release/signing credentials. The release
  # job downloads the result and sets HALO_WEB_PREBUILT=1 so goreleaser skips npm.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: web-dist, path: web/dist, if-no-files-found: error}

  release:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release, upload assets
      packages: write   # push ghcr.io images
      id-token: write   # keyless cosign (GitHub OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # goreleaser needs full history + tags for the changelog
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: web-dist, path: web/dist}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with: {version: "~> v2", args: release --clean}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HALO_WEB_PREBUILT: "1"
          # Optional. Unset/empty => brew + scoop publishing is skipped (.goreleaser.yaml).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
