name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with: {version: v2.14.0}
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: coverage, path: coverage.out}
  cross:
    # build + unit tests on the other OSes halod/halo ship for (ubuntu is `test`).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./cmd/... ./internal/...
  delivery-windows:
    # The Windows delivery path on a real (elevated) runner: install.ps1 against the real release,
    # portal enroll.ps1, `halod service install` as the SYSTEM scheduled task, DACL assertions.
    # Not covered: Intune, Authenticode, an interactive user, real vendor CLI installs.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      HALOS_INSTALL_VERSION: v0.1.0-rc.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - run: scripts/ci-delivery-windows.ps1
        shell: pwsh
  delivery-macos:
    # The macOS delivery path on a hosted runner (passwordless sudo): install.sh, enroll.sh, and
    # `halod service install` as a real launchd daemon. Not covered: Jamf/MDM, a console user.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HALOS_INSTALL_VERSION: v0.1.0-rc.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - run: scripts/ci-delivery-macos.sh
  action:
    # The composite Action itself (`uses: ./`) pinned to a real release, then halo validate.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./
        with: {version: v0.1.0-rc.2}
      - run: |
          halo version
          halo validate examples/acme-corp
        shell: bash
      - name: with-agent installs halod too
        if: runner.os != 'Windows'
        uses: ./
        with: {version: v0.1.0-rc.2, with-agent: "true"}
      - name: halod is root-owned on PATH
        if: runner.os != 'Windows'
        run: |
          halod help
          [ "$(stat -c %u /usr/local/bin/halod 2>/dev/null || stat -f %u /usr/local/bin/halod)" = 0 ]
        shell: bash
  gitlab:
    # The GitLab CI template run by gitlab-ci-local (a faithful emulation of the runner's script
    # execution in the job image, NOT GitLab itself): `include: local` stands in for `include: remote`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22}
      - run: npm install -g gitlab-ci-local@4.76.0
      - name: pinned job installs halo and validates the example policy
        run: gitlab-ci-local --file test/ci/gitlab-ci.yml halo-validate
      - name: an unpinned job is refused
        run: |
          if gitlab-ci-local --file test/ci/gitlab-ci.yml unpinned-is-refused >out.log 2>&1; then cat out.log; echo "unpinned job ran"; exit 1; fi
          grep -q "set HALOS_VERSION to a pinned release tag" out.log || { cat out.log; exit 1; }
  devcontainer:
    # The dev container paths through the real devcontainer CLI: this repo's .devcontainer, and the
    # halos Feature (pinned CLI + managed settings from a signed release). scripts/ci-devcontainer.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22}
      - run: npm install -g @devcontainers/cli@0.89.0
      - run: scripts/ci-devcontainer.sh
  packaging:
    # Installer scripts + release config: shellcheck, then a snapshot build (no publish, no signing).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22} # the goreleaser before-hooks build web/dist
      - run: shellcheck install/install.sh scripts/ci-delivery-macos.sh scripts/ci-devcontainer.sh deploy/packaging/*.sh
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with: {version: "~> v2", args: "release --snapshot --clean --skip=publish,sign,sbom,docker"}
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with: {go-version-file: go.mod}
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22}
      - run: npm ci && npm run build
        working-directory: docs
  e2e:
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 25
    services:
      registry:
        image: registry:2
        ports: ["5000:5000"]
    env:
      HALO_E2E_REGISTRY: 127.0.0.1:5000 # TestMain uses this instead of starting its own container
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - run: make e2e
  obs-e2e:
    # Evidence plane: otel-collector-contrib -> ClickHouse -> halo exp analyze + Grafana, synthetic telemetry.
    # Closed loop: halo-proxy traffic -> ClickHouse -> halo-server controller -> signed kill list -> proxy stops routing.
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - run: make obs-e2e
  smoke:
    # Real Claude Code (downloads.claude.ai + npm) in a container: network-bound, run on demand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - run: make smoke
  uat-k8s:
    # Helm chart UAT on kind (scripts/uat-k8s.sh). No SHA-pinned helm/kind-action exists in this repo,
    # so kind is installed with `go install` at a fixed version; helm and kubectl ship on ubuntu-latest.
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - run: go install sigs.k8s.io/kind@v0.27.0
      - run: make uat-k8s
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: uat-k8s-report, path: test/uat/REPORT.md, if-no-files-found: ignore}
  uat-clis:
    # Real Claude Code / Codex / Gemini / Copilot CLIs (scripts/uat-clis.sh) on a Landlock-capable
    # kernel, so the codex eval arm and the codex sandbox probe must pass here (not known gaps).
    # Network-bound (npm, downloads.claude.ai); no API keys or secrets.
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 40
    env:
      UAT_REQUIRE_LANDLOCK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - run: make uat-clis
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: uat-clis-report, path: "test/uat/CLI-REPORT.md\ntest/uat/cli-results.md", if-no-files-found: ignore}
  uat-kong:
    # halo-kong inside a real Kong OSS (digest-pinned image, db-less) against mock upstreams
    # (scripts/uat-kong.sh, docker compose). No secrets; the image is pulled from Docker Hub.
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: {go-version-file: go.mod}
      - run: make uat-kong
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: uat-kong-report, path: test/uat/KONG-REPORT.md, if-no-files-found: ignore}
