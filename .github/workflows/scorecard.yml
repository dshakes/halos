name: scorecard
# OpenSSF Scorecard: supply-chain posture of this repository.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
# Read-only by design: no code-scanning upload, no publish to the Scorecard API (both need write
# tokens). The SARIF is kept as a workflow artifact.
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: scorecard-sarif, path: results.sarif, retention-days: 5}
