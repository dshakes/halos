name: Bug report
description: Something in Halos behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security issue? Do not file it here. See SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Halos version (halo --version)
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [halo CLI, halod, halo-kong, halo-shadow, halo-server, dev container feature, harness adapter, docs, other]
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and version (for example claude-code 2.1.280)
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (include minimal policy YAML)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redact tokens and prompts)
      render: shell
