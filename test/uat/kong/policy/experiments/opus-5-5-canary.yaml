# Overlay: a 50/50 traffic canary on the opus alias for ring1-3 users (mock-b serves the treatment).
apiVersion: halos.dev/v1
kind: Experiment
name: opus-5-5-canary
type: canary
axis: traffic
status: running
rings: [ring1-canary, ring2-early, ring3-ga]
variants:
  - name: control
    weight: 50
    control: true
  - name: opus-5-5
    weight: 50
    routes:
      opus:
        upstream: mock-b
        model: claude-opus-next
# Traffic axis: only gateway-sourced metrics (halo-proxy telemetry) carry the
# gateway-assigned variant. Task success is judged offline by `halo eval`.
metrics:
  primary:
    metric: halo.api.error_rate
    direction: decrease
  guardrails:
    - metric: halo.latency.p50_ms
      direction: decrease
      maxRegression: 0.10
    - metric: halo.latency.p95_ms
      direction: decrease
      maxRegression: 0.15
stopping:
  method: msprt
  alpha: 0.05
  minSamples: 500
  maxDays: 14
  maxSpendUSD: 2000
