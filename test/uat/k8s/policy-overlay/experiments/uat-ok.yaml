# UAT traffic canary on alias "fast" (ring3-ga), backing rollout uat-ok.
apiVersion: halos.dev/v1alpha1
kind: Experiment
name: uat-ok
type: canary
axis: traffic
status: running
rings: [ring3-ga]
variants:
  - {name: control, weight: 75, control: true}
  - name: treatment
    weight: 25
    routes:
      fast: {upstream: mock-b, model: fast-next}
metrics:
  primary: {metric: halo.api.error_rate, direction: decrease}
  guardrails: [{metric: halo.latency.p95_ms, direction: decrease, maxRegression: 0.15}]
stopping: {method: msprt, alpha: 0.05, minSamples: 20, maxDays: 14}
