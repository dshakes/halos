# UAT gateway: examples/acme-corp's aliases re-pointed at in-cluster mock upstreams
# (scripts/uat-k8s.sh overlays this on a copy of examples/acme-corp).
apiVersion: halos.dev/v1
kind: Gateway
name: acme-gateway
baseURL: https://ai.acme.example
protocols:
  claude-code: anthropic-messages
  codex: openai-responses
  gemini-cli: gemini
auth:
  helperCommand: /usr/local/bin/acme-token
  ttlSeconds: 3300
upstreams:
  mock-a: {url: "http://mock-a.uat-infra.svc.cluster.local:9000", kind: anthropic}
  mock-b: {url: "http://mock-b.uat-infra.svc.cluster.local:9000", kind: anthropic}
  mock-down: {url: "http://mock-down.uat-infra.svc.cluster.local:9000", kind: anthropic} # no endpoints: refused
  mock-responses: {url: "http://mock-b.uat-infra.svc.cluster.local:9000/v1/responses", kind: openai}
  mock-gemini: {url: "http://mock-b.uat-infra.svc.cluster.local:9000", kind: gemini}
models:
  sonnet: {upstream: mock-a, model: claude-sonnet-4-5}
  opus:
    targets:
      - {upstream: mock-down, model: claude-opus-primary, timeoutSeconds: 5}
      - {upstream: mock-a, model: claude-opus-fallback, priority: 1}
  default:
    targets: # 50/50 split, sticky per user+session
      - {upstream: mock-a, model: claude-split-a, weight: 50}
      - {upstream: mock-b, model: claude-split-b, weight: 50}
  haiku: {upstream: mock-a, model: claude-haiku-4-5}
  fast: {upstream: mock-a, model: fast-base}
  slow: {upstream: mock-a, model: slow-base}
  codex-default: {upstream: mock-responses, model: gpt-5-codex}
  gemini-default: {upstream: mock-gemini, model: gemini-2.5-pro}
