# `halo upgrade check|watch --policy-dir examples/acme-corp` config. Lives in
# .halos/ because the policy loader skips dot-dirs. Paths are relative to the
# policy dir. The watcher never merges or publishes: it opens PRs.
profile: engineering-next          # pins under harnesses.<name>.version are the candidates
suite: ../../evals/suites/upgrade-gate.yaml
harnesses: [claude-code, codex, gemini-cli]
models:
  - provider: orchestrator-openai
    url: https://ai.acme.example/v1/models
    api_key_env: HALO_EVAL_GATEWAY_TOKEN
    match: "^gpt-[0-9.]+-codex$"
    known: [gpt-5-codex]
    alias: codex-default           # candidate pin edits models.codex-default.model in the Gateway
