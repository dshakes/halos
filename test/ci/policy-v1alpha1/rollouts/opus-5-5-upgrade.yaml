# yaml-language-server: $schema=../../../schemas/rollout.schema.json
# Opus model upgrade on the traffic axis, live at canary-5 (the experiment
# runs at 95/5): dark-launch (mirrored, no user sees it), canary ramp, then a
# 5% holdout kept on the old model for 14 days to measure the long-term effect. A guardrail breach on gateway
# evidence trips the signed kill switch at once. Completing re-points
# gateway.models.opus; its failover targets make that a human edit in the PR.
apiVersion: halos.dev/v1alpha1
kind: Rollout
name: opus-5-5-upgrade
axis: traffic
status: active
step: canary-5
experiment: opus-5-5-canary
change:
  alias: opus
steps:
  - name: dark-launch
    strategy: dark-launch
    percent: 10
    bake: 2d
    minSamples: 500
    gates:
      guardrails:
        - metric: halo.latency.p95_ms
          direction: decrease
          maxRegression: 0.15
      scorecard:
        file: evals/opus-5-5.scorecard.json
        variant: opus-5-5
        minPass1: 0.75
        maxRegression: 0.01
    onFailure: pause
  - name: canary-1
    strategy: canary
    percent: 1
    bake: 6h
    minSamples: 200
    gates:
      guardrails: &guardrails
        - metric: halo.api.error_rate
          direction: decrease
          maxRegression: 0.05
        - metric: halo.latency.p95_ms
          direction: decrease
          maxRegression: 0.15
  - name: canary-5
    strategy: canary
    percent: 5
    bake: 12h
    minSamples: 500
    gates:
      guardrails: *guardrails
  - name: canary-25
    strategy: canary
    percent: 25
    bake: 1d
    minSamples: 2000
    gates:
      guardrails: *guardrails
  - name: canary-50
    strategy: canary
    percent: 50
    bake: 1d
    minSamples: 4000
    gates:
      guardrails: *guardrails
      approval: true
  - name: holdout
    strategy: holdout
    percent: 5
    bake: 14d
    minSamples: 1000
    gates:
      guardrails: *guardrails
      approval: true
