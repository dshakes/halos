# yaml-language-server: $schema=../../../schemas/experiment.schema.json
# Client-axis A/B: the newer Claude Code build (engineering-next) vs the current pin.
apiVersion: halos.dev/v1alpha1
kind: Experiment
name: claude-cli-2.1.3xx-ab
type: ab
axis: client
status: running
rings: [ring1-canary, ring2-early]
variants:
  - name: control
    weight: 50
    profile: engineering
    control: true
  - name: cli-next
    weight: 50
    profile: engineering-next
metrics:
  primary:
    metric: halo.edit.accept_rate
    direction: increase
  guardrails:
    # halo.task.success is eval-only (halo eval gates); tool errors are its online proxy.
    - metric: halo.tool.error_rate
      direction: decrease
      maxRegression: 0.10
    - metric: halo.api.error_rate
      direction: decrease
      maxRegression: 0.02
    - metric: halo.latency.p95_ms
      direction: decrease
      maxRegression: 0.10
stopping:
  method: msprt
  alpha: 0.05
  minSamples: 1000
  maxDays: 21
