# Run by `gitlab-ci-local --file test/ci/gitlab-ci.yml` in CI (job gitlab): consumes the shipped
# template the way a user's pipeline does, except `include: local` stands in for `include: remote`.
include:
  - local: deploy/ci/gitlab/halos.gitlab-ci.yml
variables:
  HALOS_VERSION: v0.1.1
halo-validate:
  extends: .halos
  image: buildpack-deps:bookworm-curl
  script:
    - halo version
    # The example policy as of the pinned release: HEAD's examples may use schema the old CLI predates.
    - curl -fsSL --proto '=https' --tlsv1.2 "https://codeload.github.com/dshakes/halos/tar.gz/refs/tags/${HALOS_VERSION}" | tar xz -C /tmp
    - halo validate "/tmp/halos-${HALOS_VERSION#v}/examples/acme-corp"
unpinned-is-refused:
  extends: .halos
  image: buildpack-deps:bookworm-curl
  variables: {HALOS_VERSION: ""}
  script: [echo "must not run"]
