version: 2
project_name: halos
# Local builds compile the web console here. CI (release.yml) builds it in a
# separate unprivileged job and sets HALO_WEB_PREBUILT=1, so no npm code runs
# in the job that holds the release/signing credentials.
before:
  hooks:
    # ponytail: hook `if:` is GoReleaser Pro only; a skipped hook runs `true`.
    - '{{ if isEnvSet "HALO_WEB_PREBUILT" }}true{{ else }}npm --prefix web ci --ignore-scripts{{ end }}'
    - '{{ if isEnvSet "HALO_WEB_PREBUILT" }}true{{ else }}npm --prefix web run build{{ end }}'
builds:
  - &build
    id: halo
    main: ./cmd/halo
    binary: halo
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"]
  - <<: *build
    id: halod
    main: ./cmd/halod
    binary: halod
  - <<: *build
    id: halo-shadow
    main: ./cmd/halo-shadow
    binary: halo-shadow
  - <<: *build
    id: halo-server
    main: ./cmd/halo-server
    binary: halo-server
    flags: [-trimpath, -tags=webdist]
  - <<: *build
    id: halo-proxy
    main: ./cmd/halo-proxy
    binary: halo-proxy
  - <<: *build
    id: halo-kong
    main: ./cmd/halo-kong
    binary: halo-kong
    goos: [linux] # Kong plugin server; runs in the Kong container
  # FIPS 140-3 variants (ADR-0038): the same binaries built against Go's frozen
  # FIPS module v1.0.0 (GOFIPS140), which also makes GODEBUG=fips140=on the
  # default. Shipped as *_fips_* archives and -fips image tags alongside the
  # standard artifacts, never instead of them.
  - &fips
    <<: *build
    id: halo-fips
    env: [CGO_ENABLED=0, GOFIPS140=v1.0.0]
  - <<: *fips
    id: halod-fips
    main: ./cmd/halod
    binary: halod
  - <<: *fips
    id: halo-shadow-fips
    main: ./cmd/halo-shadow
    binary: halo-shadow
  - <<: *fips
    id: halo-server-fips
    main: ./cmd/halo-server
    binary: halo-server
    flags: [-trimpath, -tags=webdist]
  - <<: *fips
    id: halo-proxy-fips
    main: ./cmd/halo-proxy
    binary: halo-proxy
dockers_v2:
  - &img
    id: halo-server
    ids: [halo-server]
    images: [ghcr.io/dshakes/halo-server]
    tags: ["{{ .Version }}", "{{ if not .Prerelease }}latest{{ end }}"] # an rc never moves latest
    dockerfile: deploy/docker/Dockerfile.service
    platforms: [linux/amd64, linux/arm64]
    build_args: {BINARY: halo-server}
    sbom: true
    labels:
      org.opencontainers.image.source: https://github.com/dshakes/halos
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0
  - <<: *img
    id: halo-proxy
    ids: [halo-proxy]
    images: [ghcr.io/dshakes/halo-proxy]
    build_args: {BINARY: halo-proxy}
  - <<: *img
    id: halo-shadow
    ids: [halo-shadow]
    images: [ghcr.io/dshakes/halo-shadow]
    build_args: {BINARY: halo-shadow}
  - <<: *img
    id: halo-kong
    ids: [halo-kong]
    images: [ghcr.io/dshakes/kong-halo]
    dockerfile: deploy/docker/Dockerfile.kong
    build_args: {}
  # -fips tags of the same repos: FIPS builds on the same distroless base.
  - &fipsimg
    <<: *img
    id: halo-server-fips
    ids: [halo-server-fips]
    images: [ghcr.io/dshakes/halo-server]
    tags: ["{{ .Version }}-fips", "{{ if not .Prerelease }}latest-fips{{ end }}"]
    dockerfile: deploy/docker/Dockerfile.service-fips
    build_args: {BINARY: halo-server}
  - <<: *fipsimg
    id: halo-proxy-fips
    ids: [halo-proxy-fips]
    images: [ghcr.io/dshakes/halo-proxy]
    build_args: {BINARY: halo-proxy}
  - <<: *fipsimg
    id: halo-shadow-fips
    ids: [halo-shadow-fips]
    images: [ghcr.io/dshakes/halo-shadow]
    build_args: {BINARY: halo-shadow}
archives:
  - &arc
    id: halo
    ids: [halo]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - {goos: windows, formats: [zip]}
  - <<: *arc
    id: halod
    ids: [halod]
  - <<: *arc
    id: halo-shadow
    ids: [halo-shadow]
  - <<: *arc
    id: halo-server
    ids: [halo-server]
  - <<: *arc
    id: halo-proxy
    ids: [halo-proxy]
  - <<: *arc
    id: halo-kong
    ids: [halo-kong]
  - &fipsarc
    <<: *arc
    id: halo-fips
    ids: [halo-fips]
    name_template: "{{ .Binary }}_fips_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - <<: *fipsarc
    id: halod-fips
    ids: [halod-fips]
  - <<: *fipsarc
    id: halo-shadow-fips
    ids: [halo-shadow-fips]
  - <<: *fipsarc
    id: halo-server-fips
    ids: [halo-server-fips]
  - <<: *fipsarc
    id: halo-proxy-fips
    ids: [halo-proxy-fips]
nfpms:
  # deb/rpm/apk. halod is installed but never enabled or enrolled: the operator
  # writes /etc/halos/halod.yaml and runs `systemctl enable --now halod`.
  - &pkg
    id: halo
    ids: [halo]
    package_name: halo
    vendor: Halos
    homepage: https://dshakes.github.io/halos
    maintainer: Halos <https://github.com/dshakes/halos/issues>
    description: Halos CLI - policy repo to signed releases for AI coding CLIs.
    license: Apache-2.0
    formats: [deb, rpm, apk]
    bindir: /usr/bin
  - <<: *pkg
    id: halod
    ids: [halod]
    package_name: halod
    description: Halos fleet agent - pulls, verifies and applies the ring's signed release.
    contents:
      - {src: deploy/packaging/halod.service, dst: /usr/lib/systemd/system/halod.service}
      - {dst: /etc/halos, type: dir, file_info: {mode: 0755, owner: root, group: root}}
    scripts:
      postinstall: deploy/packaging/postinstall.sh
      preremove: deploy/packaging/preremove.sh
      postremove: deploy/packaging/postremove.sh
# The tap/bucket repos and tokens are only needed on a real release; snapshot
# builds skip every publisher. Prereleases build the manifests but do not push.
brews:
  - ids: [halo]
    name: halo
    homepage: https://dshakes.github.io/halos
    description: Control plane for AI coding CLIs (Claude Code, Codex, Gemini)
    license: Apache-2.0
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
    repository: {owner: dshakes, name: homebrew-tap, token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'}
    directory: Formula # the tap keeps every formula under Formula/ (as compass.rb, distil.rb)
    test: system "#{bin}/halo", "version"
scoops:
  - ids: [halo]
    name: halo # halo.json, `scoop install halo` (default would be the project name, halos)
    homepage: https://dshakes.github.io/halos
    description: Control plane for AI coding CLIs (Claude Code, Codex, Gemini)
    license: Apache-2.0
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
    repository: {owner: dshakes, name: scoop-bucket, token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'}
winget:
  # Manifest stub: skip_upload keeps it a local artifact (dist/winget) to submit to microsoft/winget-pkgs by hand.
  - ids: [halo]
    name: halo
    publisher: Halos
    package_identifier: Halos.Halo
    short_description: Control plane for AI coding CLIs (Claude Code, Codex, Gemini)
    license: Apache-2.0
    homepage: https://dshakes.github.io/halos
    publisher_url: https://github.com/dshakes/halos
    skip_upload: true
    repository: {owner: dshakes, name: winget-pkgs, branch: "halo-{{ .Version }}"}
checksum:
  name_template: checksums.txt
sboms:
  - artifacts: archive # requires syft on PATH
signs:
  - cmd: cosign
    # cosign v3 writes one Sigstore bundle (signature + certificate + tlog proof).
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, --yes, "--bundle=${signature}", "${artifact}"]
    artifacts: checksum # keyless: uses GitHub OIDC token
changelog:
  use: github
docker_signs:
  - cmd: cosign # keyless: uses GitHub OIDC token
    artifacts: images
    output: true
    args: [sign, --yes, "${artifact}@${digest}"]
release:
  github: {owner: dshakes, name: halos}
  prerelease: auto # vX.Y.Z-rc.N is a prerelease, never "Latest"
  replace_existing_artifacts: true # a re-run from the tag (workflow_dispatch) finishes a partial release
