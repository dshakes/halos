# Generated by Halos (internal/gateway/kong). Kong requirements:
#   - nginx_http_client_body_buffer_size = 32m (env KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE=32m):
#     halo-kong must read the whole body in memory; bodies Kong spools to disk get 413.
#   - When shadow_url is set: HALO_SHADOW_TOKEN in Kong's environment AND nginx_main_env=HALO_SHADOW_TOKEN
#     (env KONG_NGINX_MAIN_ENV=HALO_SHADOW_TOKEN) so nginx passes it to the halo-kong plugin server.
_format_version: "3.0"
services:
    - name: halo-anthropic
      url: http://anthropic-mock:9000
      retries: 0
      connect_timeout: 5000
      read_timeout: 600000
      write_timeout: 600000
    - name: halo-orch
      url: http://orch-mock:9000
      retries: 0
      connect_timeout: 5000
      read_timeout: 600000
      write_timeout: 600000
      plugins:
        - name: halo-kong
          config:
            identity_header: x-acme-user
            policy_path: /etc/halos/policy.json
            shadow_token: '{vault://env/halo-shadow-token}'
            shadow_url: http://halo-shadow:8090/mirror
      routes:
        - name: halo-messages
          paths:
            - ~/v1/messages$
          protocols:
            - http
            - https
          strip_path: false
          preserve_host: false
          request_buffering: true
          response_buffering: false
        - name: halo-count-tokens
          paths:
            - ~/v1/messages/count_tokens$
          protocols:
            - http
            - https
          strip_path: false
          preserve_host: false
          request_buffering: true
          response_buffering: false
        - name: halo-models
          paths:
            - ~/v1/models$
          protocols:
            - http
            - https
          strip_path: false
          preserve_host: false
          request_buffering: true
          response_buffering: false
        - name: halo-bedrock
          paths:
            - ~/model/[^/]+/(invoke|invoke-with-response-stream)$
          protocols:
            - http
            - https
          strip_path: false
          preserve_host: false
          request_buffering: true
          response_buffering: false
        - name: halo-responses
          paths:
            - ~/v1/responses$
          protocols:
            - http
            - https
          strip_path: false
          preserve_host: false
          request_buffering: true
          response_buffering: false
