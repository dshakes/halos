# Client (JWT from the IdP) -> Kong + halo-kong -> mock upstreams.
# halo-kong verifies the bearer JWT against the issuer's JWKS itself, so Kong can
# sit BEFORE any auth gateway: client-supplied identity/x-halo-* headers are never trusted.
# Get a token:  curl 'localhost:8081/token?user=alice@acme.com&groups=ai-platform'
name: halos
services:
  mock-idp:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile.svc, args: {PKG: ./deploy/compose/mockidp}}
    environment: {ISSUER: "http://mock-idp:8080", AUDIENCE: halos-gateway}
    ports: ["${HALO_IDP_PORT:-8081}:8080"]

  kong:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile.kong}
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      KONG_PLUGINS: bundled,halo-kong
      KONG_PLUGINSERVER_NAMES: halo-kong
      KONG_PLUGINSERVER_HALO_KONG_START_CMD: /usr/local/bin/halo-kong
      KONG_PLUGINSERVER_HALO_KONG_QUERY_CMD: /usr/local/bin/halo-kong -dump
      KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE: 32m   # halo-kong reads the whole body in memory; spooled bodies get 413
      HALO_SHADOW_TOKEN: dev-only-token               # kong.yml references it as {vault://env/halo-shadow-token}
      KONG_NGINX_MAIN_ENV: HALO_SHADOW_TOKEN          # nginx strips env otherwise; the halo-kong plugin server needs it
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
      - ./policy.json:/etc/halos/policy.json:ro
    ports: ["${HALO_PORT:-8080}:8000"]
    depends_on: [orch-mock, anthropic-mock, halo-shadow, mock-idp]

  orch-mock:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile.svc, args: {PKG: ./deploy/compose/mockllm}}
    environment: {MOCK_NAME: orch}
  anthropic-mock:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile.svc, args: {PKG: ./deploy/compose/mockllm}}
    environment: {MOCK_NAME: anthropic}

  halo-shadow:
    build: {context: ../.., dockerfile: deploy/compose/Dockerfile.svc, args: {PKG: ./cmd/halo-shadow}}
    # Upstreams come from the policy snapshot, never from the mirror job.
    command: ["-listen", ":8090", "-policy", "/etc/halos/policy.json", "-out", "/data/pairs.jsonl", "-budget-usd", "5"]
    environment: {HALO_SHADOW_TOKEN: dev-only-token}
    volumes: ["pairs:/data", "./policy.json:/etc/halos/policy.json:ro"]
    ports: ["127.0.0.1:8090:8090"]

volumes: {pairs: {}}
