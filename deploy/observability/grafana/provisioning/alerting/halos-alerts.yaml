              to: 0
            datasourceUid: prometheus
            model:
              expr: |-
                (sum(rate(halo_proxy_requests_total{status=~"5.."}[5m]))
                  / sum(rate(halo_proxy_requests_total[5m])) > 0.01) * 0 + 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: halo-proxy 5xx rate above 1% for 10m (SLO 99.9% / 30d)
        labels:
          severity: page
