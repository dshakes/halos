# Include inside an http{} block (e.g. /etc/nginx/conf.d/halo-proxy.conf).
upstream halo_proxy {
    server halo-proxy:8088;
    keepalive 32;
}

server {
    listen 8080;

    location ~ ^/(v1/messages|v1/responses|v1/models|model/) {
        proxy_pass http://halo_proxy;             # no URI part: the original (still-encoded) URI is passed through
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming: never buffer the response (SSE / eventstream).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 32m;               # match halo-proxy maxBodyBytes
    }
}
