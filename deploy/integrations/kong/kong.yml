# GENERATED by internal/gateway/adapters (go test ./internal/gateway/adapters -update). decK format.
# Kong routes model traffic to halo-proxy; halo-proxy verifies the caller's JWT, assigns the
# ring/variant, rewrites the model and forwards to the policy upstream (or --next-hop).
_format_version: "3.0"
services:
  - name: halo-proxy
    url: http://halo-proxy:8088
    retries: 0                                  # a retried LLM call is a duplicated bill
    connect_timeout: 5000
    read_timeout: 600000
    write_timeout: 600000
    routes:
      - name: halo-llm
        paths: [/v1/messages, /v1/responses, /v1/models, /model/]
        protocols: [http, https]
        strip_path: false                       # halo-proxy matches on the original path
        preserve_host: false
        request_buffering: true
        response_buffering: false               # keep SSE / eventstream incremental
    # Put your existing auth plugin on this service/route ONLY if it forwards the client's
    # Authorization header unchanged (halo-proxy verifies that JWT). Otherwise run halo-proxy
    # in trusted_header mode with trustedProxyCIDRs = Kong's addresses (see README).
