# Generated by Halos (internal/telemetry). Do not edit by hand.
exporters:
  clickhouse:
    create_schema: true
    database: halo
    endpoint: tcp://clickhouse:9000
    password: ${env:CLICKHOUSE_PASSWORD}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_elapsed_time: 300s
      max_interval: 30s
    timeout: 10s
    ttl: 720h
    username: ${env:CLICKHOUSE_USER}
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_constant_labels:
      included:
        - halo.*
extensions:
  bearertokenauth/gateway:
    token: ${env:HALO_OTLP_GATEWAY_TOKEN}
  health_check:
    endpoint: 0.0.0.0:13133
processors:
  batch:
    send_batch_size: 8192
    timeout: 5s
  cumulativetodelta: {}
  filter/drop-gateway:
    error_mode: ignore
    metrics:
      metric:
        - IsMatch(name, "^halo\\.gateway\\.")
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  transform/halo:
    error_mode: ignore
    metric_statements:
      - context: metric
        statements:
          - set(resource.attributes["halo.harness"], "claude-code") where name == "claude_code.cost.usage" and resource.attributes["halo.harness"] == nil
          - set(resource.attributes["halo.harness"], "claude-code") where name == "claude_code.token.usage" and resource.attributes["halo.harness"] == nil
          - set(resource.attributes["halo.harness"], "claude-code") where name == "claude_code.code_edit_tool.decision" and resource.attributes["halo.harness"] == nil
          - set(resource.attributes["halo.harness"], "claude-code") where name == "claude_code.session.count" and resource.attributes["halo.harness"] == nil
          - set(resource.attributes["halo.harness"], "claude-code") where name == "claude_code.lines_of_code.count" and resource.attributes["halo.harness"] == nil
          - set(resource.attributes["halo.harness"], "claude-code") where name == "claude_code.pull_request.count" and resource.attributes["halo.harness"] == nil
          - set(resource.attributes["halo.harness"], "claude-code") where name == "claude_code.commit.count" and resource.attributes["halo.harness"] == nil
          - set(resource.attributes["halo.harness"], "claude-code") where name == "claude_code.active_time.total" and resource.attributes["halo.harness"] == nil
          - set(resource.attributes["halo.harness"], "gemini-cli") where name == "gen_ai.client.token.usage" and resource.attributes["halo.harness"] == nil
          - set(resource.attributes["halo.harness"], "gemini-cli") where name == "gen_ai.client.operation.duration" and resource.attributes["halo.harness"] == nil
          - set(resource.attributes["halo.harness"], "gemini-cli") where name == "gemini_cli.session.count" and resource.attributes["halo.harness"] == nil
          - set(resource.attributes["halo.harness"], "gemini-cli") where name == "gemini_cli.tool.call.count" and resource.attributes["halo.harness"] == nil
          - set(name, "halo.cost.usd") where name == "claude_code.cost.usage"
          - set(name, "halo.tokens") where name == "claude_code.token.usage"
          - set(name, "halo.edit.decision") where name == "claude_code.code_edit_tool.decision"
          - set(name, "halo.sessions") where name == "claude_code.session.count"
          - set(name, "halo.loc") where name == "claude_code.lines_of_code.count"
          - set(name, "halo.pull_requests") where name == "claude_code.pull_request.count"
          - set(name, "halo.commits") where name == "claude_code.commit.count"
          - set(name, "halo.active_time.seconds") where name == "claude_code.active_time.total"
          - set(name, "halo.tokens") where name == "gen_ai.client.token.usage"
          - set(name, "halo.operation.duration") where name == "gen_ai.client.operation.duration"
          - set(name, "halo.sessions") where name == "gemini_cli.session.count"
          - set(name, "halo.tool.calls") where name == "gemini_cli.tool.call.count"
  transform/source-cli:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(datapoint.attributes["halo.source"], "cli")
          - delete_key(resource.attributes, "halo.source")
  transform/source-gateway:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(datapoint.attributes["halo.source"], "gateway")
          - delete_key(resource.attributes, "halo.source")
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 4194304
  otlp/gateway:
    protocols:
      http:
        auth:
          authenticator: bearertokenauth/gateway
        endpoint: 0.0.0.0:4319
service:
  extensions:
    - bearertokenauth/gateway
    - health_check
  pipelines:
    logs:
      exporters:
        - clickhouse
      processors:
        - memory_limiter
        - batch
      receivers:
        - otlp
    metrics/clickhouse:
      exporters:
        - clickhouse
      processors:
        - memory_limiter
        - filter/drop-gateway
        - cumulativetodelta
        - transform/source-cli
        - transform/halo
        - batch
      receivers:
        - otlp
    metrics/gateway:
      exporters:
        - clickhouse
      processors:
        - memory_limiter
        - cumulativetodelta
        - transform/source-gateway
        - batch
      receivers:
        - otlp/gateway
    metrics/prometheus:
      exporters:
        - prometheus
      processors:
        - memory_limiter
        - filter/drop-gateway
        - transform/halo
        - batch
      receivers:
        - otlp
