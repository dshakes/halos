{{- range $c := list "server" "proxy" }}
{{- $v := index $.Values $c }}
{{- if and $v.enabled $v.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "halo.cname" (list $ $c) }}
  labels: {{- include "halo.labels" $ | nindent 4 }}
  {{- with $v.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $v.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $v.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $v.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "halo.cname" (list $ $c) }}
                port: {name: http}
    {{- end }}
{{- end }}
{{- end }}
