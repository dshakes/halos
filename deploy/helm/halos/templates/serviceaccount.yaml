{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "halo.serviceAccountName" . }}
  labels: {{- include "halo.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if and .Values.proxy.enabled .Values.proxy.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "halo.proxyServiceAccountName" . }}
  labels: {{- include "halo.labels" . | nindent 4 }}
  {{- with .Values.proxy.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- else if .Values.proxy.serviceAccount.annotations }}
{{- fail "proxy.serviceAccount.annotations requires proxy.serviceAccount.create=true" }}
{{- end }}
