{{- /* git auth for the writer clone (init clone + halo-server's fetch/push); credentials never go in the URL. */}}
{{- define "halo.writerGitEnv" -}}
{{- $g := .Values.policy.gitSync -}}
- {name: GIT_TERMINAL_PROMPT, value: "0"}
{{- if eq $g.auth.type "token" }}
- {name: GIT_ASKPASS, value: /etc/halos-git/askpass.sh}
- {name: GIT_USERNAME, value: {{ $g.auth.username | quote }}}
{{- else if eq $g.auth.type "ssh" }}
- {name: GIT_SSH_COMMAND, value: "ssh -i /etc/git-secret/ssh -o UserKnownHostsFile=/etc/git-secret/known_hosts -o IdentitiesOnly=yes"}
{{- end }}
{{- end -}}
{{- define "halo.writerGitMounts" -}}
- {name: policy-writer, mountPath: /policy-writer}
{{- if ne .Values.policy.gitSync.auth.type "none" }}
- {name: git-secret, mountPath: /etc/git-secret, readOnly: true}
{{- end }}
{{- if eq .Values.policy.gitSync.auth.type "token" }}
- {name: git-askpass, mountPath: /etc/halos-git, readOnly: true}
{{- end }}
{{- end -}}
{{- if .Values.server.enabled }}
{{- $s := .Values.server }}
{{- $n := include "halo.cname" (list . "server") }}
{{- $pol := printf "/policy/current%s" (ternary (printf "/%s" (trimAll "/" $s.policySubdir)) "" (ne $s.policySubdir "")) }}
{{- $c := $s.controller }}
{{- $ks := $s.killSwitch }}
{{- $pr := and $c.enabled $c.policyRepo.enabled }}
{{- /* ONE writable clone (/policy-writer/repo) serves console proposals and controller PRs (shared lock in halo-server). */}}
{{- $wr := or $s.proposals.enabled $pr }}
{{- $wsub := trimAll "/" (default $s.policySubdir $c.policyRepo.subdir) }}
{{- $wbase := default "main" $c.policyRepo.base }}
{{- $gt := $s.gatewayTokens | default dict }}{{- /* per-capability gateway bearer tokens (one Secret, a key per capability) */}}
{{- if and $gt.existingSecret (not (or $gt.killswitch $gt.posture $gt.budget $gt.directory)) }}{{ fail "server.gatewayTokens.existingSecret needs at least one of killswitch, posture, budget, directory (the Secret key holding that capability's token)" }}{{ end }}
{{- $ha := $s.database.existingSecret }}{{- /* shared Postgres state (ADR-0021): replicas may be > 1 */}}
{{- if and $ha .Values.networkPolicy.enabled (not .Values.networkPolicy.databaseEgress.to) }}{{ fail "server.database.existingSecret with networkPolicy.enabled needs networkPolicy.databaseEgress.to (the Postgres CIDR or peers): default-deny would block every replica from its database" }}{{ end }}
{{- if and $s.database.migrateJob.enabled (not $ha) }}{{ fail "server.database.migrateJob needs server.database.existingSecret" }}{{ end }}
{{- if and $ha $s.persistence.enabled }}{{ fail "server.database.existingSecret and server.persistence.enabled are exclusive: state lives in Postgres (move a data dir with `halo-server import`)" }}{{ end }}
{{- if and $s.autoscaling.enabled (not $ha) }}{{ fail "server.autoscaling.enabled requires server.database.existingSecret (the file backend is a single writer, see replicas)" }}{{ end }}
{{- if and (gt (int $s.replicas) 1) (not $ha) }}{{ fail "server.replicas > 1 requires server.database.existingSecret (file state has a single writer)" }}{{ end }}
{{- if and $ks.existingSecret (not $s.persistence.enabled) (not $ha) }}{{ fail "server.killSwitch.existingSecret requires server.persistence.enabled or server.database (kills must survive a restart)" }}{{ end }}
{{- $audit := $s.audit | default dict }}
{{- $sess := $s.session | default dict }}
{{- $bgx := $s.breakGlass | default dict }}{{- /* break-glass local admin (ADR-0036): sealed unless enabled */}}
{{- if and $bgx.enabled (not $bgx.existingSecret) }}{{ fail "server.breakGlass.enabled needs server.breakGlass.existingSecret (the Secret holding the `halo-server breakglass-hash` output)" }}{{ end }}
{{- if and $bgx.enabled (not $bgx.allowedCIDRs) }}{{ fail "server.breakGlass.enabled needs server.breakGlass.allowedCIDRs (the VPN or bastion range): without it anyone can lock break-glass with failed logins" }}{{ end }}
{{- range $c := splitList "," ($bgx.allowedCIDRs | default "") }}{{- $c = trim $c }}{{- if $c }}{{- $parts := splitList "/" $c }}{{- if ne (len $parts) 2 }}{{ fail (printf "server.breakGlass.allowedCIDRs: %q is not address/prefix" $c) }}{{ end }}{{- $bits := atoi (index $parts 1) }}{{- if or (and (contains ":" $c) (lt $bits 32)) (and (not (contains ":" $c)) (lt $bits 8)) }}{{ fail (printf "server.breakGlass.allowedCIDRs: %s is too broad (IPv4 must be /8 or longer, IPv6 /32 or longer): anyone in it could spend the global failure budget and keep break-glass locked; use the VPN or bastion range" $c) }}{{ end }}{{- end }}{{- end }}
{{- if and $audit (not $s.persistence.enabled) (not $ha) }}{{ fail "server.audit requires server.persistence.enabled or server.database (export cursors must survive a restart)" }}{{ end }}
{{- if and $ha $audit.rotation }}{{ fail "server.audit.rotation is for the file backend; on Postgres the audit chain is one table (ADR-0021)" }}{{ end }}
{{- if $c.enabled }}
{{- if not $c.clickhouse.url }}{{ fail "server.controller.clickhouse.url is required when server.controller.enabled" }}{{ end }}
{{- if and (not $s.persistence.enabled) (not $ha) }}{{ fail "server.controller.enabled requires server.persistence.enabled or server.database (action log)" }}{{ end }}
{{- end }}
{{- $srvImg := $s.image }}
{{- if and $pr $c.policyRepo.image.repository }}{{ $srvImg = $c.policyRepo.image }}{{ end }}
{{- $portal := deepCopy $s.portal }}
{{- if $s.sessionKey.existingSecret }}{{ $_ := set $portal "sessionKeyFile" "/secrets/session-key" }}{{ end }}
{{- if $s.oidcClientSecret.existingSecret }}{{ $_ := set $portal "oidcClientSecretFile" "/secrets/oidc-client-secret" }}{{ end }}
{{- if $s.proposals.enabled }}
{{- $_ := set $portal "policyRepoDir" "/policy-writer/repo" }}
{{- $wsub = trimAll "/" (default $wsub $portal.policySubdir) }}{{ $_ := set $portal "policySubdir" $wsub }}
{{- $wbase = default $wbase $portal.policyBase }}{{ $_ := set $portal "policyBase" $wbase }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $n }}
  labels: {{- include "halo.labels" . | nindent 4 }}
data:
  portal.json: |
    {{- toPrettyJson $portal | nindent 4 }}
  {{- if $audit }}
  # Secret refs only ({env}/{file}); values.schema.json rejects literals.
  audit.json: |
    {{- toPrettyJson $audit | nindent 4 }}
  {{- end }}
  {{- if $wr }}
  # GIT_ASKPASS helper: the token is read from the mounted Secret, never put in the remote URL.
  askpass.sh: |
    #!/bin/sh
    case "$1" in
      Username*) printf '%s\n' "$GIT_USERNAME" ;;
      *) cat /etc/git-secret/password ;;
    esac
  {{- end }}
---
{{- if and $s.persistence.enabled (not $s.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $n }}-data
  labels: {{- include "halo.labels" . | nindent 4 }}
  annotations: {"helm.sh/resource-policy": keep}
spec:
  accessModes: {{- toYaml $s.persistence.accessModes | nindent 4 }}
  {{- with $s.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources: {requests: {storage: {{ $s.persistence.size }}}}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}
  labels: {{- include "halo.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with $s.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $s.service.type }}
  selector: {{- include "halo.selector" (list . "server") | nindent 4 }}
  ports:
    - {name: http, port: {{ $s.service.port }}, targetPort: http}
    {{- if $s.metrics.enabled }}
    - {name: metrics, port: {{ $s.metrics.port }}, targetPort: metrics}   # unauthenticated; NetworkPolicy limits to metricsFrom
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n }}
  labels: {{- include "halo.labels" . | nindent 4 }}
spec:
  {{- if not $s.autoscaling.enabled }}
  replicas: {{ $s.replicas }}
  {{- end }}
  {{- if $s.persistence.enabled }}
  strategy: {type: Recreate}   # RWO volume: old pod must release it first
  {{- end }}
  selector:
    matchLabels: {{- include "halo.selector" (list . "server") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "halo.selector" (list . "server") | nindent 8 }}
      annotations:
        checksum/config: {{ ternary (printf "%s%s" (toJson $portal) (toJson $audit)) (toJson $portal) (not (empty $audit)) | sha256sum }}
        {{- with $s.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      serviceAccountName: {{ include "halo.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "halo.pullSecrets" . | nindent 6 }}
      initContainers:
        {{- include "halo.gitsync" (dict "root" . "name" "git-sync-init" "once" true "link" "current" "dir" "/policy" "vol" "policy") | nindent 8 }}
        {{- if $wr }}
        # A real clone (origin remote, branch checked out) that halo-server then fetches/hard-resets
        # before each PR (promote.SyncClone). git-sync worktrees are detached with no origin, so they
        # cannot be used here. Skipped when the emptyDir already holds a clone (init re-run).
        - name: git-clone-writer
          image: {{ include "halo.image" (list . $srvImg) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [sh, -c, 'test -d "$3/.git" || exec git clone --quiet --branch "$2" -c user.name=Halos -c user.email=halos@users.noreply.invalid "$1" "$3"', clone]
          args: [{{ .Values.policy.gitSync.repo | quote }}, {{ $wbase | quote }}, /policy-writer/repo]
          env:
            - {name: HOME, value: /tmp}
            {{- include "halo.writerGitEnv" . | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.policy.gitSync.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- include "halo.writerGitMounts" . | nindent 12 }}
        {{- end }}
      containers:
        - name: halo-server
          image: {{ include "halo.image" (list . $srvImg) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen=0.0.0.0:{{ $s.port }}
            - --policy-dir={{ $pol }}
            - --token-file=/secrets/fleet-token
            - --portal-config=/etc/halos/portal.json
            {{- if $s.persistence.enabled }}
            - --data-dir=/data
            {{- end }}
            {{- if $ha }}
            - --database-url-file=/secrets/database-url
            - --leader-lease-ttl={{ $s.database.leaseTTL }}
            - --database-max-conns={{ $s.database.maxConns | default 16 }}
            {{- if $s.database.insecureTLS }}
            - --database-insecure-tls
            {{- end }}
            {{- if $s.database.autoMigrate }}
            - --auto-migrate
            {{- end }}
            {{- end }}
            {{- if $audit }}
            - --audit-config=/etc/halos/audit.json
            {{- end }}
            {{- with $s.trustedProxyCIDRs }}
            - --trusted-proxy-cidrs={{ . }}
            {{- end }}
            - --session-ttl={{ $sess.ttl | default "12h" }}
            - --session-idle-timeout={{ $sess.idleTimeout | default "1h" }}
            - --service-token-max-ttl={{ (($s.serviceTokens | default dict).maxTTL) | default "2160h" }}
            {{- if $bgx.existingSecret }}
            - --breakglass-hash-file=/secrets/breakglass-hash
            - --breakglass-user={{ $bgx.user | default "breakglass" }}
            {{- with $bgx.allowedCIDRs }}
            - --breakglass-allowed-cidrs={{ . }}
            {{- end }}
            {{- if $bgx.enabled }}
            - --breakglass-enabled
            {{- end }}
            {{- end }}
            {{- with (($s.oidc | default dict).entraGraphURL) }}
            - --entra-graph-url={{ . }}
            {{- end }}
            {{- if $s.metrics.enabled }}
            - --metrics-listen=:{{ $s.metrics.port }}
            {{- end }}
            {{- if $ks.existingSecret }}
            - --killswitch-key-file=/secrets/killswitch-key
            - --gateway-token-file=/secrets/gateway-token
            {{- end }}
            {{- if $gt.existingSecret }}
            {{- range $cap := list "killswitch" "posture" "budget" "directory" }}
            {{- if index $gt $cap }}
            - --gateway-{{ $cap }}-token-file=/secrets/gateway-{{ $cap }}-token
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $c.enabled }}
            - --controller
            - --interval={{ $c.interval }}
            - --clickhouse-url={{ $c.clickhouse.url }}
            {{- with $c.clickhouse.database }}
            - --clickhouse-database={{ . }}
            {{- end }}
            {{- if $c.clickhouse.existingSecret }}
            - --clickhouse-user=$(HALO_CLICKHOUSE_USER)
            - --clickhouse-password-file=/secrets/clickhouse-password
            {{- end }}
            {{- if $c.notify.slack.existingSecret }}
            - --notify-slack-url-file=/secrets/notify-slack-url
            {{- with $c.notify.slack.events }}
            - --notify-slack-events={{ . }}
            {{- end }}
            {{- end }}
            {{- if $c.notify.teams.existingSecret }}
            - --notify-teams-url-file=/secrets/notify-teams-url
            {{- with $c.notify.teams.events }}
            - --notify-teams-events={{ . }}
            {{- end }}
            {{- end }}
            {{- if $c.notify.webhook.existingSecret }}
            - --notify-webhook-url-file=/secrets/notify-webhook-url
            - --notify-webhook-secret-file=/secrets/notify-webhook-secret
            {{- with $c.notify.webhook.events }}
            - --notify-webhook-events={{ . }}
            {{- end }}
            {{- end }}
            {{- if $c.notify.pagerduty.existingSecret }}
            - --notify-pagerduty-routing-key-file=/secrets/notify-pagerduty-routing-key
            {{- with $c.notify.pagerduty.url }}
            - --notify-pagerduty-url={{ . }}
            {{- end }}
            {{- with $c.notify.pagerduty.events }}
            - --notify-pagerduty-events={{ . }}
            {{- end }}
            {{- end }}
            {{- if $pr }}
            - --policy-repo-dir=/policy-writer/repo
            {{- with $wsub }}
            - --policy-repo-subdir={{ . }}
            {{- end }}
            - --policy-repo-base={{ $wbase }}
            {{- with $c.policyRepo.forge }}
            - --forge={{ . }}
            {{- end }}
            {{- with $c.policyRepo.forgeBaseURL }}
            - --forge-base-url={{ . }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with $s.verdictsPath }}
            - --verdicts-file={{ . }}
            {{- end }}
            {{- range $s.args }}
            - {{ . | quote }}
            {{- end }}
          {{- if or $s.extraEnv (and $c.enabled $c.clickhouse.existingSecret) (and $pr $c.policyRepo.ghToken.existingSecret) (and $pr $c.policyRepo.gitlabToken.existingSecret) $wr }}
          env:
            {{- if $wr }}
            {{- include "halo.writerGitEnv" . | nindent 12 }}
            {{- end }}
            {{- if and $c.enabled $c.clickhouse.existingSecret }}
            - name: HALO_CLICKHOUSE_USER
              valueFrom: {secretKeyRef: {name: {{ $c.clickhouse.existingSecret }}, key: {{ $c.clickhouse.userKey }}}}
            {{- end }}
            {{- if and $pr $c.policyRepo.ghToken.existingSecret }}
            - name: GH_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $c.policyRepo.ghToken.existingSecret }}, key: {{ $c.policyRepo.ghToken.key }}}}
            {{- end }}
            {{- if and $pr $c.policyRepo.gitlabToken.existingSecret }}
            - name: GITLAB_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $c.policyRepo.gitlabToken.existingSecret }}, key: {{ $c.policyRepo.gitlabToken.key }}}}
            {{- end }}
            {{- with $s.extraEnv }}{{ toYaml . | nindent 12 }}{{ end }}
          {{- end }}
          ports:
            - {name: http, containerPort: {{ $s.port }}}
            {{- if $s.metrics.enabled }}
            - {name: metrics, containerPort: {{ $s.metrics.port }}}
            {{- end }}
          # /readyz fails while the policy is not loaded or (HA) Postgres is unreachable: the pod leaves the
          # Service, its peers keep serving. /healthz never checks the database: an outage must not restart pods.
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 2}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 20}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 30}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml $s.resources | nindent 12 }}
          volumeMounts:
            - {name: policy, mountPath: /policy, readOnly: true}
            {{- if $wr }}
            {{- include "halo.writerGitMounts" . | nindent 12 }}
            {{- end }}
            - {name: secrets, mountPath: /secrets, readOnly: true}
            - {name: portal, mountPath: /etc/halos, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if $s.persistence.enabled }}
            - {name: data, mountPath: /data}
            {{- end }}
            {{- with $s.extraVolumeMounts }}{{ toYaml . | nindent 12 }}{{ end }}
        # Continuous sync; halo-server reloads the policy by mtime (no SIGHUP needed).
        {{- include "halo.gitsync" (dict "root" . "name" "git-sync" "once" false "link" "current" "dir" "/policy" "vol" "policy") | nindent 8 }}
      {{- include "halo.topologySpread" (list . "server") | nindent 6 }}
      {{- with $s.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "halo.affinity" (list . "server" $s.affinity (or (gt (int $s.replicas) 1) $s.autoscaling.enabled)) | nindent 6 }}
      volumes:
        - {name: policy, emptyDir: {}}
        {{- if $wr }}
        - {name: policy-writer, emptyDir: {}}
        {{- if eq .Values.policy.gitSync.auth.type "token" }}
        - name: git-askpass
          configMap: {name: {{ $n }}, items: [{key: askpass.sh, path: askpass.sh}], defaultMode: 0555}
        {{- end }}
        {{- end }}
        - {name: tmp, emptyDir: {}}
        - name: portal
          configMap: {name: {{ $n }}}
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ $s.fleetToken.existingSecret }}
                  items: [{key: {{ $s.fleetToken.key }}, path: fleet-token}]
              {{- if $s.sessionKey.existingSecret }}
              - secret:
                  name: {{ $s.sessionKey.existingSecret }}
                  items: [{key: {{ $s.sessionKey.key }}, path: session-key}]
              {{- end }}
              {{- if $s.oidcClientSecret.existingSecret }}
              - secret:
                  name: {{ $s.oidcClientSecret.existingSecret }}
                  items: [{key: {{ $s.oidcClientSecret.key }}, path: oidc-client-secret}]
              {{- end }}
              {{- if $ha }}
              - secret:
                  name: {{ $ha }}
                  items: [{key: {{ $s.database.key }}, path: database-url}]
              {{- end }}
              {{- if $bgx.existingSecret }}
              - secret:
                  name: {{ $bgx.existingSecret }}
                  items: [{key: {{ $bgx.key | default "hash" }}, path: breakglass-hash}]
              {{- end }}
              {{- if $ks.existingSecret }}
              - secret:
                  name: {{ $ks.existingSecret }}
                  items: [{key: {{ $ks.signingKey }}, path: killswitch-key}, {key: {{ $ks.gatewayToken }}, path: gateway-token}]
              {{- end }}
              {{- if $gt.existingSecret }}
              - secret:
                  name: {{ $gt.existingSecret }}
                  items:
                    {{- range $cap := list "killswitch" "posture" "budget" "directory" }}
                    {{- with index $gt $cap }}
                    - {key: {{ . }}, path: gateway-{{ $cap }}-token}
                    {{- end }}
                    {{- end }}
              {{- end }}
              {{- if and $c.enabled $c.clickhouse.existingSecret }}
              - secret:
                  name: {{ $c.clickhouse.existingSecret }}
                  items: [{key: {{ $c.clickhouse.passwordKey }}, path: clickhouse-password}]
              {{- end }}
              {{- if and $c.enabled $c.notify.slack.existingSecret }}
              - secret:
                  name: {{ $c.notify.slack.existingSecret }}
                  items: [{key: {{ $c.notify.slack.key }}, path: notify-slack-url}]
              {{- end }}
              {{- if and $c.enabled $c.notify.teams.existingSecret }}
              - secret:
                  name: {{ $c.notify.teams.existingSecret }}
                  items: [{key: {{ $c.notify.teams.key }}, path: notify-teams-url}]
              {{- end }}
              {{- if and $c.enabled $c.notify.webhook.existingSecret }}
              - secret:
                  name: {{ $c.notify.webhook.existingSecret }}
                  items: [{key: {{ $c.notify.webhook.urlKey }}, path: notify-webhook-url}, {key: {{ $c.notify.webhook.secretKey }}, path: notify-webhook-secret}]
              {{- end }}
              {{- if and $c.enabled $c.notify.pagerduty.existingSecret }}
              - secret:
                  name: {{ $c.notify.pagerduty.existingSecret }}
                  items: [{key: {{ $c.notify.pagerduty.key }}, path: notify-pagerduty-routing-key}]
              {{- end }}
        {{- if $s.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" $n) $s.persistence.existingClaim }}
        {{- end }}
        {{- include "halo.gitsyncVolume" . | nindent 8 }}
        {{- with $s.extraVolumes }}{{ toYaml . | nindent 8 }}{{ end }}
{{- if or $s.pdb.enabled (and $ha (or (gt (int $s.replicas) 1) $s.autoscaling.enabled)) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $n }}
  labels: {{- include "halo.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ $s.pdb.maxUnavailable }}
  selector:
    matchLabels: {{- include "halo.selector" (list . "server") | nindent 6 }}
{{- end }}
{{- if $s.autoscaling.enabled }}
---
{{ include "halo.hpa" (dict "root" . "name" $n "a" $s.autoscaling) }}
{{- end }}
{{- end }}
