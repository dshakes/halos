# Rendered by Halos from cloudAgents.claude (ADR-0034). Do not edit: change policy and
# run `halo cloud-agents render`. For: every repository
name: Claude Code (Halos)
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
permissions: {}
jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install halo
        env:
          HALO_VERSION: v0.3.0
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/install.sh" "https://raw.githubusercontent.com/dshakes/halos/${HALO_VERSION}/install/install.sh"
          sh "$RUNNER_TEMP/install.sh" --version "$HALO_VERSION" --prefix "$RUNNER_TEMP/halo"
      - name: Halos workload credential (ADR-0023)
        env:
          HALO_SERVER: https://halo.acme.example
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/halo/bin/halo" ci token --format github --audience halos-ci
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          anthropic_api_key: ${{ env.HALO_GATEWAY_TOKEN }}
          settings: |
            {"permissions": {"disableBypassPermissionsMode": "disable"}}
