apiVersion: halos.dev/v1
kind: Gateway
name: corp-gateway
baseURL: https://ai-gw.corp.example
protocols:
  claude-code: anthropic-messages
auth: {}
models:
  default:
    model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
upstreams: {}
engine: external
---
apiVersion: halos.dev/v1
kind: Profile
name: default
harnesses:
  claude-code:
    version: 2.1.280
models:
  default: default
  allowed:
    - default
  enforce: true
permissions:
  mode: default
  deny:
    - Read(./.env)
    - Read(./.env.*)
    - Read(./secrets/**)
    - Read(~/.aws/**)
    - Read(~/.ssh/**)
  disableBypass: true
  sandbox: workspace-write
mcp:
  managedOnly: true
hooks:
  managedOnly: true
telemetry:
  enabled: true
egress: {}
---
apiVersion: halos.dev/v1
kind: Ring
name: ring0-team
order: 0
profile: default
membership:
  groups:
    - corp-ai-platform
---
apiVersion: halos.dev/v1
kind: Ring
name: ring1-canary
order: 1
profile: default
membership:
  percent: 5
---
apiVersion: halos.dev/v1
kind: Ring
name: ring2-early
order: 2
profile: default
membership:
  percent: 25
---
apiVersion: halos.dev/v1
kind: Ring
name: ring3-ga
order: 3
profile: default
membership:
  default: true
