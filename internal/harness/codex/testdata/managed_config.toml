approval_policy = 'on-request'
model = 'halo-sonnet'
model_provider = 'halos'
sandbox_mode = 'workspace-write'

[mcp_servers]
[mcp_servers.docs]
disabled_tools = ['delete_page']
enabled_tools = ['search', 'fetch']
url = 'https://mcp.example.com/docs'

[mcp_servers.docs.http_headers]
X-Org = 'acme'

[mcp_servers.lint]
args = ['-y', 'lint-mcp']
command = 'npx'

[mcp_servers.tickets]
url = 'https://mcp.example.com/tickets'

[model_providers]
[model_providers.halos]
base_url = 'https://gw.example.com/v1'
env_key = 'HALO_GATEWAY_TOKEN'
name = 'Halos'
wire_api = 'responses'

[model_providers.halos.http_headers]
x-halo-release = 'sha256:abc'
x-halo-ring = 'canary'

[otel]
environment = 'canary'
log_user_prompt = true

[otel.exporter]
[otel.exporter.otlp-grpc]
endpoint = 'https://otel.example.com:4317'

[otel.exporter.otlp-grpc.headers]
[plugins]
[plugins.'audit@acme-plugins']
enabled = true

[plugins.'risky@acme-plugins']
enabled = false
