allowed_approval_policies = ['on-request']
allowed_login_methods = ['api']
allowed_sandbox_modes = ['read-only', 'workspace-write']

[experimental_network]
allowed_domains = ['example.com', 'github.com']
enabled = true
managed_allowed_domains_only = true

[marketplaces]
restrict_to_allowed_sources = true

[marketplaces.allowed_sources]
[marketplaces.allowed_sources.source_1]
ref = 'v1'
source = 'git'
url = 'https://github.com/acme/plugins.git'

[marketplaces.allowed_sources.source_2]
host_pattern = '^git\.example\.com$'
source = 'host_pattern'

[mcp_servers]
[mcp_servers.docs]
[mcp_servers.docs.identity]
url = 'https://mcp.example.com/docs'

[mcp_servers.lint]
[mcp_servers.lint.identity]
[mcp_servers.lint.identity.command]
executable = 'npx'

[[mcp_servers.lint.identity.command.args]]
match = 'exact'
value = '-y'

[[mcp_servers.lint.identity.command.args]]
match = 'exact'
value = 'lint-mcp'

[mcp_servers.tickets]
[mcp_servers.tickets.identity]
url = 'https://mcp.example.com/tickets'
