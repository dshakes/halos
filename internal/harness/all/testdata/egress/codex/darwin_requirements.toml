allowed_sandbox_modes = ['read-only', 'workspace-write']

[experimental_network]
allowed_domains = ['gw.example.com', 'registry.npmjs.org', 'pypi.org', 'files.pythonhosted.org', 'proxy.golang.org', 'sum.golang.org', 'index.crates.io', 'static.crates.io', 'repo.maven.apache.org', 'rubygems.org']
denied_domains = ['pastebin.com']
enabled = true
managed_allowed_domains_only = true

[permissions]
[permissions.filesystem]
deny_read = ['~/.ssh', '~/.aws', '/etc/secrets']
