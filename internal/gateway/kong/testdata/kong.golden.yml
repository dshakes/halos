# Generated by Halos (internal/gateway/kong). Kong requirements:
#   - nginx_http_client_body_buffer_size = 32m (env KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE=32m):
#     halo-kong must read the whole body in memory; bodies Kong spools to disk get 413.
#   - Every secret halo-kong reads from its environment (HALO_SHADOW_TOKEN when shadow_url is set;
#     HALO_KILLSWITCH_TOKEN and HALO_KILLSWITCH_PUBKEY when killswitch_url is set) must be in Kong's
#     environment AND in nginx's main-context env list, or the plugin server never sees it (a missing
#     kill-switch key shows up as x-halo-killswitch: misconfigured). nginx_main_env is ONE setting; chain
#     several variables with "; env ", e.g. (verified on Kong OSS 3.9.3):
#       KONG_NGINX_MAIN_ENV="HALO_SHADOW_TOKEN; env HALO_KILLSWITCH_TOKEN; env HALO_KILLSWITCH_PUBKEY"
_format_version: "3.0"
services:
    - name: halo-anthropic
      url: https://api.anthropic.com
      retries: 0
      connect_timeout: 5000
      read_timeout: 600000
      write_timeout: 600000
    - name: halo-orch
      url: https://orchestrator.internal:8443
      retries: 0
      connect_timeout: 5000
      read_timeout: 600000
      write_timeout: 600000
      plugins:
        - name: halo-kong
          config:
            groups_header: x-acme-groups
            identity_header: x-acme-user
            policy_path: /etc/halos/policy.json
            shadow_token: '{vault://env/halo-shadow-token}'
            shadow_url: http://halo-shadow:8090/mirror
      routes:
        - name: halo-messages
          paths:
            - ~/v1/messages$
          protocols:
            - https
          strip_path: false
          preserve_host: false
          request_buffering: true
          response_buffering: false
        - name: halo-count-tokens
          paths:
            - ~/v1/messages/count_tokens$
          protocols:
            - https
          strip_path: false
          preserve_host: false
          request_buffering: true
          response_buffering: false
        - name: halo-models
          paths:
            - ~/v1/models$
          protocols:
            - https
          strip_path: false
          preserve_host: false
          request_buffering: true
          response_buffering: false
        - name: halo-bedrock
          paths:
            - ~/model/[^/]+/(invoke|invoke-with-response-stream)$
          protocols:
            - https
          strip_path: false
          preserve_host: false
          request_buffering: true
          response_buffering: false
        - name: halo-responses
          paths:
            - ~/v1/responses$
          protocols:
            - https
          strip_path: false
          preserve_host: false
          request_buffering: true
          response_buffering: false
