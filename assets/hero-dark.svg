<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 318" width="880" height="318" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif">
<title id="t">Halos</title>
<desc id="d">Policy as code becomes a signed release, rolls out through rings 0, 1, 2 and GA to every environment, and evidence from evals and telemetry loops back to promote or roll back.</desc>
<style>
.cv{fill:#0d0f14;stroke:#1f232c;stroke-width:1.5}
.card{fill:#14171e;stroke:#2a2f3a;stroke-width:1.5}
.soft{fill:url(#gs)}
.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.dcard{fill:#2a1517;stroke:#f87171;stroke-width:1.5}
.ghost{fill:none;stroke:#555d6c;stroke-width:1.5;stroke-dasharray:4 4}
.zone{fill:#111319;stroke:#232731;stroke-width:1.5}
.chip{fill:#1a1d26;stroke:#2a2f3a;stroke-width:1}
text{font-family:ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#eceef3}
.tm{font:600 12.5px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#eceef3}
.td{fill:#f87171}
.s{font-size:12px;fill:#a6adbb}
.m{font:11px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#a6adbb}
.xs{font-size:10.5px;font-weight:500;fill:#8a92a3}
.xm{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;font-weight:400}
.xa{fill:url(#ga);font-weight:600}
.xd{fill:#f87171;font-weight:600}
.xw{fill:#0b1220;font-weight:600}
.k{font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:#8a92a3}
.ka{fill:url(#ga)}
.h1{font-size:42px;font-weight:700;letter-spacing:-.02em;fill:#eceef3}
.ln,.la,.ld,.lm{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#555d6c}.la{stroke:url(#ga)}.ld{stroke:#f87171}.lm{stroke:#2a2f3a}
.lane{stroke:#2a2f3a;stroke-width:1.5;stroke-dasharray:3 4}
.dash{stroke-dasharray:5 5}
.dl{fill:#555d6c}.da{fill:url(#ga)}.dd{fill:#f87171}
.pl{fill:#0d0f14}.pa{fill:#0d0f14;stroke:url(#ga);stroke-width:1}
.pd{fill:#2a1517;stroke:#f87171;stroke-width:1}.ps{fill:url(#ga)}
.fa{fill:url(#ga)}.fs{fill:url(#gs)}.fm{fill:#1a1d26}.fd{fill:#f87171}.ft{fill:#eceef3}
.bdg{fill:url(#ga)}.bn{font-size:9.5px;font-weight:700;fill:#0b1220}
.ic{fill:none;stroke:url(#ga);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pkt{fill:url(#ga)}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 4.8s cubic-bezier(.6,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.08)}25%{transform:scaleX(.3)}50%{transform:scaleX(.55)}75%,100%{transform:scaleX(1)}}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.blink{animation:blink 3.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.18}35%,65%{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.flow,.blink,.pulse,.grow{animation:none}.blink{opacity:1}.pulse,.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.12"/><stop offset="1" stop-color="#818cf8" stop-opacity="0.12"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.45"/></filter>
</defs>

<circle class="pulse fs" cx="372" cy="54" r="22"/>
<circle class="ic" cx="372" cy="54" r="21" opacity=".35"/>
<circle class="ic" cx="372" cy="54" r="13.5" opacity=".7"/>
<circle class="fa" cx="372" cy="54" r="6"/>
<text class="h1" x="406" y="69">Halos</text>
<rect class="card" x="24" y="112" width="168" height="112" rx="12" filter="url(#sh)"/>
<text class="k ka" x="40" y="146.5">01 · POLICY</text>
<text class="t" x="40" y="164.5">Policy repo</text>
<text class="s" x="40" y="182.5">profiles · rings</text>
<text class="s" x="40" y="198.5">experiments · YAML</text>
<rect class="card" x="245" y="112" width="168" height="112" rx="12" filter="url(#sh)"/>
<rect class="soft" x="245" y="112" width="168" height="112" rx="12"/>
<rect class="ring" x="245.75" y="112.75" width="166.5" height="110.5" rx="11.25"/>
<text class="k ka" x="261" y="146.5">02 · RELEASE</text>
<text class="t" x="261" y="164.5">Signed release</text>
<text class="s" x="261" y="182.5">OCI · ed25519</text>
<text class="s" x="261" y="198.5">content-addressed</text>
<rect class="card" x="466" y="112" width="168" height="112" rx="12" filter="url(#sh)"/>
<text class="k ka" x="482" y="146.5">03 · RINGS</text>
<text class="t" x="482" y="164.5">Rollout rings</text>
<text class="s" x="482" y="182.5"></text>
<text class="s" x="482" y="198.5"></text>
<rect class="card" x="687" y="112" width="168" height="112" rx="12" filter="url(#sh)"/>
<text class="k ka" x="703" y="146.5">04 · DELIVER</text>
<text class="t" x="703" y="164.5">Everywhere</text>
<text class="s" x="703" y="182.5">laptops · containers</text>
<text class="s" x="703" y="198.5">CI · Kubernetes</text>
<rect class="chip" x="482.0" y="168" width="30" height="22" rx="6"/>
<text class="xs xm" x="497" y="183" text-anchor="middle">r0</text>
<rect class="chip" x="517.3" y="168" width="30" height="22" rx="6"/>
<text class="xs xm" x="532.3" y="183" text-anchor="middle">r1</text>
<rect class="chip" x="552.6" y="168" width="30" height="22" rx="6"/>
<text class="xs xm" x="567.6" y="183" text-anchor="middle">r2</text>
<rect class="chip" x="587.9" y="168" width="30" height="22" rx="6"/>
<text class="xs xm" x="602.9" y="183" text-anchor="middle">GA</text>
<rect class="fm" x="482" y="198" width="136" height="4" rx="2"/>
<rect class="fa grow" x="482" y="198" width="136" height="4" rx="2"/>
<path class="la flow" d="M200 168L237 168"/>
<path class="la hd" d="M231.5 171.4L237 168L231.5 164.6"/>
<path class="la flow" d="M421 168L458 168"/>
<path class="la hd" d="M452.5 171.4L458 168L452.5 164.6"/>
<path class="la flow" d="M642 168L679 168"/>
<path class="la hd" d="M673.5 171.4L679 168L673.5 164.6"/>
<path class="la dash" d="M771 230L771.0 262.0Q771 278 755.0 278.0L124.0 278.0Q108 278 108.0 262.0L108 232"/>
<path class="la hd" d="M111.4 237.5L108 232L104.6 237.5"/>
<circle class="pkt" r="3.2"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" rotate="auto" path="M771 230L771.0 262.0Q771 278 755.0 278.0L124.0 278.0Q108 278 108.0 262.0L108 232"/></circle>
<circle class="pkt" r="3.2"><animateMotion dur="1.6s" begin="-0.0s" repeatCount="indefinite" rotate="auto" path="M200 168.0L237 168.0"/></circle>
<circle class="pkt" r="3.2"><animateMotion dur="1.6s" begin="-0.5s" repeatCount="indefinite" rotate="auto" path="M421 168.0L458 168.0"/></circle>
<circle class="pkt" r="3.2"><animateMotion dur="1.6s" begin="-1.0s" repeatCount="indefinite" rotate="auto" path="M642 168.0L679 168.0"/></circle>
<rect class="pa" x="261.7" y="269" width="356.6" height="18" rx="9"/>
<text class="xs xa" x="440" y="281.6" text-anchor="middle">evidence: evals · telemetry · mSPRT  →  promote PR or auto-rollback</text>
</svg>
