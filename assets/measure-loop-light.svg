<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif">
<title id="t">The measure loop</title>
<desc id="d">A change is evaluated offline (pass@k, LLM judge, harness by model matrix), exposed to a ring, measured through OTEL in ClickHouse, and judged by mSPRT. A pass opens a promotion PR a human merges; a guardrail breach rolls back automatically and fires the signed kill switch.</desc>
<style>
.cv{fill:#f7f8fa;stroke:#e4e7ed;stroke-width:1.5}
.card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5}
.soft{fill:url(#gs)}
.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.dcard{fill:#fef2f2;stroke:#dc2626;stroke-width:1.5}
.ghost{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:4 4}
.zone{fill:#f4f6f9;stroke:#dfe5ec;stroke-width:1.5}
.chip{fill:#f1f5f9;stroke:#e2e8f0;stroke-width:1}
text{font-family:ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#0b0d12}
.tm{font:600 12.5px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#0b0d12}
.td{fill:#dc2626}
.s{font-size:12px;fill:#475063}
.m{font:11px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#475063}
.xs{font-size:10.5px;font-weight:500;fill:#667085}
.xm{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;font-weight:400}
.xa{fill:url(#ga);font-weight:600}
.xd{fill:#dc2626;font-weight:600}
.xw{fill:#ffffff;font-weight:600}
.k{font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:#667085}
.ka{fill:url(#ga)}
.h1{font-size:42px;font-weight:700;letter-spacing:-.02em;fill:#0b0d12}
.ln,.la,.ld,.lm{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#94a3b8}.la{stroke:url(#ga)}.ld{stroke:#dc2626}.lm{stroke:#e2e8f0}
.lane{stroke:#e2e8f0;stroke-width:1.5;stroke-dasharray:3 4}
.dash{stroke-dasharray:5 5}
.dl{fill:#94a3b8}.da{fill:url(#ga)}.dd{fill:#dc2626}
.pl{fill:#f7f8fa}.pa{fill:#f7f8fa;stroke:url(#ga);stroke-width:1}
.pd{fill:#fef2f2;stroke:#dc2626;stroke-width:1}.ps{fill:url(#ga)}
.fa{fill:url(#ga)}.fs{fill:url(#gs)}.fm{fill:#f1f5f9}.fd{fill:#dc2626}.ft{fill:#0b0d12}
.bdg{fill:url(#ga)}.bn{font-size:9.5px;font-weight:700;fill:#ffffff}
.ic{fill:none;stroke:url(#ga);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pkt{fill:url(#ga)}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 4.8s cubic-bezier(.6,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.08)}25%{transform:scaleX(.3)}50%{transform:scaleX(.55)}75%,100%{transform:scaleX(1)}}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.blink{animation:blink 3.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.18}35%,65%{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.flow,.blink,.pulse,.grow{animation:none}.blink{opacity:1}.pulse,.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#0d9488" stop-opacity="0.07"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0.07"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.07"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="878.5" height="378.5" rx="16"/>
<circle class="pkt" r="3.2"><animateMotion dur="8s" begin="0s" repeatCount="indefinite" rotate="auto" path="M144.0 84.0L776.0 84.0L776.0 284.0L144.0 284.0Z"/></circle>
<rect class="card" x="24" y="32" width="240" height="104" rx="12" filter="url(#sh)"/>
<text class="k ka" x="40" y="62.5">01 · CHANGE</text>
<text class="t" x="40" y="80.5">Change</text>
<text class="s" x="40" y="98.5">edit YAML, open a PR</text>
<text class="s" x="40" y="114.5">halo validate · halo plan</text>
<rect class="card" x="320" y="32" width="240" height="104" rx="12" filter="url(#sh)"/>
<text class="k ka" x="336" y="62.5">02 · EVAL</text>
<text class="t" x="336" y="80.5">Offline evals</text>
<text class="s" x="336" y="98.5">pass@k · LLM judge</text>
<text class="s" x="336" y="114.5">harness × model matrix</text>
<rect class="card" x="616" y="32" width="240" height="104" rx="12" filter="url(#sh)"/>
<text class="k ka" x="632" y="62.5">03 · EXPOSE</text>
<text class="t" x="632" y="80.5">Ring exposure</text>
<text class="s" x="632" y="98.5">ring0, then ring1 canary</text>
<text class="s" x="632" y="114.5">signed pointer moves</text>
<rect class="card" x="616" y="232" width="240" height="104" rx="12" filter="url(#sh)"/>
<text class="k ka" x="632" y="262.5">04 · MEASURE</text>
<text class="t" x="632" y="280.5">Telemetry</text>
<text class="s" x="632" y="298.5">OTEL → ClickHouse</text>
<text class="s" x="632" y="314.5">cost · latency · acceptance</text>
<rect class="card" x="320" y="232" width="240" height="104" rx="12" filter="url(#sh)"/>
<rect class="soft" x="320" y="232" width="240" height="104" rx="12"/>
<rect class="ring" x="320.75" y="232.75" width="238.5" height="102.5" rx="11.25"/>
<text class="k ka" x="336" y="262.5">05 · DECIDE</text>
<text class="t" x="336" y="280.5">Sequential verdict</text>
<text class="s" x="336" y="298.5">mSPRT · paired bootstrap</text>
<text class="s" x="336" y="314.5">guardrails, checked live</text>
<rect class="card" x="24" y="232" width="240" height="104" rx="12" filter="url(#sh)"/>
<text class="k ka" x="40" y="262.5">06 · PROMOTE</text>
<text class="t" x="40" y="280.5">Promote PR</text>
<text class="s" x="40" y="298.5">opened by the controller</text>
<text class="s" x="40" y="314.5">merged by a human, never auto</text>
<path class="la flow" d="M270 84L314 84"/>
<path class="la hd" d="M308.5 87.4L314 84L308.5 80.6"/>
<path class="la flow" d="M566 84L610 84"/>
<path class="la hd" d="M604.5 87.4L610 84L604.5 80.6"/>
<path class="la flow" d="M776 142L776 226"/>
<path class="la hd" d="M772.6 220.5L776 226L779.4 220.5"/>
<path class="la flow" d="M610 284L566 284"/>
<path class="la hd" d="M571.5 280.6L566 284L571.5 287.4"/>
<path class="la flow" d="M314 284L270 284"/>
<path class="la hd" d="M275.5 280.6L270 284L275.5 287.4"/>
<path class="la flow" d="M144 226L144 142"/>
<path class="la hd" d="M147.4 147.5L144 142L140.6 147.5"/>
<rect class="ps" x="103.5" y="175.0" width="81.0" height="18" rx="9"/>
<text class="xs xw" x="144" y="187.6" text-anchor="middle">human merge</text>
<rect class="pa" x="273.7" y="257.0" width="36.7" height="18" rx="9"/>
<text class="xs xa" x="292" y="269.6" text-anchor="middle">pass</text>
<path class="ld dash" d="M440 226L440.0 194.0Q440 184 450.0 184.0L666.0 184.0Q676 184 676.0 174.0L676 142"/>
<path class="ld hd" d="M679.4 147.5L676 142L672.6 147.5"/>
<rect class="pd" x="449.5" y="175" width="189.0" height="18" rx="9"/>
<text class="xs xd" x="544" y="187.6" text-anchor="middle">breach → auto-rollback + kill switch</text>
<text class="xs" x="440" y="362" text-anchor="middle">evidence over opinion: every change earns its ring, every ring can be undone in seconds</text>
</svg>
