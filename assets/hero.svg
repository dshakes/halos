<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">Halos architecture</title>
  <desc id="d">Policy repo compiles to a signed release, delivered to dev containers, cloud workspaces and laptops. Requests flow through Kong with halo-kong, the auth gateway and orchestrator to Bedrock or Anthropic. Telemetry and evals loop back to promotion.</desc>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de}
    .box{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.5}
    .hot{fill:#e6f7f4;stroke:#0f766e;stroke-width:2}
    .ev{fill:#fff7e6;stroke:#b7791f;stroke-width:1.5}
    .t{fill:#1f2328;font:600 15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
    .s{fill:#57606a;font:12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
    .h{fill:#0f766e;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:1.5px}
    .he{fill:#b7791f;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:1.5px}
    .a{stroke:#57606a;stroke-width:2;fill:none;marker-end:url(#ar)}
    .l{stroke:#b7791f;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#al)}
    .ah{fill:#57606a}.alh{fill:#b7791f}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117;stroke:#30363d}
      .box{fill:#161b22;stroke:#6e7681}
      .hot{fill:#0b2a27;stroke:#2dd4bf}
      .ev{fill:#2a2110;stroke:#e3b341}
      .t{fill:#e6edf3}.s{fill:#9da7b3}
      .h{fill:#2dd4bf}.he{fill:#e3b341}
      .a{stroke:#9da7b3}.l{stroke:#e3b341}
      .ah{fill:#9da7b3}.alh{fill:#e3b341}
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="alh" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="bg" x="1" y="1" width="1198" height="558" rx="18"/>

  <text class="h" x="40" y="42">POLICY</text>
  <text class="h" x="330" y="42">CLIENT PLANE</text>
  <text class="h" x="620" y="42">TRAFFIC PLANE</text>

  <!-- policy -->
  <rect class="box" x="40" y="60" width="220" height="100" rx="12"/>
  <text class="t" x="60" y="92">Policy repo (git)</text>
  <text class="s" x="60" y="114">profiles · rings · experiments</text>
  <text class="s" x="60" y="132">halo validate · halo plan</text>
  <rect class="hot" x="40" y="210" width="220" height="100" rx="12"/>
  <text class="t" x="60" y="242">Release vN</text>
  <text class="s" x="60" y="264">signed OCI bundle (ed25519)</text>
  <text class="s" x="60" y="282">immutable · signed ring pointers</text>
  <path class="a" d="M150 160V208"/>

  <!-- client -->
  <rect class="box" x="330" y="60" width="220" height="70" rx="12"/>
  <text class="t" x="350" y="90">Dev containers</text><text class="s" x="350" y="110">Feature · Codespaces prebuilds</text>
  <rect class="box" x="330" y="145" width="220" height="70" rx="12"/>
  <text class="t" x="350" y="175">Cloud workspaces</text><text class="s" x="350" y="195">Coder module</text>
  <rect class="box" x="330" y="230" width="220" height="70" rx="12"/>
  <text class="t" x="350" y="260">Laptops</text><text class="s" x="350" y="280">halod agent · Jamf/Kandji/Intune</text>
  <path class="a" d="M260 260H300V95H328"/><path class="a" d="M300 180H328"/><path class="a" d="M300 260H328"/>
  <text class="s" x="330" y="322">halod verifies signature, then applies</text>

  <!-- traffic -->
  <rect class="hot" x="620" y="60" width="230" height="100" rx="12"/>
  <text class="t" x="640" y="92">halo-proxy / halo-kong</text>
  <text class="s" x="640" y="114">strip x-halo-*, cohort from identity</text>
  <text class="s" x="640" y="132">model alias rewrite, canary %</text>
  <rect class="box" x="890" y="60" width="130" height="100" rx="12"/>
  <text class="t" x="910" y="92">Auth GW</text><text class="s" x="910" y="114">verified identity</text>
  <rect class="box" x="1050" y="60" width="120" height="100" rx="12"/>
  <text class="t" x="1066" y="92">Orchestrator</text>
  <rect class="box" x="890" y="210" width="280" height="70" rx="12"/>
  <text class="t" x="910" y="240">Amazon Bedrock · Anthropic API</text><text class="s" x="910" y="260">upstreams chosen by model route</text>
  <path class="a" d="M850 110H888"/><path class="a" d="M1020 110H1048"/><path class="a" d="M1110 160V208"/>
  <path class="a" d="M550 95H618"/>
  <text class="s" x="556" y="86">x-halo-ring</text>
  <rect class="box" x="620" y="210" width="230" height="70" rx="12"/>
  <text class="t" x="640" y="240">halo-shadow</text><text class="s" x="640" y="260">async single-turn mirror</text>
  <path class="a" d="M735 160V208"/>

  <!-- evidence -->
  <text class="he" x="40" y="372">EVIDENCE PLANE</text>
  <rect class="ev" x="40" y="390" width="220" height="110" rx="12"/>
  <text class="t" x="60" y="422">OTEL collector</text><text class="s" x="60" y="444">claude_code.* codex.* gemini</text><text class="s" x="60" y="462">normalized to halo.*</text>
  <rect class="ev" x="330" y="390" width="220" height="110" rx="12"/>
  <text class="t" x="350" y="422">halo eval</text><text class="s" x="350" y="444">containerized headless replay</text><text class="s" x="350" y="462">scorecards</text>
  <rect class="ev" x="620" y="390" width="230" height="110" rx="12"/>
  <text class="t" x="640" y="422">halo exp analyze</text><text class="s" x="640" y="444">mSPRT guardrails</text><text class="s" x="640" y="462">paired bootstrap</text>
  <rect class="ev" x="920" y="390" width="250" height="110" rx="12"/>
  <text class="t" x="940" y="422">halo exp promote</text><text class="s" x="940" y="444">opens PR moving ring pointer</text><text class="s" x="940" y="462">human merges; rollback is automatic</text>
  <path class="l" d="M940 280V340H150V388"/>
  <path class="l" d="M260 445H328"/><path class="l" d="M550 445H618"/><path class="l" d="M850 445H918"/>
  <path class="l" d="M1045 388V345H1190V20H150V58"/>
  <text class="s" x="700" y="336">telemetry (OTLP)</text>
  <text class="s" x="1064" y="16">evidence loop: promote or roll back a release</text>
</svg>
