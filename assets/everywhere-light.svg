<g class="ic"><circle cx="818.0" cy="39" r="6"/><circle cx="804.0" cy="63" r="6"/><circle cx="832.0" cy="63" r="6"/><path d="M815.0 44l-8 13M821.0 44l8 13M810.0 63h16"/></g>
