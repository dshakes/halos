<g class="ic"><path d="M554.0 64h25a9 9 0 0 0 1-18 13 13 0 0 0-25-3 8 8 0 0 0-1 21z"/><path d="M562.0 51l-4 4 4 4M571.0 51l4 4-4 4"/></g>
