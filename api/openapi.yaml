  /api/v1/token/exchange:
    post:
      tags:
        - Identity
      operationId: postTokenExchange
      summary: RFC 8693 token exchange
      description: Exchanges a CI provider's OIDC token for a short-lived Halos workload credential (ADR-0023), a delegated agent credential (ADR-0024) or an MCP access token (ADR-0029). The subject token is the credential; policy `workloads` rules decide. Form-encoded, at most 16 KB. Errors follow RFC 6749 section 5.2.
      x-halo-stability: stable
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/tokenExchangeForm'
            example: grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Atoken-exchange&subject_token=eyJ...&subject_token_type=urn%3Aietf%3Aparams%3Aoauth%3Atoken-type%3Ajwt
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenExchangeResponse'
              example:
                access_token: eyJ...
                expires_in: 900
                issued_token_type: urn:ietf:params:oauth:token-type:access_token
                ring: ring1-ga
                subject: workload:acme/repo
                token_type: Bearer
        "400":
          description: invalid_request, invalid_grant, unsupported_grant_type or invalid_target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        "401":
          description: The delegated credential was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        "403":
          description: No workload rule matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        "404":
          description: Workload federation is not enabled (--workload-key-file) or policy declares no workloads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        "429":
          description: 'slow_down: too many failed attempts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        "503":
          description: temporarily_unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /api/v1/users/{id}/revoke-sessions:
