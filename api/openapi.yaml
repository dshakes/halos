# Generated by `make openapi` from internal/server (OpenAPI()). Do not edit.
# Drift is caught by `go test ./internal/server -run OpenAPI`.
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Halos halo-server API
  version: v1
  description: |-
    The HTTP API of halo-server: the admin console's API, the fleet and gateway endpoints, enrollment, workload token exchange and SCIM.

    Generated from the server's Go source (`make openapi`); a test fails when it drifts from the routes, RBAC table or response types. Errors are `{"error": "..."}` with the HTTP status carrying the meaning; the token endpoint and SCIM use their RFCs' error bodies. Every response carries `X-Request-Id`. API responses carry `Cache-Control: no-store`.

    Stability: every operation is `x-halo-stability: stable` and follows the HTTP API promise in the support policy (fields are added in minors, never removed or retyped under `/api/v1`).

    Authorization: `x-halo-permission` names the RBAC permission a session-authenticated operation needs; `x-halo-roles` (top level) lists the roles that hold each permission.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - description: The halo-server origin.
    url: /
tags:
  - description: Liveness, readiness and this description.
    name: Health
  - description: Console login and logout.
    name: Auth
  - description: Device and fleet reports, hosts and ring stats.
    name: Fleet
  - description: Enrolled devices.
    name: Devices
  - description: 'Laptop enrollment: scripts, keys and the token exchange for a device token.'
    name: Enrollment
  - description: Signed ring pointers read from the registry.
    name: Releases
  - description: The hash-chained audit log.
    name: Audit
  - description: The agent session ledger (ADR-0031).
    name: Sessions
  - description: The loaded policy and its experiments, toggles and rollouts.
    name: Policy
  - description: Signed kill lists and kill/unkill actions.
    name: Kill switch
  - description: Change freeze and rollout approvals (ADR-0030).
    name: Governance
  - description: Cost budgets (ADR-0017).
    name: Budgets
  - description: Endpoints halo-proxy and halo-kong call with a gateway token.
    name: Gateway
  - description: Cloud agent governance (ADR-0034).
    name: Cloud agents
  - description: Per-credential revocation (ADR-0026).
    name: Revocations
  - description: Service-account tokens and break-glass (ADR-0036).
    name: Service tokens
  - description: 'Developer self-service: identity, catalog, launchers, requests.'
    name: Portal
  - description: Workload token exchange and agent egress decisions (ADR-0023, ADR-0024).
    name: Identity
  - description: SCIM 2.0 provisioning (ADR-0022), RFC 7644 over the SCIM token.
    name: SCIM
paths:
  /api/v1/agents/egress:
    post:
      tags:
        - Identity
      operationId: postAgentEgress
      summary: May this credential call a remote agent?
      description: 'Decides, from the verified credential''s cohort and policy `agents.remote`, whether the caller may call a remote A2A agent (ADR-0024). A refusal is a 200 with `allow: false`.'
      x-halo-stability: stable
      security:
        - workloadToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EgressRequest'
            example:
              agent: billing-agent
              skill: lookup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/policy.RemoteDecision'
              example:
                agent: billing-agent
                allow: true
                reason: listed in agents.remote
        "400":
          description: Body must name an agent or url, under 4 KB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: A Halos workload or delegated agent credential is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: The credential is revoked or its human root is deprovisioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Needs --workload-key-file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          description: Too many failed attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: The audit append failed (the message says whether the change stands).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Revocations cannot be checked, or no policy; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/audit:
    get:
      tags:
        - Audit
      operationId: getAudit
      summary: The hash-chained audit log
      description: |-
        `next` is the cursor to pass as `since`; `verified` covers the whole chain across rotated segments. Reads stream, so memory is bounded by `limit`.

        Requires the `audit` permission.
      x-halo-permission: audit
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      parameters:
        - description: Entries to return (default 100).
          name: limit
          in: query
          schema:
            type: integer
            maximum: 500
            minimum: 1
        - description: A sequence number or RFC 3339 time; returns entries after it, oldest first. Without it, the newest `limit` entries.
          name: since
          in: query
          schema:
            type: string
        - description: Exact match.
          name: actor
          in: query
          schema:
            type: string
        - description: Exact match.
          name: action
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditResponse'
              example:
                entries:
                  - action: login
                    actor: boss@acme.example
                    hash: 0f1e2d3c
                    prev: ""
                    seq: 1
                    time: "2026-01-02T03:04:05Z"
                head: 0f1e2d3c
                next: 1
                total: 1
                verified: true
        "400":
          description: Invalid limit or since.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          description: Audit log unreadable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/breakglass/unlock:
    post:
      tags:
        - Service tokens
      operationId: unlockBreakGlass
      summary: Lift the break-glass lockout
      description: |-
        Lifts the global lockout on every replica and resets its failure count. Audited as breakglass.unlock at high severity.

        Requires the `admin` permission. A person only: a token or break-glass caller gets 403.
      x-halo-permission: admin
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unlockResult'
              example:
                wasLocked: false
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: Break-glass is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: The audit append failed (the message says whether the change stands). Nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: The state store is unavailable; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/budgets:
    get:
      tags:
        - Budgets
      operationId: getBudgets
      summary: Every budget counter with spend in its current window
      description: Requires the `read` permission.
      x-halo-permission: read
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      parameters:
        - description: Exact-match budget name.
          name: budget
          in: query
          schema:
            type: string
        - description: Exact-match counter key, for example user:alice@acme.com.
          name: key
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetsResponse'
              example:
                at: "2026-01-02T03:04:05Z"
                budgets: []
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          description: Budget store unavailable, or no policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/capabilities:
    get:
      tags:
        - Portal
      operationId: getCapabilities
      summary: Optional features and the caller's permissions
      description: Requires the `session` permission.
      x-halo-permission: session
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
              example:
                bindings:
                  - role: operator
                    scope:
                      rings:
                        - ring1-canary
                    source: identity.roleBindings[0]
                killSwitch: true
                permissions:
                  - read
                  - operate
                roles:
                  - operator
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /api/v1/catalog:
    get:
      tags:
        - Portal
      operationId: getCatalog
      summary: What the caller may request
      description: Requires the `session` permission.
      x-halo-permission: session
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
              example:
                items:
                  - desc: https://mcp.acme.example/jira
                    item: jira
                    kind: mcp-server
                    ticket:
                      - CHG[0-9]{7}
                harnesses: []
                launchers:
                  - laptop
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          description: Policy not loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/cloud-agents:
    get:
      tags:
        - Cloud agents
      operationId: getCloudAgents
      summary: Cloud agent tasks and policy alerts
      description: Requires the `read` permission.
      x-halo-permission: read
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      parameters:
        - description: true keeps queued and running tasks only.
          name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudAgentsView'
              example:
                alerts: []
                configured:
                  cursor: false
                  github: false
                  githubWebhook: false
                tasks: []
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          description: Audit log unreadable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Policy not loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/cloud-agents/kill:
    post:
      tags:
        - Cloud agents
      operationId: killCloudAgents
      summary: Cancel the active cloud tasks of a user, ring or experiment
      description: |-
        `dryRun` defaults to true (plan only). A real run is audited before any vendor call and each result after.

        Requires the `operate` permission.
      x-halo-permission: operate
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudKillRequest'
            example:
              name: dev@acme.example
              reason: leaked credential
              scope: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudKillResponse'
              example:
                actions: []
                dryRun: true
                next_steps: []
                unattributed: 0
        "400":
          description: Invalid JSON, or an unknown scope or name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          description: A reason is required (at most 500 characters).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Audit log unreadable, or The audit append failed (the message says whether the change stands).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Policy not loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/cloud-agents/webhooks/github:
    post:
      tags:
        - Cloud agents
      operationId: postGitHubWebhook
      summary: GitHub workflow_run delivery
      description: Governed runs are stored as cloudagent.task; finished ones also as session.record. Body at most 1 MiB. An older delivery than the stored task answers 202 `stale`.
      x-halo-stability: stable
      security:
        - webhookSignature: []
      requestBody:
        description: A GitHub webhook payload (event workflow_run).
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
            example:
              action: completed
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhookAck'
              example:
                status: recorded
                task: gh-1
        "202":
          description: Ignored, duplicate or stale delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhookAck'
              example:
                status: ignored
        "400":
          description: Unreadable payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Invalid signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Webhooks are not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "413":
          description: Body too large.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          description: Audit log unreadable, or The audit append failed (the message says whether the change stands).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: State store unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/devices:
    get:
      tags:
        - Devices
      operationId: listDevices
      summary: Enrolled devices
      description: Requires the `read` permission.
      x-halo-permission: read
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
              example: []
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /api/v1/devices/{id}:
    get:
      tags:
        - Devices
      operationId: getDevice
      summary: One device with its recent reports
      description: |-
        At most 50 recent reports, newest first; history resets on server restart. Token hashes are never returned.

        Requires the `read` permission.
      x-halo-permission: read
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      parameters:
        - description: The resource id.
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetail'
              example:
                device:
                  createdAt: "2026-01-02T03:04:05Z"
                  id: d1
                  lastSeen: "2026-01-02T03:04:05Z"
                  revoked: false
                  userID: dev@acme.example
                history: []
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/devices/{id}/revoke:
    post:
      tags:
        - Devices
      operationId: revokeDevice
      summary: Revoke a device token
      description: Requires the `admin` permission.
      x-halo-permission: admin
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      parameters:
        - description: The resource id.
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked. Audited as device.revoke.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: Device not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Store failed, or The audit append failed (the message says whether the change stands). The revocation holds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/enroll:
    post:
      tags:
        - Enrollment
      operationId: postEnroll
      summary: Exchange an enrollment token for a device token
      description: The single-use enrollment token in the body is the credential (issued by POST /api/v1/launch/laptop). Answers a halod.yaml containing the device token; it is shown once.
      x-halo-stability: stable
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/enrollRequest'
            example:
              os: darwin
              token: enroll-token
      responses:
        "200":
          description: The halod.yaml, mode 0600.
          content:
            text/yaml:
              schema:
                type: string
              example: |
                registry: ghcr.io/acme/rel
        "400":
          description: token required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Invalid, expired or already used token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: No ring assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          description: Too many failed attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Store or render failed, or The audit append failed (the message says whether the change stands).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/experiments:
    get:
      tags:
        - Policy
      operationId: listExperiments
      summary: Experiments with status and latest verdict
      description: Requires the `read` permission.
      x-halo-permission: read
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExperimentDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          description: Policy not loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/experiments/{name}:
    get:
      tags:
        - Policy
      operationId: getExperiment
      summary: One experiment
      description: Requires the `read` permission.
      x-halo-permission: read
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      parameters:
        - description: The resource name as written in policy.
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentDetail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: Experiment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Policy not loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/experiments/{name}/kill:
    post:
      tags:
        - Kill switch
      operationId: killExperiment
      summary: Kill an experiment
      description: |-
        Takes effect on gateways at their next poll (default 10 seconds), does not expire, and is not lifted by pausing or concluding the experiment. No PR, no merge. Audited as experiment.kill.

        Requires the `operate` permission.
      x-halo-permission: operate
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      parameters:
        - description: The resource name as written in policy.
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/reasonRequest'
            example:
              reason: p95 latency regression
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/experimentKillResult'
              example:
                changed: true
                experiment: opus-5-5-canary
                killed: true
        "400":
          description: Invalid JSON or name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: Experiment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: A reason is required (at most 500 characters).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Store failed, or The audit append failed (the message says whether the change stands).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "501":
          description: The kill switch is not configured (--killswitch-key-file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Policy not loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/experiments/{name}/status:
    post:
      tags:
        - Policy
      operationId: setExperimentStatus
      summary: Propose a status change
      description: |-
        Opens a policy-repo pull request; nothing changes until a human merges. Audited as experiment.status.

        Requires the `operate` permission.
      x-halo-permission: operate
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      parameters:
        - description: The resource name as written in policy.
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/statusRequest'
            example:
              status: paused
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/prResult'
              example:
