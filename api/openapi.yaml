          name: harness
          in: query
          schema:
            type: string
        - description: Ring name.
          name: ring
          in: query
          schema:
            type: string
        - description: A tool or MCP server.
          name: tool
          in: query
          schema:
            type: string
        - description: RFC 3339, on the session start.
          name: since
          in: query
          schema:
            type: string
        - description: RFC 3339, on the session start.
          name: until
          in: query
          schema:
            type: string
