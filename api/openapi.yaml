      tags:
        - Releases
      operationId: getReleases
      summary: Ring pointers, convergence and drift
      description: |-
        Per ring: the signature-verified pointer read from the registry, convergence of reporting devices and drift. Cached 30 seconds; if the registry is unreachable the last verified state is returned with `stale`.

        Requires the `read` permission.
      x-halo-permission: read
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleasesResponse'
              example:
                registry: ghcr.io/acme/rel
                rings: []
                stale: false
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /api/v1/requests:
    get:
      tags:
        - Portal
      operationId: listRequests
      summary: List access requests
      description: Requires the `session` permission. Everyone's requests need `approve`; otherwise only the caller's own are returned.
      x-halo-permission: session
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Request'
              example: []
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Portal
      operationId: postRequest
      summary: Ask for access
      description: 'Requires the `session` permission. Needs a person: a service token or break-glass session gets 403 (audited as authz.deny with need `human`).'
      x-halo-permission: session
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestCreate'
            example:
              item: ring1-ga
              justification: I want the new model
              kind: ring-opt-in
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
              example:
                createdAt: "2026-01-02T03:04:05Z"
                id: r1
                item: ring1-ga
                justification: I want the new model
                kind: ring-opt-in
                status: pending
                user: dev@acme.example
        "400":
          description: Invalid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          description: A pending request for this already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Invalid request, or a change ticket is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Store failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: The state store is unavailable; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/requests/{id}/approve:
    post:
      tags:
        - Portal
      operationId: approveRequest
      summary: Approve an access request
      description: |-
        Opens a policy-repo pull request; nothing merges. Approval rules (ADR-0030) can require several approvers: 202 while the quorum is not met. A person only.

        Requires the `approve` permission.
      x-halo-permission: approve
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      parameters:
        - description: The resource id.
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/decisionView'
              example:
                createdAt: "2026-01-02T03:04:05Z"
                id: r1
                item: ring1-ga
                justification: I want the new model
                kind: ring-opt-in
                status: approved
                user: dev@acme.example
        "202":
          description: Recorded; the quorum is not met yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/decisionView'
              example:
                createdAt: "2026-01-02T03:04:05Z"
                id: r1
                item: ring1-ga
                justification: I want the new model
                kind: ring-opt-in
                status: pending
                user: dev@acme.example
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: Request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Already decided, being decided, or already approved by this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: The decision could not be stored or audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "502":
          description: Could not open the policy PR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: The state store is unavailable; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
