          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          description: Audit log unreadable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Sessions
      operationId: importAgentSessions
      summary: Store normalized session records
      description: |-
        Up to 1000 records. Every record is validated first; one invalid record (prose in any field, an unhashed path, a forged id, an unknown field) refuses the whole batch. `who.user` is set from the SCIM directory, never from the body.

        Requires the `admin` permission.
      x-halo-permission: admin
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionsIngest'
            example:
              records: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsIngest'
              example:
                records: []
        "400":
          description: Invalid body or record; nothing stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          description: The audit append failed (the message says whether the change stands). Some records may be stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
