              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/revocations:
    get:
      tags:
        - Revocations
      operationId: listRevocations
      summary: Active revocations
      description: Requires the `admin` permission.
      x-halo-permission: admin
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevocationsResponse'
              example:
                revocations: []
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          description: The state store is unavailable; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Revocations
      operationId: revokeCredential
      summary: Revoke a halo-server credential (ADR-0026)
      description: |-
        Exactly one of `jti` (kills the credential and every credential exchanged from it) and `subject` (`agent:<name>`, `workload:<subject>` or a human id; kills every credential issued at or before now, and a human id also revokes their sessions). Audited as credential.revoke.

        Requires the `admin` permission.
      x-halo-permission: admin
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
            example:
              reason: compromised
              subject: agent:reviewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revocation'
              example:
                at: "2026-01-02T03:04:05Z"
                by: boss@acme.example
                expires: "2026-01-02T04:04:06Z"
                reason: compromised
                revokedBefore: "2026-01-02T03:04:06Z"
                subject: agent:reviewer
        "400":
          description: Invalid body (exactly one of jti and subject, a reason, a valid jti).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          description: 10,000 revocations are active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: The audit append failed (the message says whether the change stands). The revocation holds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: The state store is unavailable; retry. Nothing was revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
