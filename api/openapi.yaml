  /api/v1/service-tokens:
    get:
      tags:
        - Service tokens
      operationId: listServiceTokens
      summary: Service-account tokens (never the secret)
      description: Requires the `admin` permission.
      x-halo-permission: admin
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTokensResponse'
              example:
                tokens: []
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          description: The state store is unavailable; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Service tokens
      operationId: createServiceToken
      summary: Create a service-account token (ADR-0036)
      description: |-
        The secret is shown once. The role may not exceed the caller's; `ttl` is 1h up to --service-token-max-ttl (default and maximum 90 days). `scope` (ADR-0037) bounds the role to rings and units within the caller's admin grants; absent is global. The body is decoded strictly: exact keys, each once, and a present scope must name a ring or a unit. Audited as service-token.create.

        Requires the `admin` permission. Only an interactive session may create one: a token or break-glass caller gets 403.
      x-halo-permission: admin
      x-halo-stability: stable
      security:
        - sessionCookie: []
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceTokenRequest'
            example:
              name: ci-reporter
              owner: platform
              role: viewer
              scope:
                rings:
                  - ring1-canary
              ttl: 720h
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServiceTokenResponse'
              example:
                serviceToken:
                  name: ci-reporter
                  createdAt: "2026-01-02T03:04:05Z"
                  createdBy: boss@acme.example
                  expired: false
                  expiresAt: "2026-02-01T03:04:05Z"
                  id: 0123456789abcdef
                  owner: platform
                  principal: service-account:ci-reporter:0123456789abcdef
                  revoked: false
                  role: viewer
                  scope:
                    rings:
                      - ring1-canary
                token: halo_sat_0123456789abcdef.secret
        "400":
          description: Invalid name, role, scope, ttl, description or owner; an unknown, repeated or case-variant key; a scope naming no ring or unit, or one not in policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          description: 1,000 tokens are active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: Token generation failed, or The audit append failed (the message says whether the change stands). The token is revoked and not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: The state store is unavailable; retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
