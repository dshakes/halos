components:
  responses:
    Forbidden:
      description: The caller lacks the permission in x-halo-permission, or a state-changing request came from another origin. Audited as authz.deny.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many failed authentications from this client address. Honour Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid session cookie or service-account token. Sign in again, or mint a new token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AssignmentRow:
      required:
        - experiment
        - status
      type: object
      properties:
        control:
          type: boolean
        experiment:
          type: string
        status:
          type: string
        variant:
          type: string
    AuditEntry:
      required:
        - action
        - actor
        - hash
        - prev
        - seq
        - time
      type: object
      properties:
        action:
          type: string
        actor:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
        hash:
          type: string
        ip:
          type: string
        prev:
          type: string
        requestId:
          type: string
        seq:
          type: integer
          format: int64
        target:
          type: string
        time:
          type: string
          format: date-time
    AuditResponse:
      required:
        - entries
        - head
        - next
        - total
        - verified
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        head:
          type: string
        next:
          type: integer
          format: int64
        total:
          type: integer
        verified:
          type: boolean
        verifyError:
          type: string
    BreakGlassLogin:
      required:
        - password
        - user
      type: object
      properties:
        password:
          type: string
        user:
          type: string
    BudgetsResponse:
      required:
        - at
        - budgets
      type: object
      properties:
        at:
          type: string
          format: date-time
        budgets:
          type: array
          items:
            $ref: '#/components/schemas/budget.Status'
    Capabilities:
      required:
        - bindings
        - killSwitch
        - permissions
        - roles
      type: object
      properties:
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/policy.Grant'
        killSwitch:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
    Catalog:
      required:
        - harnesses
        - items
        - launchers
      type: object
      properties:
        harnesses:
          type: array
          items:
            $ref: '#/components/schemas/HarnessPin'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
        launchers:
          type: array
          items:
            type: string
    CatalogItem:
      required:
        - item
        - kind
      type: object
      properties:
        desc:
          type: string
        item:
          type: string
        kind:
          type: string
        ticket:
          type: array
          items:
            type: string
    ChannelRelease:
      required:
        - channel
        - devices
        - expired
        - published
        - stale
        - suspicious
      type: object
      properties:
        channel:
          type: string
        devices:
          type: integer
        digest:
          type: string
        error:
          type: string
        expired:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        published:
          type: boolean
        seq:
          type: integer
          format: int64
        stale:
          type: boolean
        suspicious:
          type: boolean
    CloudAgentsView:
      required:
        - alerts
        - configured
        - tasks
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/cloudagents.Alert'
        configured:
          type: object
          additionalProperties:
            type: boolean
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/cloudagents.Task'
    CloudKillRequest:
      required:
        - name
        - reason
        - scope
      type: object
      properties:
        dryRun:
          type: boolean
        name:
          type: string
        reason:
          type: string
        scope:
          type: string
    CloudKillResponse:
      required:
        - actions
        - dryRun
        - next_steps
        - unattributed
      type: object
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/cloudagents.Action'
        dryRun:
          type: boolean
        next_steps:
          type: array
          items:
            type: string
        unattributed:
          type: integer
    ConvergenceView:
      required:
        - digests
        - onDigest
        - other
        - total
      type: object
      properties:
        digests:
          type: object
          additionalProperties:
            type: integer
        onDigest:
          type: integer
        other:
          type: integer
        total:
          type: integer
    CreateServiceTokenRequest:
      required:
        - name
        - role
      type: object
      properties:
        description:
          type: string
        name:
          type: string
        owner:
          type: string
        role:
          type: string
        scope: {}
        ttl:
          type: string
    CreateServiceTokenResponse:
      required:
        - serviceToken
        - token
      type: object
      properties:
        serviceToken:
          $ref: '#/components/schemas/ServiceTokenInfo'
        token:
          type: string
    Device:
      required:
        - createdAt
        - id
        - lastSeen
        - revoked
        - userID
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        groups:
          type: array
          items:
            type: string
        hash:
          type: string
        id:
          type: string
        lastAuth:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        revoked:
          type: boolean
        userID:
          type: string
    DeviceDetail:
      required:
        - device
        - history
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device'
        history:
          type: array
          items:
            $ref: '#/components/schemas/Host'
        last:
          $ref: '#/components/schemas/Host'
    EgressRequest:
      type: object
      properties:
        agent:
          type: string
        skill:
          type: string
        url:
          type: string
    Error:
      required:
        - error
      type: object
      properties:
        error:
          description: A human-readable message. Match on the HTTP status, not on the text.
          type: string
      example:
        error: login required
    ExperimentDetail:
      required:
        - axis
        - metrics
        - name
        - rings
        - status
        - stopping
        - type
        - variants
      type: object
      properties:
        axis:
          type: string
        metrics:
          $ref: '#/components/schemas/policy.Metrics'
        name:
          type: string
        rings:
          type: array
          items:
            type: string
        sampleRate:
          type: number
        status:
          type: string
        stopping:
          $ref: '#/components/schemas/policy.Stopping'
        type:
          type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/policy.Variant'
        verdict:
          $ref: '#/components/schemas/Verdict'
    ExperimentView:
      required:
        - axis
        - metrics
        - name
        - rings
        - status
        - stopping
        - type
        - variants
      type: object
      properties:
        axis:
          type: string
        metrics:
          $ref: '#/components/schemas/policy.Metrics'
        name:
          type: string
        rings:
          type: array
          items:
            type: string
