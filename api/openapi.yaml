          $ref: '#/components/responses/Forbidden'
        "404":
          description: Request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "409":
          description: Already decided or being decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "500":
          description: The decision could not be stored or audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
