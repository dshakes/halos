  securitySchemes:
    deviceToken:
      description: A per-device token minted by POST /api/v1/enroll.
      type: http
      scheme: bearer
    fleetToken:
      description: The shared fleet token (halo-server --token-file) used by MDM and Dev Container fleets.
      type: http
      scheme: bearer
    gatewayToken:
      description: A gateway token (--gateway-token-file, or the endpoint's own --gateway-*-token-file token when set, which is then the only one accepted).
      type: http
      scheme: bearer
    scimToken:
      description: A SCIM bearer token whose SHA-256 is in --scim-token-sha256-file. A session cookie is never accepted.
      type: http
      scheme: bearer
    serviceToken:
      description: 'A service-account token (ADR-0036), `Authorization: Bearer halo_sat_...`, holding one role. Created with POST /api/v1/service-tokens from an interactive admin session. Endpoints that decide on behalf of a person refuse it with 403.'
      type: http
      bearerFormat: halo_sat_
      scheme: bearer
    sessionCookie:
      description: The console session set by OIDC login (GET /auth/login) or break-glass login. State-changing requests must come from the server's own origin.
      name: halo_session
      in: cookie
      type: apiKey
    webhookSignature:
      description: GitHub's HMAC-SHA256 of the body, checked against --cloud-webhook-secret-file.
      name: X-Hub-Signature-256
      in: header
      type: apiKey
    workloadToken:
      description: A Halos workload or delegated-agent credential signed by this server (POST /api/v1/token/exchange).
      type: http
      bearerFormat: JWT
      scheme: bearer
