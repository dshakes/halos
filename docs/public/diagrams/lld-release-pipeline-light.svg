<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" width="760" height="512" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif">
<title id="t">Release pipeline</title>
<desc id="d">halo release publish: load and validate the policy, build the ring release and one release per client-axis variant, render every harness for every OS, run the CheckRendered backstop, pack a content-addressed tar, sign its digest with ed25519 (cosign optional co-signer), push it and tag v&lt;version&gt; immutably, then sign and push the ring pointer with org, ring, digest, seq and expiry.</desc>
<style>
.cv{fill:#f7f2e9;stroke:#e6ddcd;stroke-width:1.5}
.card{fill:#fffdf9;stroke:#e3d9c8;stroke-width:1.5}
.soft{fill:url(#gs)}
.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.dcard{fill:#fbedea;stroke:#b42323;stroke-width:1.5}
.ghost{fill:none;stroke:#a89f90;stroke-width:1.5;stroke-dasharray:4 4}
.zone{fill:#f3ece0;stroke:#e0d5c2;stroke-width:1.5}
.chip{fill:#f3ece0;stroke:#e3d9c8;stroke-width:1}
text{font-family:ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#16130f}
.tm{font:600 12.5px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#16130f}
.td{fill:#b42323}
.s{font-size:12px;fill:#4a443b}
.m{font:11px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#4a443b}
.xs{font-size:10.5px;font-weight:500;fill:#655e52}
.xm{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;font-weight:400}
.xa{fill:url(#ga);font-weight:600}
.xd{fill:#b42323;font-weight:600}
.xw{fill:#fffdf9;font-weight:600}
.k{font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:#655e52}
.ka{fill:url(#ga)}
.h1{font-size:42px;font-weight:700;letter-spacing:-.02em;fill:#16130f}
.ln,.la,.ld,.lm{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#a89f90}.la{stroke:url(#ga)}.ld{stroke:#b42323}.lm{stroke:#e3d9c8}
.lane{stroke:#e3d9c8;stroke-width:1.5;stroke-dasharray:3 4}
.dash{stroke-dasharray:5 5}
.dl{fill:#a89f90}.da{fill:url(#ga)}.dd{fill:#b42323}
.pl{fill:#f7f2e9}.pa{fill:#f7f2e9;stroke:url(#ga);stroke-width:1}
.pd{fill:#fbedea;stroke:#b42323;stroke-width:1}.ps{fill:url(#ga)}
.fa{fill:url(#ga)}.fs{fill:url(#gs)}.fm{fill:#f3ece0}.fd{fill:#b42323}.ft{fill:#16130f}
.bdg{fill:url(#ga)}.bn{font-size:9.5px;font-weight:700;fill:#fffdf9}
.ic{fill:none;stroke:url(#ga);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pkt{fill:url(#ga)}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 4.8s cubic-bezier(.6,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.08)}25%{transform:scaleX(.3)}50%{transform:scaleX(.55)}75%,100%{transform:scaleX(1)}}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.blink{animation:blink 3.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.18}35%,65%{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.flow,.blink,.pulse,.grow{animation:none}.blink{opacity:1}.pulse,.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#b4400f"/><stop offset="1" stop-color="#8a5300"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#b4400f" stop-opacity="0.08"/><stop offset="1" stop-color="#8a5300" stop-opacity="0.08"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#3c280a" flood-opacity="0.08"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="758.5" height="510.5" rx="16"/>
<text class="k ka" x="24" y="36">1 · POLICY</text>
<rect class="card" x="24.0" y="48" width="208.0" height="66" rx="12" filter="url(#sh)"/>
<text class="t" x="40" y="69.5">Load</text>
<text class="m" x="40" y="87.5">policy.Load</text>
<text class="m" x="40" y="103.5">strict YAML</text>
<rect class="card" x="276.0" y="48" width="208.0" height="66" rx="12" filter="url(#sh)"/>
<text class="t" x="292" y="69.5">Validate</text>
<text class="m" x="292" y="87.5">Org.Validate</text>
<text class="m" x="292" y="103.5">+ 13 guardrails</text>
<rect class="card" x="528.0" y="48" width="208.0" height="66" rx="12" filter="url(#sh)"/>
<text class="t" x="544" y="69.5">Build ring</text>
<text class="m" x="544" y="87.5">release.BuildRing</text>
<text class="m" x="544" y="103.5">+1 release per variant</text>
<path class="ln" d="M238 81L270 81"/>
<path class="ln hd" d="M264.5 84.4L270 81L264.5 77.6"/>
<path class="ln" d="M490 81L522 81"/>
<path class="ln hd" d="M516.5 84.4L522 81L516.5 77.6"/>
<path class="ln" d="M632 120L632.0 128.0Q632 136 624.0 136.0L136.0 136.0Q128 136 128.0 144.0L128 158"/>
<path class="ln hd" d="M124.6 152.5L128 158L131.4 152.5"/>
<text class="k ka" x="24" y="152">2 · RENDER</text>
<rect class="card" x="24.0" y="164" width="208.0" height="66" rx="12" filter="url(#sh)"/>
<text class="t" x="40" y="185.5">Render</text>
<text class="m" x="40" y="203.5">adapter.Render</text>
<text class="m" x="40" y="219.5">each harness x OS</text>
<rect class="card" x="276.0" y="164" width="208.0" height="66" rx="12" filter="url(#sh)"/>
<text class="t" x="292" y="185.5">Backstop</text>
<text class="m" x="292" y="203.5">CheckRendered</text>
<text class="m" x="292" y="219.5">no bypassPermissions</text>
<rect class="card" x="528.0" y="164" width="208.0" height="66" rx="12" filter="url(#sh)"/>
<text class="t" x="544" y="185.5">Pack</text>
<text class="m" x="544" y="203.5">deterministic tar</text>
<text class="m" x="544" y="219.5">digest = sha256(tar)</text>
<path class="ln" d="M238 197L270 197"/>
<path class="ln hd" d="M264.5 200.4L270 197L264.5 193.6"/>
<path class="ln" d="M490 197L522 197"/>
<path class="ln hd" d="M516.5 200.4L522 197L516.5 193.6"/>
<path class="ln" d="M632 236L632.0 244.0Q632 252 624.0 252.0L136.0 252.0Q128 252 128.0 260.0L128 274"/>
<path class="ln hd" d="M124.6 268.5L128 274L131.4 268.5"/>
<text class="k ka" x="24" y="268">3 · SIGN AND PUSH</text>
<rect class="card" x="24.0" y="280" width="208.0" height="66" rx="12" filter="url(#sh)"/>
<text class="t" x="40" y="301.5">Sign</text>
<text class="m" x="40" y="319.5">ed25519(digest)</text>
<text class="m" x="40" y="335.5">cosign co-sign (opt.)</text>
<rect class="card" x="276.0" y="280" width="208.0" height="66" rx="12" filter="url(#sh)"/>
<text class="t" x="292" y="301.5">Push</text>
<text class="m" x="292" y="319.5">config + layer blobs</text>
<text class="m" x="292" y="335.5">sig in annotations</text>
<rect class="card" x="528.0" y="280" width="208.0" height="66" rx="12" filter="url(#sh)"/>
<text class="t" x="544" y="301.5">Tag</text>
<text class="m" x="544" y="319.5">v&lt;version&gt;</text>
<text class="m" x="544" y="335.5">immutable: refuse move</text>
<path class="la" d="M238 313L270 313"/>
<path class="la hd" d="M264.5 316.4L270 313L264.5 309.6"/>
<path class="la" d="M490 313L522 313"/>
<path class="la hd" d="M516.5 316.4L522 313L516.5 309.6"/>
<path class="ln" d="M632 352L632.0 360.0Q632 368 624.0 368.0L136.0 368.0Q128 368 128.0 376.0L128 390"/>
<path class="ln hd" d="M124.6 384.5L128 390L131.4 384.5"/>
<text class="k ka" x="24" y="384">4 · RING POINTER</text>
<rect class="card" x="24.0" y="396" width="208.0" height="66" rx="12" filter="url(#sh)"/>
<text class="t" x="40" y="417.5">Pointer</text>
<text class="m" x="40" y="435.5">{org, ring, digest,</text>
<text class="m" x="40" y="451.5">seq, issuedAt, exp}</text>
<rect class="card" x="276.0" y="396" width="208.0" height="66" rx="12" filter="url(#sh)"/>
<text class="t" x="292" y="417.5">Sign pointer</text>
<text class="m" x="292" y="435.5">ed25519(domain +</text>
<text class="m" x="292" y="451.5">sha256(payload))</text>
<rect class="card" x="528.0" y="396" width="208.0" height="66" rx="12" filter="url(#sh)"/>
<text class="t" x="544" y="417.5">Tag</text>
<text class="m" x="544" y="435.5">ring-&lt;r&gt;.pointer</text>
<text class="m" x="544" y="451.5">+ ring-&lt;r&gt; (info)</text>
<path class="la" d="M238 429L270 429"/>
<path class="la hd" d="M264.5 432.4L270 429L264.5 425.6"/>
<path class="la" d="M490 429L522 429"/>
<path class="la hd" d="M516.5 432.4L522 429L516.5 425.6"/>
</svg>
