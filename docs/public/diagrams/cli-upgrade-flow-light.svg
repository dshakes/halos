<rect class="soft" x="212.0" y="140" width="336.0" height="56" rx="12"/>
<rect class="ring" x="212.75" y="140.75" width="334.5" height="54.5" rx="11.25"/>
<text class="t" x="228" y="164.5">Promote PR</text>
<text class="s" x="228" y="182.5">ring profile = treatment · conclude</text>
<rect class="card" x="212.0" y="208" width="336.0" height="56" rx="12" filter="url(#sh)"/>
<rect class="dcard" x="212.75" y="208.75" width="334.5" height="54.5" rx="11.25"/>
<text class="t td" x="228" y="232.5">Breach</text>
<text class="s" x="228" y="250.5">pause + republish, or halo rollback</text>
