<text class="k ka" x="416" y="48.5">03</text>
<text class="t" x="416" y="66.5">Eval</text>
<text class="m" x="416" y="84.5">halo eval run</text>
<rect class="card" x="588.0" y="24" width="148.0" height="76" rx="12" filter="url(#sh)"/>
<rect class="soft" x="588.0" y="24" width="148.0" height="76" rx="12"/>
<rect class="ring" x="588.75" y="24.75" width="146.5" height="74.5" rx="11.25"/>
<text class="k ka" x="604" y="48.5">04</text>
<text class="t" x="604" y="66.5">Publish</text>
<text class="s" x="604" y="84.5">ring1-canary</text>
<path class="ln" d="M178 62L206 62"/>
<path class="ln hd" d="M200.5 65.4L206 62L200.5 58.6"/>
<path class="ln" d="M366 62L394 62"/>
<path class="ln hd" d="M388.5 65.4L394 62L388.5 58.6"/>
<path class="ln" d="M554 62L582 62"/>
<path class="ln hd" d="M576.5 65.4L582 62L576.5 58.6"/>
<rect class="pa" x="549.7" y="35" width="36.7" height="18" rx="9"/>
