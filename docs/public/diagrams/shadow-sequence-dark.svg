<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" width="760" height="388" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif">
<title id="t">Shadow traffic</title>
<desc id="d">The gateway forwards the request to the primary route, which answers the user. If it is a first turn and sampled, an async copy goes to halo-shadow, which replays it non-streaming against the candidate route, stores the pair and sends it to the judge in batches.</desc>
<style>
.cv{fill:#0f141a;stroke:#232a33;stroke-width:1.5}
.card{fill:#161b22;stroke:#2b3440;stroke-width:1.5}
.soft{fill:url(#gs)}
.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.dcard{fill:#2a1517;stroke:#f87171;stroke-width:1.5}
.ghost{fill:none;stroke:#56606c;stroke-width:1.5;stroke-dasharray:4 4}
.zone{fill:#131921;stroke:#262f3a;stroke-width:1.5}
.chip{fill:#1c232c;stroke:#2b3440;stroke-width:1}
text{font-family:ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#e6edf3}
.tm{font:600 12.5px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#e6edf3}
.td{fill:#f87171}
.s{font-size:12px;fill:#9aa7b4}
.m{font:11px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#9aa7b4}
.xs{font-size:10.5px;font-weight:500;fill:#7d8794}
.xm{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;font-weight:400}
.xa{fill:url(#ga);font-weight:600}
.xd{fill:#f87171;font-weight:600}
.xw{fill:#0b1220;font-weight:600}
.k{font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:#7d8794}
.ka{fill:url(#ga)}
.h1{font-size:42px;font-weight:700;letter-spacing:-.02em;fill:#e6edf3}
.ln,.la,.ld,.lm{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#56606c}.la{stroke:url(#ga)}.ld{stroke:#f87171}.lm{stroke:#2b3440}
.lane{stroke:#2b3440;stroke-width:1.5;stroke-dasharray:3 4}
.dash{stroke-dasharray:5 5}
.dl{fill:#56606c}.da{fill:url(#ga)}.dd{fill:#f87171}
.pl{fill:#0f141a}.pa{fill:#0f141a;stroke:url(#ga);stroke-width:1}
.pd{fill:#2a1517;stroke:#f87171;stroke-width:1}.ps{fill:url(#ga)}
.fa{fill:url(#ga)}.fs{fill:url(#gs)}.fm{fill:#1c232c}.fd{fill:#f87171}.ft{fill:#e6edf3}
.bdg{fill:url(#ga)}.bn{font-size:9.5px;font-weight:700;fill:#0b1220}
.ic{fill:none;stroke:url(#ga);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pkt{fill:url(#ga)}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 4.8s cubic-bezier(.6,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.08)}25%{transform:scaleX(.3)}50%{transform:scaleX(.55)}75%,100%{transform:scaleX(1)}}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.blink{animation:blink 3.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.18}35%,65%{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.flow,.blink,.pulse,.grow{animation:none}.blink{opacity:1}.pulse,.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.12"/><stop offset="1" stop-color="#818cf8" stop-opacity="0.12"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.45"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="758.5" height="386.5" rx="16"/>
<path class="lane" d="M95.2 76V364"/>
<rect class="card" x="29.0" y="24" width="132.4" height="52" rx="12" filter="url(#sh)"/>
<text class="t" x="95.2" y="46.5" text-anchor="middle">Gateway</text>
<text class="m" x="95.2" y="64.5" text-anchor="middle">proxy / kong</text>
<path class="lane" d="M237.6 76V364"/>
<rect class="card" x="171.4" y="24" width="132.4" height="52" rx="12" filter="url(#sh)"/>
<text class="t" x="237.6" y="46.5" text-anchor="middle">Primary</text>
<text class="m" x="237.6" y="64.5" text-anchor="middle">route</text>
<path class="lane" d="M380.0 76V364"/>
<rect class="card" x="313.8" y="24" width="132.4" height="52" rx="12" filter="url(#sh)"/>
<text class="t" x="380" y="46.5" text-anchor="middle">halo-shadow</text>
<text class="m" x="380" y="64.5" text-anchor="middle">mirror</text>
<path class="lane" d="M522.4 76V364"/>
<rect class="card" x="456.2" y="24" width="132.4" height="52" rx="12" filter="url(#sh)"/>
<text class="t" x="522.4" y="46.5" text-anchor="middle">Candidate</text>
<text class="m" x="522.4" y="64.5" text-anchor="middle">route</text>
<path class="lane" d="M664.8 76V364"/>
<rect class="card" x="598.6" y="24" width="132.4" height="52" rx="12" filter="url(#sh)"/>
<text class="t" x="664.8" y="46.5" text-anchor="middle">Judge</text>
<text class="m" x="664.8" y="64.5" text-anchor="middle">LLM</text>
<path class="ln" d="M99.2 122L233.6 122"/>
<path class="ln hd" d="M228.1 125.4L233.6 122L228.1 118.6"/>
<rect class="pl" x="77.0" y="101" width="178.9" height="17" rx="4"/>
<text class="s" x="166.4" y="114" text-anchor="middle" style="font-size:11.5px">request (the user waits on this)</text>
<path class="ln dash" d="M233.6 158L99.2 158"/>
<path class="ln hd" d="M104.7 154.6L99.2 158L104.7 161.4"/>
<rect class="pl" x="137.6" y="137" width="57.7" height="17" rx="4"/>
<text class="s" x="166.4" y="150" text-anchor="middle" style="font-size:11.5px">response</text>
<path class="la dash" d="M99.2 194L376 194"/>
<path class="la hd" d="M370.5 197.4L376 194L370.5 190.6"/>
<rect class="pl" x="136.1" y="173" width="202.9" height="17" rx="4"/>
<text class="s" x="237.6" y="186" text-anchor="middle" style="font-size:11.5px">async copy if first turn and sampled</text>
<path class="ln" d="M384 230L518.4 230"/>
<path class="ln hd" d="M512.9 233.4L518.4 230L512.9 226.6"/>
<rect class="pl" x="388.3" y="209" width="125.9" height="17" rx="4"/>
<text class="s" x="451.2" y="222" text-anchor="middle" style="font-size:11.5px">replay, non-streaming</text>
<path class="ln dash" d="M518.4 266L384 266"/>
<path class="ln hd" d="M389.5 262.6L384 266L389.5 269.4"/>
<rect class="pl" x="395.2" y="245" width="112.1" height="17" rx="4"/>
<text class="s" x="451.2" y="258" text-anchor="middle" style="font-size:11.5px">candidate response</text>
<rect class="chip" x="336.4" y="285" width="87.1" height="22" rx="6"/>
<text class="m" x="380" y="300" text-anchor="middle">store pair</text>
<path class="la dash" d="M384 338L660.8 338"/>
<path class="la hd" d="M655.3 341.4L660.8 338L655.3 334.6"/>
<rect class="pl" x="481.9" y="317" width="81.0" height="17" rx="4"/>
<text class="s" x="522.4" y="330" text-anchor="middle" style="font-size:11.5px">batch grading</text>
</svg>
