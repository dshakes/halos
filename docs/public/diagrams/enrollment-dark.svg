<text class="bn" x="32.0" y="257.4" text-anchor="middle">5</text>
<text class="s" x="46.0" y="258" style="font-size:11.5px">one-time token (15 min TTL) + enroll commands</text>
<path class="ln" d="M87.3333 302L672.667 302"/>
