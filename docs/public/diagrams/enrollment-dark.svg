<circle class="bdg" cx="32.0" cy="470" r="8"/>
<text class="bn" x="32.0" y="473.4" text-anchor="middle">11</text>
<text class="s" x="46.0" y="474" style="font-size:11.5px">POST /api/v1/requests (mcp-server linear)</text>
