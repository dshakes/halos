<text class="bn" x="196.9233333333334" y="185.4" text-anchor="middle">3</text>
<text class="s" x="210.9" y="186" style="font-size:11.5px">id token (user, groups)</text>
<path class="ln" d="M87.3333 230L198 230"/>
<path class="ln hd" d="M192.5 233.4L198 230L192.5 226.6"/>
<rect class="pl" x="55.3" y="209" width="174.8" height="17" rx="4"/>
<circle class="bdg" cx="67.27416666666673" cy="218" r="8"/>
<text class="bn" x="67.27416666666673" y="221.4" text-anchor="middle">4</text>
<text class="s" x="81.3" y="222" style="font-size:11.5px">POST /api/v1/launch/laptop</text>
