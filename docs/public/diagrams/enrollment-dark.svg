<rect class="card" x="622.3" y="24" width="108.7" height="52" rx="12" filter="url(#sh)"/>
<text class="t" x="676.65" y="46.5" text-anchor="middle">Laptop</text>
<text class="m" x="676.65" y="64.5" text-anchor="middle">halod</text>
