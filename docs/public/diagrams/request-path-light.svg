<rect class="pl" x="186.4" y="173" width="244.7" height="17" rx="4"/>
<circle class="bdg" cx="198.44750000000008" cy="182" r="8"/>
<text class="bn" x="198.44750000000008" y="185.4" text-anchor="middle">2</text>
<text class="s" x="212.4" y="186" style="font-size:11.5px">JWKS (cached, refetch on unknown kid)</text>
<rect class="chip" x="113.5" y="213" width="248.1" height="22" rx="6"/>
<text class="m" x="237.6" y="228" text-anchor="middle">verify iss · aud · exp · nbf · alg</text>
<rect class="chip" x="90.0" y="249" width="295.1" height="22" rx="6"/>
<text class="m" x="237.6" y="264" text-anchor="middle">ring, experiment, variant ← user + groups</text>
<rect class="chip" x="73.3" y="285" width="328.7" height="22" rx="6"/>
<text class="m" x="237.6" y="300" text-anchor="middle">model allowlist (fails closed) · alias → route</text>
