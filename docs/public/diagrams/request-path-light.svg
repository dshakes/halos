<rect class="card" x="456.2" y="24" width="132.4" height="52" rx="12" filter="url(#sh)"/>
<text class="t" x="522.4" y="46.5" text-anchor="middle">Upstream</text>
<text class="m" x="522.4" y="64.5" text-anchor="middle">provider</text>
<path class="lane" d="M664.8 76V436"/>
<rect class="card" x="598.6" y="24" width="132.4" height="52" rx="12" filter="url(#sh)"/>
<text class="t" x="664.8" y="46.5" text-anchor="middle">halo-shadow</text>
<text class="m" x="664.8" y="64.5" text-anchor="middle">mirror</text>
<path class="ln" d="M99.2 122L233.6 122"/>
<path class="ln hd" d="M228.1 125.4L233.6 122L228.1 118.6"/>
<rect class="pl" x="20.0" y="101" width="317.3" height="17" rx="4"/>
<circle class="bdg" cx="32.0" cy="110" r="8"/>
<text class="bn" x="32.0" y="113.4" text-anchor="middle">1</text>
<text class="s" x="46.0" y="114" style="font-size:11.5px">POST /v1/messages · Bearer JWT · spoofed x-halo-*</text>
<rect class="chip" x="160.5" y="141" width="154.2" height="22" rx="6"/>
<text class="m" x="237.6" y="156" text-anchor="middle">strip every x-halo-*</text>
