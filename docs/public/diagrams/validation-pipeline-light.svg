<text class="t" x="293.3" y="64.5">Loader</text>
<text class="s" x="293.3" y="82.5">refs · extends · ring order</text>
<rect class="card" x="530.7" y="24" width="205.3" height="72" rx="12" filter="url(#sh)"/>
<text class="k ka" x="546.7" y="46.5">03</text>
<text class="t" x="546.7" y="64.5">Schema</text>
<text class="s" x="546.7" y="82.5">schema-level validation</text>
<path class="ln" d="M235.333 60L271.333 60"/>
<path class="ln hd" d="M265.8 63.4L271.333 60L265.8 56.6"/>
<path class="ln" d="M488.667 60L524.667 60"/>
<path class="ln hd" d="M519.1 63.4L524.667 60L519.1 56.6"/>
<rect class="card" x="24.0" y="128" width="205.3" height="72" rx="12" filter="url(#sh)"/>
<text class="k ka" x="40" y="150.5">04</text>
<text class="t" x="40" y="168.5">Guardrails</text>
<text class="s" x="40" y="186.5">Go checks, no OPA</text>
<rect class="card" x="277.3" y="128" width="205.3" height="72" rx="12" filter="url(#sh)"/>
<text class="k ka" x="293.3" y="150.5">05</text>
<text class="t" x="293.3" y="168.5">Adapter render</text>
<text class="s" x="293.3" y="186.5">unsupported → warning</text>
<rect class="card" x="530.7" y="128" width="205.3" height="72" rx="12" filter="url(#sh)"/>
<rect class="soft" x="530.7" y="128" width="205.3" height="72" rx="12"/>
<rect class="ring" x="531.45" y="128.75" width="203.8" height="70.5" rx="11.25"/>
<text class="k ka" x="546.7" y="150.5">06</text>
<text class="t" x="546.7" y="168.5">Release backstop</text>
<text class="s" x="546.7" y="186.5">re-checks rendered files</text>
