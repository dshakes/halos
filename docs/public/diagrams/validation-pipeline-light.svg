<path class="ln hd" d="M265.8 167.4L271.333 164L265.8 160.6"/>
<path class="ln" d="M488.667 164L524.667 164"/>
<path class="ln hd" d="M519.1 167.4L524.667 164L519.1 160.6"/>
<path class="ln" d="M633.333 102L633.3 107.0Q633.333 112 628.3 112.0L131.7 112.0Q126.667 112 126.7 117.0L126.667 122"/>
