<rect class="chip" x="528" y="92" width="196" height="22" rx="6"/>
<text class="m" x="536" y="107">gateway token</text>
<rect class="chip" x="528" y="120" width="196" height="22" rx="6"/>
<text class="m" x="536" y="135">provider creds (env)</text>
