<rect class="chip" x="528" y="384" width="196" height="22" rx="6"/>
<text class="m" x="536" y="399">-&gt; ClickHouse</text>
<rect class="ghost" x="270" y="360" width="220" height="56" rx="12"/>
<text class="t" x="286" y="384.5">OIDC IdP</text>
<text class="s" x="286" y="402.5">signs developer JWTs</text>
