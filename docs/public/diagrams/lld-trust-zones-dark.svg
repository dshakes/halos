<rect class="chip" x="36" y="402" width="196" height="22" rx="6"/>
<text class="m" x="44" y="417">device token (0600)</text>
<rect class="zone" x="516" y="260" width="220" height="156" rx="16"/>
<text class="k ka" x="532" y="284">OTEL COLLECTOR</text>
<rect class="chip" x="528" y="300" width="196" height="22" rx="6"/>
<text class="m" x="536" y="315">:4319 gateway token</text>
<rect class="chip" x="528" y="328" width="196" height="22" rx="6"/>
<text class="m" x="536" y="343">:4320 eval token</text>
<rect class="chip" x="528" y="356" width="196" height="22" rx="6"/>
