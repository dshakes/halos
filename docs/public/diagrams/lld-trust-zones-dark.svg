<text class="s" x="48" y="470">release + signed ring pointer pushed, signed with the release key</text>
<circle class="bdg" cx="32" cy="488" r="8"/>
<text class="bn" x="32" y="491.4" text-anchor="middle">2</text>
<text class="s" x="48" y="492">halod verifies with its release pubkeys: signature, org, ring, seq, expiry</text>
<circle class="bdg" cx="32" cy="510" r="8"/>
<text class="bn" x="32" y="513.4" text-anchor="middle">3</text>
<text class="s" x="48" y="514">device token: GET fleet/ring, POST fleet/report, GET fleet/killswitch</text>
<circle class="bdg" cx="32" cy="532" r="8"/>
<text class="bn" x="32" y="535.4" text-anchor="middle">4</text>
<text class="s" x="48" y="536">gateway token: GET gateway/killswitch; the list is ed25519-signed, &lt;= 10 min old</text>
<circle class="bdg" cx="32" cy="554" r="8"/>
<text class="bn" x="32" y="557.4" text-anchor="middle">5</text>
<text class="s" x="48" y="558">OTLP bearer on :4319 -&gt; halo.source=gateway, the only source that may auto-kill</text>
<circle class="bdg" cx="32" cy="576" r="8"/>
<text class="bn" x="32" y="579.4" text-anchor="middle">6</text>
<text class="s" x="48" y="580">gateways verify developer JWTs against the IdP's JWKS (OIDC discovery)</text>
</svg>
