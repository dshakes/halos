<rect class="chip" x="282" y="120" width="196" height="22" rx="6"/>
<text class="m" x="290" y="135">fleet token</text>
<rect class="chip" x="282" y="148" width="196" height="22" rx="6"/>
<text class="m" x="290" y="163">device tokens (hashed)</text>
<rect class="chip" x="282" y="176" width="196" height="22" rx="6"/>
<text class="m" x="290" y="191">release pubkey (enroll)</text>
<rect class="chip" x="282" y="204" width="196" height="22" rx="6"/>
<text class="m" x="290" y="219">OIDC client secret</text>
<rect class="chip" x="282" y="232" width="196" height="22" rx="6"/>
<text class="m" x="290" y="247">session key</text>
<rect class="zone" x="516" y="24" width="220" height="184" rx="16"/>
<text class="k ka" x="532" y="48">GATEWAYS</text>
<rect class="chip" x="528" y="64" width="196" height="22" rx="6"/>
