<rect class="chip" x="528" y="176" width="196" height="22" rx="6"/>
<text class="m" x="536" y="191">shadow token</text>
<rect class="ghost" x="24" y="182" width="220" height="52" rx="12"/>
<text class="t" x="40" y="204.5">OCI registry</text>
<text class="s" x="40" y="222.5">untrusted storage</text>
<rect class="zone" x="24" y="278" width="220" height="156" rx="16"/>
<text class="k ka" x="40" y="302">DEVICES (HALOD)</text>
<rect class="chip" x="36" y="318" width="196" height="22" rx="6"/>
<text class="m" x="44" y="333">release pubkeys</text>
<rect class="chip" x="36" y="346" width="196" height="22" rx="6"/>
<text class="m" x="44" y="361">revokedKeys</text>
<rect class="chip" x="36" y="374" width="196" height="22" rx="6"/>
