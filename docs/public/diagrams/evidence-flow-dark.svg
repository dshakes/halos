<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif">
<title id="t">Evidence plane</title>
<desc id="d">OTEL from Claude Code, Codex and Gemini CLI plus halo-proxy gateway metrics flow through the collector into ClickHouse; shadow pairs are graded by an LLM judge and eval runs become scorecards. halo exp analyze opens promotion PRs; the controller fires the kill switch with a pause PR on rollback, or opens a conclude PR on promote or expiry.</desc>
