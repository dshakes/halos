<text class="xs" x="593.22" y="148.6" text-anchor="middle">last-known ring</text>
<rect class="card" x="56" y="180" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="199.5">Verify the ring pointer</text>
<text class="m" x="96" y="217.5">signature, org, seq &gt;= last, expiry</text>
<circle class="bdg" cx="76" cy="203.0" r="8"/>
<text class="bn" x="76" y="206.4" text-anchor="middle">3</text>
<path class="ln" d="M76 169L76 171"/>
