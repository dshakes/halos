<text class="t" x="96" y="257.5">Verify, then fetch the release</text>
<text class="m" x="96" y="275.5">sig over layer digest before download</text>
<circle class="bdg" cx="76" cy="261.0" r="8"/>
<text class="bn" x="76" y="264.4" text-anchor="middle">4</text>
<path class="ln" d="M76 227L76 229"/>
<path class="ld" d="M514 261L544 261"/>
<path class="ld hd" d="M538.5 264.4L544 261L538.5 257.6"/>
<rect class="pd" x="548.0" y="252.0" width="84.2" height="18" rx="9"/>
<text class="xs xd" x="590.122" y="264.6" text-anchor="middle">keep last-good</text>
<rect class="card" x="56" y="296" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="315.5">Pick the variant channel</text>
<text class="m" x="96" y="333.5">ResolveVariant (gateway hash), kill list</text>
<circle class="bdg" cx="76" cy="319.0" r="8"/>
<text class="bn" x="76" y="322.4" text-anchor="middle">5</text>
<path class="ln" d="M76 285L76 287"/>
<path class="ld" d="M514 319L544 319"/>
<path class="ld hd" d="M538.5 322.4L544 319L538.5 315.6"/>
<rect class="pd" x="548.0" y="310.0" width="84.2" height="18" rx="9"/>
<text class="xs xd" x="590.122" y="322.6" text-anchor="middle">keep last-good</text>
<rect class="card" x="56" y="354" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="373.5">Merge toggles</text>
<text class="m" x="96" y="391.5">activeToggles -&gt; withToggles</text>
<circle class="bdg" cx="76" cy="377.0" r="8"/>
<text class="bn" x="76" y="380.4" text-anchor="middle">6</text>
<path class="ln" d="M76 343L76 345"/>
<rect class="card" x="56" y="412" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="431.5">Check every target</text>
<text class="m" x="96" y="449.5">allowlist, mode &lt;= 0644, root-owned chain</text>
<circle class="bdg" cx="76" cy="435.0" r="8"/>
<text class="bn" x="76" y="438.4" text-anchor="middle">7</text>
<path class="ln" d="M76 401L76 403"/>
<path class="ld" d="M514 435L544 435"/>
<path class="ld hd" d="M538.5 438.4L544 435L538.5 431.6"/>
<rect class="pd" x="548.0" y="426.0" width="86.4" height="18" rx="9"/>
<text class="xs xd" x="591.225" y="438.6" text-anchor="middle">refuse that file</text>
<rect class="card" x="56" y="470" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="489.5">Write atomically</text>
<text class="m" x="96" y="507.5">temp file, fsync, rename</text>
<circle class="bdg" cx="76" cy="493.0" r="8"/>
<text class="bn" x="76" y="496.4" text-anchor="middle">8</text>
<path class="ln" d="M76 459L76 461"/>
<rect class="card" x="56" y="528" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="547.5">Remove stale files</text>
<text class="m" x="96" y="565.5">only inside managed locations</text>
<circle class="bdg" cx="76" cy="551.0" r="8"/>
<text class="bn" x="76" y="554.4" text-anchor="middle">9</text>
<path class="ln" d="M76 517L76 519"/>
