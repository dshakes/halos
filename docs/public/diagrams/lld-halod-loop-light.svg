<text class="t" x="96" y="605.5">Save state, report</text>
<text class="m" x="96" y="623.5">state.json, POST reportURL</text>
<circle class="bdg" cx="76" cy="609.0" r="8"/>
<text class="bn" x="76" y="612.4" text-anchor="middle">10</text>
<path class="ln" d="M76 575L76 577"/>
<path class="la" d="M514 609L544 609"/>
<path class="la hd" d="M538.5 612.4L544 609L538.5 605.6"/>
<rect class="pl" x="548.0" y="600.0" width="71.4" height="18" rx="9"/>
<text class="xs" x="583.717" y="612.6" text-anchor="middle">halo-server</text>
<path class="la dash" d="M54 609L42.0 609.0Q34 609 34.0 601.0L34.0 95.0Q34 87 42.0 87.0L50 87"/>
<path class="la hd" d="M44.5 90.4L50 87L44.5 83.6"/>
<rect class="pa" x="2.2" y="339.0" width="63.7" height="18" rx="9"/>
<text class="xs xa" x="34" y="351.6" text-anchor="middle">next cycle</text>
</svg>
