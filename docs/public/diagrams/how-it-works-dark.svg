<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" width="880" height="368" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif">
<title id="t">How Halos works</title>
<desc id="d">The platform team owns a git policy repo of Halos YAML. A change is a pull request: CI validates, plans and evals it, a human merges, and halo publishes a signed, immutable release. Rings point at releases; halod applies them on every machine and the gateway routes model traffic. Developers keep running their CLI as usual and never touch the repo.</desc>
<style>
.cv{fill:#0c0c10;stroke:#1e1e24;stroke-width:1.5}
.card{fill:#121217;stroke:#2a2a31;stroke-width:1.5}
.soft{fill:url(#gs)}
.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.dcard{fill:#2a1414;stroke:#ff7a7a;stroke-width:1.5}
.ghost{fill:none;stroke:#5a564f;stroke-width:1.5;stroke-dasharray:4 4}
.zone{fill:#0f0f14;stroke:#24242b;stroke-width:1.5}
.chip{fill:#1a1a20;stroke:#2a2a31;stroke-width:1}
text{font-family:ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#f4f1ea}
.tm{font:600 12.5px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#f4f1ea}
.td{fill:#ff7a7a}
.s{font-size:12px;fill:#bdb7ac}
.m{font:11px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#bdb7ac}
.xs{font-size:10.5px;font-weight:500;fill:#9a958b}
.xm{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;font-weight:400}
.xa{fill:url(#ga);font-weight:600}
.xd{fill:#ff7a7a;font-weight:600}
.xw{fill:#16130f;font-weight:600}
.k{font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:#9a958b}
.ka{fill:url(#ga)}
.h1{font-size:42px;font-weight:700;letter-spacing:-.02em;fill:#f4f1ea}
.ln,.la,.ld,.lm{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#5a564f}.la{stroke:url(#ga)}.ld{stroke:#ff7a7a}.lm{stroke:#2a2a31}
.lane{stroke:#2a2a31;stroke-width:1.5;stroke-dasharray:3 4}
.dash{stroke-dasharray:5 5}
.dl{fill:#5a564f}.da{fill:url(#ga)}.dd{fill:#ff7a7a}
.pl{fill:#0c0c10}.pa{fill:#0c0c10;stroke:url(#ga);stroke-width:1}
.pd{fill:#2a1414;stroke:#ff7a7a;stroke-width:1}.ps{fill:url(#ga)}
.fa{fill:url(#ga)}.fs{fill:url(#gs)}.fm{fill:#1a1a20}.fd{fill:#ff7a7a}.ft{fill:#f4f1ea}
.bdg{fill:url(#ga)}.bn{font-size:9.5px;font-weight:700;fill:#16130f}
.ic{fill:none;stroke:url(#ga);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pkt{fill:url(#ga)}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 4.8s cubic-bezier(.6,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.08)}25%{transform:scaleX(.3)}50%{transform:scaleX(.55)}75%,100%{transform:scaleX(1)}}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.blink{animation:blink 3.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.18}35%,65%{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.flow,.blink,.pulse,.grow{animation:none}.blink{opacity:1}.pulse,.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#ffb547"/><stop offset="1" stop-color="#ff7a4d"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0"><stop offset="0" stop-color="#ffb547" stop-opacity="0.12"/><stop offset="1" stop-color="#ff7a4d" stop-opacity="0.12"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.5"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="878.5" height="366.5" rx="16"/>
<rect class="zone" x="24" y="24" width="832" height="128" rx="16"/>
<text class="k ka" x="40" y="48">PLATFORM TEAM · OWNS THE POLICY REPO</text>
<rect class="card" x="40.0" y="60" width="137.6" height="76" rx="12" filter="url(#sh)"/>
<text class="k ka" x="56" y="76.5">01</text>
<text class="t" x="56" y="94.5">Policy repo</text>
<text class="s" x="56" y="112.5">git · Halos YAML</text>
<text class="s" x="56" y="128.5">halo init</text>
<rect class="card" x="205.6" y="60" width="137.6" height="76" rx="12" filter="url(#sh)"/>
<text class="k ka" x="221.6" y="76.5">02</text>
<text class="t" x="221.6" y="94.5">Pull request</text>
<text class="s" x="221.6" y="112.5">edit rings,</text>
<text class="s" x="221.6" y="128.5">profiles, models</text>
<rect class="card" x="371.2" y="60" width="137.6" height="76" rx="12" filter="url(#sh)"/>
<text class="k ka" x="387.2" y="76.5">03</text>
<text class="t" x="387.2" y="94.5">CI checks</text>
<text class="s" x="387.2" y="112.5">validate · plan</text>
<text class="s" x="387.2" y="128.5">eval gate</text>
<rect class="card" x="536.8" y="60" width="137.6" height="76" rx="12" filter="url(#sh)"/>
<text class="k ka" x="552.8" y="76.5">04</text>
<text class="t" x="552.8" y="94.5">Human merges</text>
<text class="s" x="552.8" y="112.5">no auto-merge</text>
<text class="s" x="552.8" y="128.5">ever</text>
<rect class="card" x="702.4" y="60" width="137.6" height="76" rx="12" filter="url(#sh)"/>
<rect class="soft" x="702.4" y="60" width="137.6" height="76" rx="12"/>
<rect class="ring" x="703.15" y="60.75" width="136.1" height="74.5" rx="11.25"/>
<text class="k ka" x="718.4" y="76.5">05</text>
<text class="t" x="718.4" y="94.5">Signed release</text>
<text class="s" x="718.4" y="112.5">OCI, immutable</text>
<text class="s" x="718.4" y="128.5">halo release</text>
<path class="ln" d="M183.6 98L199.6 98"/>
<path class="ln hd" d="M194.1 101.4L199.6 98L194.1 94.6"/>
<path class="ln" d="M349.2 98L365.2 98"/>
<path class="ln hd" d="M359.7 101.4L365.2 98L359.7 94.6"/>
<path class="ln" d="M514.8 98L530.8 98"/>
<path class="ln hd" d="M525.3 101.4L530.8 98L525.3 94.6"/>
<path class="ln" d="M680.4 98L696.4 98"/>
<path class="ln hd" d="M690.9 101.4L696.4 98L690.9 94.6"/>
<rect class="zone" x="24" y="176" width="832" height="168" rx="16"/>
<text class="k ka" x="40" y="200">FLEET · DEVELOPERS NEVER TOUCH THE REPO</text>
<path class="la flow" d="M771.2 142L771.2 206"/>
<path class="la hd" d="M767.8 200.5L771.2 206L774.6 200.5"/>
<circle class="pkt" r="3.2"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" rotate="auto" path="M771.2 142L771.2 206"/></circle>
<rect class="card" x="672" y="212" width="168" height="112" rx="12" filter="url(#sh)"/>
<rect class="soft" x="672" y="212" width="168" height="112" rx="12"/>
<rect class="ring" x="672.75" y="212.75" width="166.5" height="110.5" rx="11.25"/>
<text class="t" x="688" y="248.5">Rings</text>
<text class="s" x="688" y="266.5">ring0 → ring1 → GA</text>
<text class="s" x="688" y="282.5">point at releases</text>
<text class="s" x="688" y="298.5">rollback = re-point</text>
<rect class="card" x="372" y="212" width="252" height="52" rx="12" filter="url(#sh)"/>
<text class="t" x="388" y="234.5">halod on every machine</text>
<text class="s" x="388" y="252.5">laptops · dev containers · CI</text>
<rect class="card" x="372" y="272" width="252" height="52" rx="12" filter="url(#sh)"/>
<text class="t" x="388" y="294.5">Gateway</text>
<text class="s" x="388" y="312.5">halo-proxy · halo-kong route models</text>
<rect class="card" x="40" y="212" width="280" height="112" rx="12" filter="url(#sh)"/>
<text class="t" x="56" y="248.5">Developer</text>
<text class="s" x="56" y="266.5">runs claude, codex or gemini</text>
<text class="s" x="56" y="282.5">as usual; gets the ring's config</text>
<text class="s" x="56" y="298.5">and models automatically</text>
