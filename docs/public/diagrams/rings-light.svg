<text class="tm" x="414" y="60.5">ring2</text>
<text class="s" x="414" y="78.5">25% by hash</text>
<text class="s" x="414" y="94.5"></text>
<rect class="card" x="585.0" y="24" width="151.0" height="96" rx="12" filter="url(#sh)"/>
<rect class="soft" x="585.0" y="24" width="151.0" height="96" rx="12"/>
<rect class="ring" x="585.75" y="24.75" width="149.5" height="94.5" rx="11.25"/>
<text class="tm" x="601" y="60.5">ring3</text>
<text class="s" x="601" y="78.5">GA · default</text>
<text class="s" x="601" y="94.5"></text>
