<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 212" width="760" height="212" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif">
<title id="t">Model route failover</title>
<desc id="d">A model alias resolves to priority tiers. Within tier 0 a weighted pick, sticky per user and session, goes first and the rest of the tier follows. On a connect error, 5xx or 429, before any byte reaches the client, halo-proxy tries the next target, then the next tier.</desc>
<style>
.cv{fill:#0d0f14;stroke:#1f232c;stroke-width:1.5}
.card{fill:#14171e;stroke:#2a2f3a;stroke-width:1.5}
.soft{fill:url(#gs)}
.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.dcard{fill:#2a1517;stroke:#f87171;stroke-width:1.5}
.ghost{fill:none;stroke:#555d6c;stroke-width:1.5;stroke-dasharray:4 4}
.zone{fill:#111319;stroke:#232731;stroke-width:1.5}
.chip{fill:#1a1d26;stroke:#2a2f3a;stroke-width:1}
text{font-family:ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#eceef3}
.tm{font:600 12.5px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#eceef3}
.td{fill:#f87171}
.s{font-size:12px;fill:#a6adbb}
.m{font:11px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#a6adbb}
.xs{font-size:10.5px;font-weight:500;fill:#8a92a3}
.xm{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;font-weight:400}
.xa{fill:url(#ga);font-weight:600}
.xd{fill:#f87171;font-weight:600}
.xw{fill:#0b1220;font-weight:600}
.k{font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:#8a92a3}
.ka{fill:url(#ga)}
.h1{font-size:42px;font-weight:700;letter-spacing:-.02em;fill:#eceef3}
.ln,.la,.ld,.lm{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#555d6c}.la{stroke:url(#ga)}.ld{stroke:#f87171}.lm{stroke:#2a2f3a}
.lane{stroke:#2a2f3a;stroke-width:1.5;stroke-dasharray:3 4}
.dash{stroke-dasharray:5 5}
.dl{fill:#555d6c}.da{fill:url(#ga)}.dd{fill:#f87171}
.pl{fill:#0d0f14}.pa{fill:#0d0f14;stroke:url(#ga);stroke-width:1}
.pd{fill:#2a1517;stroke:#f87171;stroke-width:1}.ps{fill:url(#ga)}
.fa{fill:url(#ga)}.fs{fill:url(#gs)}.fm{fill:#1a1d26}.fd{fill:#f87171}.ft{fill:#eceef3}
.bdg{fill:url(#ga)}.bn{font-size:9.5px;font-weight:700;fill:#0b1220}
.ic{fill:none;stroke:url(#ga);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pkt{fill:url(#ga)}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 4.8s cubic-bezier(.6,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.08)}25%{transform:scaleX(.3)}50%{transform:scaleX(.55)}75%,100%{transform:scaleX(1)}}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.blink{animation:blink 3.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.18}35%,65%{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.flow,.blink,.pulse,.grow{animation:none}.blink{opacity:1}.pulse,.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.12"/><stop offset="1" stop-color="#818cf8" stop-opacity="0.12"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.45"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="758.5" height="210.5" rx="16"/>
<rect class="card" x="24" y="72" width="136" height="56" rx="12" filter="url(#sh)"/>
<text class="tm" x="40" y="96.5">alias</text>
<text class="m" x="40" y="114.5">opus · default</text>
<rect class="zone" x="188" y="24" width="300" height="164" rx="16"/>
<text class="k ka" x="204" y="48">TIER 0 · PRIORITY 0</text>
<rect class="card" x="204" y="60" width="268" height="52" rx="12" filter="url(#sh)"/>
<rect class="soft" x="204" y="60" width="268" height="52" rx="12"/>
<rect class="ring" x="204.75" y="60.75" width="266.5" height="50.5" rx="11.25"/>
<text class="t" x="220" y="82.5">Weighted pick</text>
<text class="s" x="220" y="100.5">90 / 10, sticky per user+session</text>
<rect class="card" x="204" y="124" width="268" height="48" rx="12" filter="url(#sh)"/>
<text class="t" x="220" y="144.5">Rest of tier</text>
<text class="s" x="220" y="162.5">policy order</text>
<rect class="zone" x="536" y="24" width="200" height="164" rx="16"/>
<text class="k ka" x="552" y="48">TIER 1 · PRIORITY 1</text>
<rect class="card" x="552" y="60" width="168" height="52" rx="12" filter="url(#sh)"/>
<text class="t" x="568" y="82.5">Failover target</text>
<text class="s" x="568" y="100.5">other provider</text>
<path class="ln" d="M166 100L182 100"/>
<path class="ln hd" d="M176.5 103.4L182 100L176.5 96.6"/>
<path class="ln" d="M338 112L338 118"/>
<path class="ln hd" d="M334.6 112.5L338 118L341.4 112.5"/>
<path class="ld dash" d="M478 86L546 86"/>
<path class="ld hd" d="M540.5 89.4L546 86L540.5 82.6"/>
<rect class="pd" x="496.3" y="77" width="31.4" height="18" rx="9"/>
<text class="xs xd" x="512" y="89.6" text-anchor="middle">5xx</text>
<text class="xs" x="552" y="140">connect error, 5xx or 429,</text>
<text class="xs" x="552" y="156">before the first byte</text>
</svg>
