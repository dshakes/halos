<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1228" width="760" height="1228" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif">
<title id="t">Halos enterprise architecture</title>
<desc id="d">A policy repo is validated, planned and evaluated, then built into one signed OCI release that rings point at. The release reaches Claude Code, Codex, Gemini CLI, Copilot CLI, Cursor CLI and OpenCode three ways: laptops through MDM and halod, cloud workspaces through the Coder module, Codespaces and the Dev Container Feature, and CI through workload identity. Every model call goes through the halo-proxy or halo-kong gateway, which holds the provider keys and enforces identity, DLP, budgets, the kill switch and posture gates. halo-server holds fleet status, SSO, SCIM, RBAC, the signed audit chain exported to a SIEM, retention and the portal. Each box is marked verified in CI, verified by hand, UNVERIFIED or proposed.</desc>
