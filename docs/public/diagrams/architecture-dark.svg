<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 592" width="880" height="592" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif">
<title id="t">Halos architecture</title>
<desc id="d">Policy compiles to a signed release and ring pointers. The client plane (halod, MDM, Dev Container Feature, Coder, CI action) applies it; the traffic plane (halo-proxy or the Kong plugin) routes to Anthropic, Bedrock, Vertex or OpenAI, scans for secrets and prompt injection, meters budgets and carries revocable delegated agent credentials; the client plane also enforces the sandbox, egress, MCP registry and digest-pinned agent artifacts; the evidence plane (OTEL with the session ledger, ClickHouse, halo eval, controller with randomized ROI, MCP and halo copilot, and halo-server with RBAC, SCIM and SIEM audit export on Postgres) proposes promotion PRs and fires the kill switch. Six harnesses run on the client plane.</desc>
