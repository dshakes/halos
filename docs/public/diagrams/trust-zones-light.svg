<rect class="dcard" x="436.75" y="128.75" width="282.5" height="50.5" rx="11.25"/>
<text class="t td" x="452" y="150.5">Attacker on the network</text>
<text class="s" x="452" y="168.5">targets registry · gateway · server</text>
<text class="s" x="452" y="216">Nothing from Z0 is trusted without a</text>
<text class="s" x="452" y="234">signature or a pinned hash.</text>
<rect class="zone" x="24" y="296" width="316" height="296" rx="16"/>
<text class="k ka" x="40" y="320">Z1 · DEVELOPER MACHINE</text>
<rect class="card" x="108" y="332" width="216" height="48" rx="12" filter="url(#sh)"/>
<text class="t" x="124" y="352.5">Developer + agent</text>
<text class="s" x="124" y="370.5">non-root · any header</text>
<rect class="ghost" x="40" y="396" width="284" height="180" rx="12"/>
<text class="k" x="308" y="418" text-anchor="end">ROOT-OWNED</text>
<rect class="card" x="56" y="432" width="116" height="48" rx="12" filter="url(#sh)"/>
<rect class="soft" x="56" y="432" width="116" height="48" rx="12"/>
<rect class="ring" x="56.75" y="432.75" width="114.5" height="46.5" rx="11.25"/>
<text class="t" x="72" y="452.5">halod</text>
<text class="s" x="72" y="470.5">as root</text>
<rect class="card" x="196" y="432" width="112" height="48" rx="12" filter="url(#sh)"/>
<text class="t" x="212" y="452.5">Config</text>
<text class="s" x="212" y="470.5">key · token</text>
<rect class="card" x="196" y="512" width="112" height="48" rx="12" filter="url(#sh)"/>
<text class="t" x="212" y="532.5">Managed</text>
<text class="s" x="212" y="550.5">mode 0644</text>
