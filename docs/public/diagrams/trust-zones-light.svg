<rect class="zone" x="420" y="296" width="316" height="296" rx="16"/>
<text class="k ka" x="436" y="320">Z3 · YOUR INFRASTRUCTURE</text>
<rect class="card" x="436" y="332" width="284" height="48" rx="12" filter="url(#sh)"/>
<rect class="soft" x="436" y="332" width="284" height="48" rx="12"/>
<rect class="ring" x="436.75" y="332.75" width="282.5" height="46.5" rx="11.25"/>
<text class="t" x="452" y="352.5">halo-proxy / halo-kong</text>
<text class="s" x="452" y="370.5">verifies JWT · strips headers</text>
