<path class="ln hd" d="M178.6 192.5L182 198L185.4 192.5"/>
<text class="xs" x="194" y="196">signed release + pointer</text>
<rect class="zone" x="420" y="24" width="316" height="248" rx="16"/>
<text class="k" x="436" y="48">Z0 · INTERNET</text>
<text class="xs" x="720" y="48" text-anchor="end">untrusted</text>
<rect class="card" x="436" y="60" width="284" height="52" rx="12" filter="url(#sh)"/>
<text class="t" x="452" y="82.5">Vendor download hosts</text>
<text class="s" x="452" y="100.5">CLI tarballs, npm → halod, hash-checked</text>
