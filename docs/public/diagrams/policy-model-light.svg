<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif">
<title id="t">Policy model</title>
<desc id="d">Rings point at a profile. Experiments target rings and vary either a profile (client axis) or gateway routes (traffic axis). Profiles extend other profiles.</desc>
<style>
.cv{fill:#f7f2e9;stroke:#e6ddcd;stroke-width:1.5}
.card{fill:#fffdf9;stroke:#e3d9c8;stroke-width:1.5}
.soft{fill:url(#gs)}
.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.dcard{fill:#fbedea;stroke:#b42323;stroke-width:1.5}
.ghost{fill:none;stroke:#a89f90;stroke-width:1.5;stroke-dasharray:4 4}
.zone{fill:#f3ece0;stroke:#e0d5c2;stroke-width:1.5}
.chip{fill:#f3ece0;stroke:#e3d9c8;stroke-width:1}
text{font-family:ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#16130f}
.tm{font:600 12.5px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#16130f}
.td{fill:#b42323}
.s{font-size:12px;fill:#4a443b}
.m{font:11px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#4a443b}
.xs{font-size:10.5px;font-weight:500;fill:#655e52}
.xm{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;font-weight:400}
.xa{fill:url(#ga);font-weight:600}
.xd{fill:#b42323;font-weight:600}
.xw{fill:#fffdf9;font-weight:600}
.k{font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:#655e52}
.ka{fill:url(#ga)}
.h1{font-size:42px;font-weight:700;letter-spacing:-.02em;fill:#16130f}
.ln,.la,.ld,.lm{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#a89f90}.la{stroke:url(#ga)}.ld{stroke:#b42323}.lm{stroke:#e3d9c8}
.lane{stroke:#e3d9c8;stroke-width:1.5;stroke-dasharray:3 4}
.dash{stroke-dasharray:5 5}
.dl{fill:#a89f90}.da{fill:url(#ga)}.dd{fill:#b42323}
.pl{fill:#f7f2e9}.pa{fill:#f7f2e9;stroke:url(#ga);stroke-width:1}
.pd{fill:#fbedea;stroke:#b42323;stroke-width:1}.ps{fill:url(#ga)}
.fa{fill:url(#ga)}.fs{fill:url(#gs)}.fm{fill:#f3ece0}.fd{fill:#b42323}.ft{fill:#16130f}
.bdg{fill:url(#ga)}.bn{font-size:9.5px;font-weight:700;fill:#fffdf9}
.ic{fill:none;stroke:url(#ga);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pkt{fill:url(#ga)}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 4.8s cubic-bezier(.6,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.08)}25%{transform:scaleX(.3)}50%{transform:scaleX(.55)}75%,100%{transform:scaleX(1)}}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.blink{animation:blink 3.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.18}35%,65%{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.flow,.blink,.pulse,.grow{animation:none}.blink{opacity:1}.pulse,.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#b4400f"/><stop offset="1" stop-color="#8a5300"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#b4400f" stop-opacity="0.08"/><stop offset="1" stop-color="#8a5300" stop-opacity="0.08"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#3c280a" flood-opacity="0.08"/></filter>
</defs>
