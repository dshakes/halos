<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 776" width="760" height="776" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif">
<title id="t">Request path inside halo-proxy</title>
