<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif">
<title id="t">Upgrade watch</title>
<desc id="d">halo upgrade watch finds a new CLI version on npm or a new model in a provider list, verifies the install artifacts, pins the candidate on a branch and runs the eval gate. Ship or hold opens a PR a human merges; block opens nothing.</desc>
<style>
.cv{fill:#fbfcfd;stroke:#e6eaf0;stroke-width:1.5}
.card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5}
.soft{fill:url(#gs)}
.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.dcard{fill:#fef2f2;stroke:#dc2626;stroke-width:1.5}
.ghost{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:4 4}
.zone{fill:#f4f6f9;stroke:#dfe5ec;stroke-width:1.5}
.chip{fill:#f1f5f9;stroke:#e2e8f0;stroke-width:1}
text{font-family:ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#0b1220}
.tm{font:600 12.5px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#0b1220}
.td{fill:#dc2626}
.s{font-size:12px;fill:#475569}
.m{font:11px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#475569}
.xs{font-size:10.5px;font-weight:500;fill:#64748b}
.xm{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;font-weight:400}
.xa{fill:url(#ga);font-weight:600}
.xd{fill:#dc2626;font-weight:600}
.xw{fill:#ffffff;font-weight:600}
.k{font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:#64748b}
.ka{fill:url(#ga)}
.h1{font-size:42px;font-weight:700;letter-spacing:-.02em;fill:#0b1220}
.ln,.la,.ld,.lm{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#94a3b8}.la{stroke:url(#ga)}.ld{stroke:#dc2626}.lm{stroke:#e2e8f0}
.lane{stroke:#e2e8f0;stroke-width:1.5;stroke-dasharray:3 4}
.dash{stroke-dasharray:5 5}
.dl{fill:#94a3b8}.da{fill:url(#ga)}.dd{fill:#dc2626}
.pl{fill:#fbfcfd}.pa{fill:#fbfcfd;stroke:url(#ga);stroke-width:1}
.pd{fill:#fef2f2;stroke:#dc2626;stroke-width:1}.ps{fill:url(#ga)}
.fa{fill:url(#ga)}.fs{fill:url(#gs)}.fm{fill:#f1f5f9}.fd{fill:#dc2626}.ft{fill:#0b1220}
.bdg{fill:url(#ga)}.bn{font-size:9.5px;font-weight:700;fill:#ffffff}
.ic{fill:none;stroke:url(#ga);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pkt{fill:url(#ga)}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 4.8s cubic-bezier(.6,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.08)}25%{transform:scaleX(.3)}50%{transform:scaleX(.55)}75%,100%{transform:scaleX(1)}}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.blink{animation:blink 3.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.18}35%,65%{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.flow,.blink,.pulse,.grow{animation:none}.blink{opacity:1}.pulse,.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#0d9488" stop-opacity="0.07"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0.07"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#0f172a" flood-opacity="0.07"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="758.5" height="234.5" rx="16"/>
<rect class="card" x="24.0" y="24" width="151.0" height="76" rx="12" filter="url(#sh)"/>
<text class="k ka" x="40" y="40.5">01</text>
<text class="t" x="40" y="58.5">Discover</text>
<text class="s" x="40" y="76.5">npm latest</text>
<text class="s" x="40" y="92.5">provider model list</text>
<rect class="card" x="211.0" y="24" width="151.0" height="76" rx="12" filter="url(#sh)"/>
<text class="k ka" x="227" y="40.5">02</text>
<text class="t" x="227" y="58.5">Verify</text>
<text class="s" x="227" y="76.5">sha256 / npm</text>
<text class="s" x="227" y="92.5">integrity</text>
<rect class="card" x="398.0" y="24" width="151.0" height="76" rx="12" filter="url(#sh)"/>
<text class="k ka" x="414" y="40.5">03</text>
<text class="t" x="414" y="58.5">Pin on a branch</text>
<text class="s" x="414" y="76.5">profile version</text>
<text class="s" x="414" y="92.5">or gateway model</text>
<rect class="card" x="585.0" y="24" width="151.0" height="76" rx="12" filter="url(#sh)"/>
<rect class="soft" x="585.0" y="24" width="151.0" height="76" rx="12"/>
<rect class="ring" x="585.75" y="24.75" width="149.5" height="74.5" rx="11.25"/>
<text class="k ka" x="601" y="40.5">04</text>
<text class="t" x="601" y="58.5">Eval gate</text>
<text class="s" x="601" y="76.5">candidate vs</text>
<text class="s" x="601" y="92.5">current pin</text>
<path class="ln" d="M181 62L205 62"/>
<path class="ln hd" d="M199.5 65.4L205 62L199.5 58.6"/>
<path class="ln" d="M368 62L392 62"/>
<path class="ln hd" d="M386.5 65.4L392 62L386.5 58.6"/>
<path class="ln" d="M555 62L579 62"/>
<path class="ln hd" d="M573.5 65.4L579 62L573.5 58.6"/>
<rect class="card" x="398.0" y="148" width="151.0" height="64" rx="12" filter="url(#sh)"/>
<rect class="soft" x="398.0" y="148" width="151.0" height="64" rx="12"/>
<rect class="ring" x="398.75" y="148.75" width="149.5" height="62.5" rx="11.25"/>
<text class="t" x="414" y="168.5">Open PR</text>
<text class="s" x="414" y="186.5">ship · hold</text>
<text class="s" x="414" y="202.5">human merges</text>
<rect class="card" x="585.0" y="148" width="151.0" height="64" rx="12" filter="url(#sh)"/>
<rect class="dcard" x="585.75" y="148.75" width="149.5" height="62.5" rx="11.25"/>
<text class="t td" x="601" y="168.5">No PR</text>
<text class="s" x="601" y="186.5">block</text>
<text class="s" x="601" y="202.5">recorded in state</text>
<path class="la" d="M621 106L621.0 118.0Q621 126 613.0 126.0L481.5 126.0Q473.5 126 473.5 134.0L473.5 142"/>
<path class="la hd" d="M470.1 136.5L473.5 142L476.9 136.5"/>
<path class="ld" d="M700 106L700 142"/>
<path class="ld hd" d="M696.6 136.5L700 142L703.4 136.5"/>
<text class="xs" x="24" y="196">never merges, publishes</text>
<text class="xs" x="24" y="212">or retags a ring</text>
</svg>
