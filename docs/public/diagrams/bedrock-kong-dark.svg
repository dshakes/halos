<rect class="ring" x="173.55" y="28.75" width="115.3" height="62.5" rx="11.25"/>
<text class="t" x="231.2" y="56.5" text-anchor="middle">Kong</text>
<text class="s" x="231.2" y="74.5" text-anchor="middle">+ halo-kong</text>
<rect class="card" x="321.6" y="28" width="116.8" height="64" rx="12" filter="url(#sh)"/>
<text class="t" x="380" y="56.5" text-anchor="middle">Auth gateway</text>
<text class="s" x="380" y="74.5" text-anchor="middle">identity</text>
<rect class="card" x="470.4" y="28" width="116.8" height="64" rx="12" filter="url(#sh)"/>
<text class="t" x="528.8" y="56.5" text-anchor="middle">Orchestrator</text>
<text class="s" x="528.8" y="74.5" text-anchor="middle">SigV4</text>
<rect class="card" x="619.2" y="28" width="116.8" height="64" rx="12" filter="url(#sh)"/>
<text class="t" x="677.6" y="56.5" text-anchor="middle">Bedrock</text>
<text class="s" x="677.6" y="74.5" text-anchor="middle">Amazon</text>
<path class="ln" d="M146.8 60L166.8 60"/>
