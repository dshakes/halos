<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 409" width="760" height="409" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif">
<title id="t">Kill switch</title>
<desc id="d">The controller or an admin kills an experiment at halo-server, which appends to killswitch.jsonl with an audit entry. Every 10 seconds each gateway fetches the signed list with its gateway token and verifies signature, freshness and that issuedAt is strictly newer; killed experiments get control routing and no shadow.</desc>
<style>
.cv{fill:#0f141a;stroke:#232a33;stroke-width:1.5}
.card{fill:#161b22;stroke:#2b3440;stroke-width:1.5}
.soft{fill:url(#gs)}
.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.dcard{fill:#2a1517;stroke:#f87171;stroke-width:1.5}
.ghost{fill:none;stroke:#56606c;stroke-width:1.5;stroke-dasharray:4 4}
.zone{fill:#131921;stroke:#262f3a;stroke-width:1.5}
.chip{fill:#1c232c;stroke:#2b3440;stroke-width:1}
text{font-family:ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#e6edf3}
.tm{font:600 12.5px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#e6edf3}
.td{fill:#f87171}
.s{font-size:12px;fill:#9aa7b4}
.m{font:11px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#9aa7b4}
.xs{font-size:10.5px;font-weight:500;fill:#7d8794}
.xm{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;font-weight:400}
.xa{fill:url(#ga);font-weight:600}
.xd{fill:#f87171;font-weight:600}
.xw{fill:#0b1220;font-weight:600}
.k{font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:#7d8794}
.ka{fill:url(#ga)}
.h1{font-size:42px;font-weight:700;letter-spacing:-.02em;fill:#e6edf3}
.ln,.la,.ld,.lm{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#56606c}.la{stroke:url(#ga)}.ld{stroke:#f87171}.lm{stroke:#2b3440}
.lane{stroke:#2b3440;stroke-width:1.5;stroke-dasharray:3 4}
.dash{stroke-dasharray:5 5}
.dl{fill:#56606c}.da{fill:url(#ga)}.dd{fill:#f87171}
.pl{fill:#0f141a}.pa{fill:#0f141a;stroke:url(#ga);stroke-width:1}
.pd{fill:#2a1517;stroke:#f87171;stroke-width:1}.ps{fill:url(#ga)}
.fa{fill:url(#ga)}.fs{fill:url(#gs)}.fm{fill:#1c232c}.fd{fill:#f87171}.ft{fill:#e6edf3}
.bdg{fill:url(#ga)}.bn{font-size:9.5px;font-weight:700;fill:#0b1220}
.ic{fill:none;stroke:url(#ga);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pkt{fill:url(#ga)}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 4.8s cubic-bezier(.6,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.08)}25%{transform:scaleX(.3)}50%{transform:scaleX(.55)}75%,100%{transform:scaleX(1)}}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.blink{animation:blink 3.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.18}35%,65%{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.flow,.blink,.pulse,.grow{animation:none}.blink{opacity:1}.pulse,.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.12"/><stop offset="1" stop-color="#818cf8" stop-opacity="0.12"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.45"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="758.5" height="407.5" rx="16"/>
<path class="lane" d="M142.7 76V385.59999999999997"/>
<rect class="card" x="29.0" y="24" width="227.3" height="52" rx="12" filter="url(#sh)"/>
<text class="t" x="142.65" y="46.5" text-anchor="middle">Controller</text>
<text class="m" x="142.65" y="64.5" text-anchor="middle">or admin</text>
<path class="lane" d="M380.0 76V385.59999999999997"/>
<rect class="card" x="266.3" y="24" width="227.3" height="52" rx="12" filter="url(#sh)"/>
<text class="t" x="379.95" y="46.5" text-anchor="middle">halo-server</text>
<text class="m" x="379.95" y="64.5" text-anchor="middle">kill list</text>
<path class="lane" d="M617.3 76V385.59999999999997"/>
<rect class="card" x="503.7" y="24" width="227.3" height="52" rx="12" filter="url(#sh)"/>
<text class="t" x="617.35" y="46.5" text-anchor="middle">Gateway</text>
<text class="m" x="617.35" y="64.5" text-anchor="middle">halo-proxy / kong</text>
<path class="ln" d="M146.667 122L376 122"/>
<path class="ln hd" d="M370.5 125.4L376 122L370.5 118.6"/>
<rect class="pl" x="83.7" y="101" width="355.2" height="17" rx="4"/>
<text class="s" x="261.3" y="114" text-anchor="middle" style="font-size:11.5px">kill: controller verdict, or POST /api/v1/experiments/{name}/kill</text>
<rect class="chip" x="245.9" y="141" width="268.3" height="22" rx="6"/>
<text class="m" x="380" y="156" text-anchor="middle">append killswitch.jsonl · audit entry</text>
<path class="ln" d="M613.333 215.6L384 215.6"/>
<path class="ln hd" d="M389.5 212.2L384 215.6L389.5 219.0"/>
<rect class="pl" x="366.6" y="194.6" width="264.2" height="17" rx="4"/>
<text class="s" x="498.7" y="207.6" text-anchor="middle" style="font-size:11.5px">GET /api/v1/gateway/killswitch · gateway token</text>
<path class="ln dash" d="M384 251.6L613.333 251.6"/>
<path class="ln hd" d="M607.8 255.0L613.333 251.6L607.8 248.2"/>
<rect class="pl" x="375.9" y="230.6" width="245.5" height="17" rx="4"/>
<text class="s" x="498.7" y="243.6" text-anchor="middle" style="font-size:11.5px">signed list {version, experiments, issuedAt}</text>
<rect class="chip" x="337.7" y="270.6" width="382.3" height="22" rx="6"/>
<text class="m" x="528.83" y="285.6" text-anchor="middle">verify signature · freshness · issuedAt strictly newer</text>
<rect class="ghost" x="30" y="176" width="700" height="133.60000000000002" rx="10"/>
<rect class="pa" x="45.0" y="167" width="63.8" height="18" rx="9"/>
<text class="xs xa" x="76.885" y="179.6" text-anchor="middle">every 10s</text>
<rect class="soft" x="24" y="339.6" width="712" height="28" rx="8"/>
<text class="s" x="380" y="357.6" text-anchor="middle">killed experiments get control routing and no shadow</text>
</svg>
