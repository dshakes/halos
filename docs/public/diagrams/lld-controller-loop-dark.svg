<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 718" width="760" height="718" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif">
<title id="t">Controller loop</title>
<desc id="d">Each tick halo-server's controller loads policy, holds killed experiments, evaluates running experiments from ClickHouse (guardrails by mSPRT confidence sequence, budgets, sample floor, primary metric) and acts: rollback trips the kill switch only on gateway-sourced evidence, then opens a pause PR and notifies; promote and expiry open a conclude PR. Rollouts are evaluated from hash-chained state; rollback and pause halt, advance and complete only open PRs.</desc>
<style>
.cv{fill:#0c0c10;stroke:#1e1e24;stroke-width:1.5}
.card{fill:#121217;stroke:#2a2a31;stroke-width:1.5}
.soft{fill:url(#gs)}
.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.dcard{fill:#2a1414;stroke:#ff7a7a;stroke-width:1.5}
.ghost{fill:none;stroke:#5a564f;stroke-width:1.5;stroke-dasharray:4 4}
.zone{fill:#0f0f14;stroke:#24242b;stroke-width:1.5}
.chip{fill:#1a1a20;stroke:#2a2a31;stroke-width:1}
text{font-family:ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#f4f1ea}
.tm{font:600 12.5px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#f4f1ea}
.td{fill:#ff7a7a}
.s{font-size:12px;fill:#bdb7ac}
.m{font:11px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#bdb7ac}
.xs{font-size:10.5px;font-weight:500;fill:#9a958b}
.xm{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;font-weight:400}
.xa{fill:url(#ga);font-weight:600}
.xd{fill:#ff7a7a;font-weight:600}
.xw{fill:#16130f;font-weight:600}
.k{font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:#9a958b}
.ka{fill:url(#ga)}
.h1{font-size:42px;font-weight:700;letter-spacing:-.02em;fill:#f4f1ea}
.ln,.la,.ld,.lm{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#5a564f}.la{stroke:url(#ga)}.ld{stroke:#ff7a7a}.lm{stroke:#2a2a31}
.lane{stroke:#2a2a31;stroke-width:1.5;stroke-dasharray:3 4}
.dash{stroke-dasharray:5 5}
.dl{fill:#5a564f}.da{fill:url(#ga)}.dd{fill:#ff7a7a}
.pl{fill:#0c0c10}.pa{fill:#0c0c10;stroke:url(#ga);stroke-width:1}
.pd{fill:#2a1414;stroke:#ff7a7a;stroke-width:1}.ps{fill:url(#ga)}
.fa{fill:url(#ga)}.fs{fill:url(#gs)}.fm{fill:#1a1a20}.fd{fill:#ff7a7a}.ft{fill:#f4f1ea}
.bdg{fill:url(#ga)}.bn{font-size:9.5px;font-weight:700;fill:#16130f}
.ic{fill:none;stroke:url(#ga);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pkt{fill:url(#ga)}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 4.8s cubic-bezier(.6,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.08)}25%{transform:scaleX(.3)}50%{transform:scaleX(.55)}75%,100%{transform:scaleX(1)}}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.blink{animation:blink 3.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.18}35%,65%{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.flow,.blink,.pulse,.grow{animation:none}.blink{opacity:1}.pulse,.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#ffb547"/><stop offset="1" stop-color="#ff7a4d"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#ffb547" stop-opacity="0.12"/><stop offset="1" stop-color="#ff7a4d" stop-opacity="0.12"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.5"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="758.5" height="716.5" rx="16"/>
<text class="k ka" x="24" y="38">INTERNAL/CONTROLLER · CONTROLLER.TICK (EVERY 5M, 2M BUDGET)</text>
<rect class="card" x="56" y="64" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="83.5">Load policy</text>
<text class="m" x="96" y="101.5">Org() = policy.Load(served dir)</text>
<circle class="bdg" cx="76" cy="87.0" r="8"/>
<text class="bn" x="76" y="90.4" text-anchor="middle">1</text>
<rect class="card" x="56" y="122" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="141.5">Skip what a rollout owns</text>
<text class="m" x="96" y="159.5">rolloutOwned(org, exp)</text>
<circle class="bdg" cx="76" cy="145.0" r="8"/>
<text class="bn" x="76" y="148.4" text-anchor="middle">2</text>
<path class="ln" d="M76 111L76 113"/>
<rect class="card" x="56" y="180" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="199.5">Killed? hold, do not evaluate</text>
<text class="m" x="96" y="217.5">KillStore.Killed -&gt; hold + notify</text>
<circle class="bdg" cx="76" cy="203.0" r="8"/>
<text class="bn" x="76" y="206.4" text-anchor="middle">3</text>
<path class="ln" d="M76 169L76 171"/>
<path class="la" d="M514 203L544 203"/>
<path class="la hd" d="M538.5 206.4L544 203L538.5 199.6"/>
<rect class="pl" x="548.0" y="194.0" width="33.8" height="18" rx="9"/>
<text class="xs" x="564.923" y="206.6" text-anchor="middle">hold</text>
<rect class="card" x="56" y="238" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="257.5">Read evidence</text>
<text class="m" x="96" y="275.5">ClickHouse halo_metrics, per unit</text>
<circle class="bdg" cx="76" cy="261.0" r="8"/>
<text class="bn" x="76" y="264.4" text-anchor="middle">4</text>
<path class="ln" d="M76 227L76 229"/>
<rect class="card" x="56" y="296" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="315.5">Guardrails</text>
<text class="m" x="96" y="333.5">SeqGuardrail (mSPRT CS), alpha / n</text>
<circle class="bdg" cx="76" cy="319.0" r="8"/>
<text class="bn" x="76" y="322.4" text-anchor="middle">5</text>
<path class="ln" d="M76 285L76 287"/>
<path class="ld" d="M514 319L544 319"/>
<path class="ld hd" d="M538.5 322.4L544 319L538.5 315.6"/>
<rect class="pd" x="548.0" y="310.0" width="53.7" height="18" rx="9"/>
<text class="xs xd" x="574.845" y="322.6" text-anchor="middle">rollback</text>
<rect class="card" x="56" y="354" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="373.5">Budgets</text>
<text class="m" x="96" y="391.5">maxDays, maxSpendUSD</text>
<circle class="bdg" cx="76" cy="377.0" r="8"/>
<text class="bn" x="76" y="380.4" text-anchor="middle">6</text>
<path class="ln" d="M76 343L76 345"/>
<path class="la" d="M514 377L544 377"/>
<path class="la hd" d="M538.5 380.4L544 377L538.5 373.6"/>
<rect class="pl" x="548.0" y="368.0" width="50.9" height="18" rx="9"/>
<text class="xs" x="573.428" y="380.6" text-anchor="middle">expired</text>
<rect class="card" x="56" y="412" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="431.5">Sample floor</text>
<text class="m" x="96" y="449.5">minSamples per arm</text>
<circle class="bdg" cx="76" cy="435.0" r="8"/>
<text class="bn" x="76" y="438.4" text-anchor="middle">7</text>
<path class="ln" d="M76 401L76 403"/>
<path class="la" d="M514 435L544 435"/>
<path class="la hd" d="M538.5 438.4L544 435L538.5 431.6"/>
<rect class="pl" x="548.0" y="426.0" width="54.4" height="18" rx="9"/>
<text class="xs" x="575.212" y="438.6" text-anchor="middle">continue</text>
<rect class="card" x="56" y="470" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="489.5">Primary metric</text>
<text class="m" x="96" y="507.5">msprt | fixed, direction</text>
<circle class="bdg" cx="76" cy="493.0" r="8"/>
<text class="bn" x="76" y="496.4" text-anchor="middle">8</text>
<path class="ln" d="M76 459L76 461"/>
<path class="la" d="M514 493L544 493"/>
<path class="la hd" d="M538.5 496.4L544 493L538.5 489.6"/>
<rect class="pa" x="548.0" y="484.0" width="104.6" height="18" rx="9"/>
<text class="xs xa" x="600.308" y="496.6" text-anchor="middle">promote | rollback</text>
<rect class="card" x="56" y="528" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="547.5">Rollback</text>
<text class="m" x="96" y="565.5">gateway evidence ? kill : no kill</text>
<circle class="bdg" cx="76" cy="551.0" r="8"/>
<text class="bn" x="76" y="554.4" text-anchor="middle">9</text>
<path class="ln" d="M76 517L76 519"/>
<path class="ld" d="M514 551L544 551"/>
<path class="ld hd" d="M538.5 554.4L544 551L538.5 547.6"/>
<rect class="pd" x="548.0" y="542.0" width="99.8" height="18" rx="9"/>
<text class="xs xd" x="597.893" y="554.6" text-anchor="middle">pause PR + notify</text>
<rect class="card" x="56" y="586" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="605.5">Promote or expired</text>
<text class="m" x="96" y="623.5">conclude PR (never merged)</text>
<circle class="bdg" cx="76" cy="609.0" r="8"/>
<text class="bn" x="76" y="612.4" text-anchor="middle">10</text>
<path class="ln" d="M76 575L76 577"/>
<path class="la" d="M514 609L544 609"/>
<path class="la hd" d="M538.5 612.4L544 609L538.5 605.6"/>
<rect class="pa" x="548.0" y="600.0" width="41.0" height="18" rx="9"/>
<text class="xs xa" x="568.492" y="612.6" text-anchor="middle">notify</text>
<rect class="card" x="56" y="644" width="452" height="46" rx="12" filter="url(#sh)"/>
<text class="t" x="96" y="663.5">Rollouts</text>
<text class="m" x="96" y="681.5">LoadState (hash chain), Gather, Evaluate</text>
<circle class="bdg" cx="76" cy="667.0" r="8"/>
<text class="bn" x="76" y="670.4" text-anchor="middle">11</text>
<path class="ln" d="M76 633L76 635"/>
<path class="la" d="M514 667L544 667"/>
<path class="la hd" d="M538.5 670.4L544 667L538.5 663.6"/>
<rect class="pa" x="548.0" y="658.0" width="85.6" height="18" rx="9"/>
<text class="xs xa" x="590.805" y="670.6" text-anchor="middle">halt | PR | hold</text>
<path class="la dash" d="M54 667L42.0 667.0Q34 667 34.0 659.0L34.0 95.0Q34 87 42.0 87.0L50 87"/>
<path class="la hd" d="M44.5 90.4L50 87L44.5 83.6"/>
<rect class="pa" x="6.1" y="368.0" width="55.9" height="18" rx="9"/>
<text class="xs xa" x="34" y="380.6" text-anchor="middle">next tick</text>
</svg>
