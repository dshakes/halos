<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 192" width="760" height="192" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif">
<title id="t">Variant assignment</title>
<desc id="d">The verified identity is hashed with the experiment salt into 10,000 buckets; the weight bucket picks control (current route) or candidate (routes override), and the gateway stamps x-halo-variant.</desc>
<style>
.cv{fill:#0c0c10;stroke:#1e1e24;stroke-width:1.5}
.card{fill:#121217;stroke:#2a2a31;stroke-width:1.5}
.soft{fill:url(#gs)}
.ring{fill:none;stroke:url(#ga);stroke-width:1.5}
.dcard{fill:#2a1414;stroke:#ff7a7a;stroke-width:1.5}
.ghost{fill:none;stroke:#5a564f;stroke-width:1.5;stroke-dasharray:4 4}
.zone{fill:#0f0f14;stroke:#24242b;stroke-width:1.5}
.chip{fill:#1a1a20;stroke:#2a2a31;stroke-width:1}
text{font-family:ui-sans-serif,-apple-system,Inter,'Segoe UI',sans-serif}
.t{font-size:13.5px;font-weight:600;fill:#f4f1ea}
.tm{font:600 12.5px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#f4f1ea}
.td{fill:#ff7a7a}
.s{font-size:12px;fill:#bdb7ac}
.m{font:11px ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#bdb7ac}
.xs{font-size:10.5px;font-weight:500;fill:#9a958b}
.xm{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;font-weight:400}
.xa{fill:url(#ga);font-weight:600}
.xd{fill:#ff7a7a;font-weight:600}
.xw{fill:#16130f;font-weight:600}
.k{font-size:10.5px;font-weight:600;letter-spacing:.08em;fill:#9a958b}
.ka{fill:url(#ga)}
.h1{font-size:42px;font-weight:700;letter-spacing:-.02em;fill:#f4f1ea}
.ln,.la,.ld,.lm{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke:#5a564f}.la{stroke:url(#ga)}.ld{stroke:#ff7a7a}.lm{stroke:#2a2a31}
.lane{stroke:#2a2a31;stroke-width:1.5;stroke-dasharray:3 4}
.dash{stroke-dasharray:5 5}
.dl{fill:#5a564f}.da{fill:url(#ga)}.dd{fill:#ff7a7a}
.pl{fill:#0c0c10}.pa{fill:#0c0c10;stroke:url(#ga);stroke-width:1}
.pd{fill:#2a1414;stroke:#ff7a7a;stroke-width:1}.ps{fill:url(#ga)}
.fa{fill:url(#ga)}.fs{fill:url(#gs)}.fm{fill:#1a1a20}.fd{fill:#ff7a7a}.ft{fill:#f4f1ea}
.bdg{fill:url(#ga)}.bn{font-size:9.5px;font-weight:700;fill:#16130f}
.ic{fill:none;stroke:url(#ga);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pkt{fill:url(#ga)}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 4.8s cubic-bezier(.6,0,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(.08)}25%{transform:scaleX(.3)}50%{transform:scaleX(.55)}75%,100%{transform:scaleX(1)}}
.flow{stroke-dasharray:4 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.blink{animation:blink 3.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.18}35%,65%{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.flow,.blink,.pulse,.grow{animation:none}.blink{opacity:1}.pulse,.pkt{display:none}}
</style>
<defs>
<linearGradient id="ga" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#ffb547"/><stop offset="1" stop-color="#ff7a4d"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#ffb547" stop-opacity="0.12"/><stop offset="1" stop-color="#ff7a4d" stop-opacity="0.12"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.5"/></filter>
</defs>
<rect class="cv" x=".75" y=".75" width="758.5" height="190.5" rx="16"/>
<rect class="card" x="24" y="72" width="140" height="56" rx="12" filter="url(#sh)"/>
<text class="t" x="40" y="96.5">Verified identity</text>
<text class="s" x="40" y="114.5">from the JWT</text>
<rect class="card" x="196" y="72" width="180" height="56" rx="12" filter="url(#sh)"/>
<text class="tm" x="212" y="96.5">hash(user, salt)</text>
<text class="s" x="212" y="114.5">% 10000 → bucket</text>
<rect class="card" x="412" y="32" width="156" height="56" rx="12" filter="url(#sh)"/>
<text class="k ka" x="428" y="54.5">CONTROL</text>
<text class="t" x="428" y="72.5">Current route</text>
<rect class="card" x="412" y="112" width="156" height="56" rx="12" filter="url(#sh)"/>
<rect class="soft" x="412" y="112" width="156" height="56" rx="12"/>
<rect class="ring" x="412.75" y="112.75" width="154.5" height="54.5" rx="11.25"/>
<text class="k ka" x="428" y="134.5">CANDIDATE</text>
<text class="t" x="428" y="152.5">Routes override</text>
<rect class="card" x="604" y="72" width="132" height="56" rx="12" filter="url(#sh)"/>
<text class="t" x="620" y="96.5">Stamp</text>
<text class="m" x="620" y="114.5">x-halo-variant</text>
<path class="ln" d="M170 100L190 100"/>
<path class="ln hd" d="M184.5 103.4L190 100L184.5 96.6"/>
<path class="ln" d="M382 100L388.0 100.0Q394 100 394.0 94.0L394.0 66.0Q394 60 400.0 60.0L406 60"/>
<path class="ln hd" d="M400.5 63.4L406 60L400.5 56.6"/>
<path class="la" d="M382 100L388.0 100.0Q394 100 394.0 106.0L394.0 134.0Q394 140 400.0 140.0L406 140"/>
<path class="la hd" d="M400.5 143.4L406 140L400.5 136.6"/>
<path class="ln" d="M574 60L580.0 60.0Q586 60 586.0 66.0L586.0 94.0Q586 100 592.0 100.0L598 100"/>
<path class="ln hd" d="M592.5 103.4L598 100L592.5 96.6"/>
<path class="la" d="M574 140L580.0 140.0Q586 140 586.0 134.0L586.0 106.0Q586 100 592.0 100.0L598 100"/>
<path class="la hd" d="M592.5 103.4L598 100L592.5 96.6"/>
</svg>
