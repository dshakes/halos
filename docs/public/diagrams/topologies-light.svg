<rect class="soft" x="464" y="108" width="114" height="60" rx="12"/>
<rect class="ring" x="464.75" y="108.75" width="112.5" height="58.5" rx="11.25"/>
<text class="t" x="521" y="142.5" text-anchor="middle">halo-proxy</text>
<path class="ln" d="M436 138L458 138"/>
<path class="ln hd" d="M452.5 141.4L458 138L452.5 134.6"/>
<rect class="card" x="612" y="108" width="114" height="60" rx="12" filter="url(#sh)"/>
<text class="t" x="669" y="142.5" text-anchor="middle">Provider</text>
<path class="ln" d="M584 138L606 138"/>
<path class="ln hd" d="M600.5 141.4L606 138L600.5 134.6"/>
<text class="k ka" x="24" y="218">C · STANDALONE</text>
<text class="s" x="24" y="236">no other gateway</text>
<rect class="card" x="168" y="192" width="114" height="60" rx="12" filter="url(#sh)"/>
<text class="t" x="225" y="226.5" text-anchor="middle">Clients</text>
<rect class="card" x="316" y="192" width="114" height="60" rx="12" filter="url(#sh)"/>
<rect class="soft" x="316" y="192" width="114" height="60" rx="12"/>
<rect class="ring" x="316.75" y="192.75" width="112.5" height="58.5" rx="11.25"/>
<text class="t" x="373" y="226.5" text-anchor="middle">halo-proxy</text>
<path class="ln" d="M288 222L310 222"/>
<path class="ln hd" d="M304.5 225.4L310 222L304.5 218.6"/>
<rect class="card" x="612" y="192" width="114" height="60" rx="12" filter="url(#sh)"/>
<text class="t" x="669" y="226.5" text-anchor="middle">Providers</text>
<path class="ln" d="M436 222L606 222"/>
<path class="ln hd" d="M600.5 225.4L606 222L600.5 218.6"/>
</svg>
