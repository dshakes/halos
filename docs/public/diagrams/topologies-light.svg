<path class="ln hd" d="M452.5 57.4L458 54L452.5 50.6"/>
<rect class="card" x="612" y="24" width="114" height="60" rx="12" filter="url(#sh)"/>
<text class="t" x="669" y="58.5" text-anchor="middle">Provider</text>
<path class="ln" d="M584 54L606 54"/>
<path class="ln hd" d="M600.5 57.4L606 54L600.5 50.6"/>
<text class="k ka" x="24" y="134">B · BEHIND</text>
<text class="s" x="24" y="152">after your gateway</text>
<rect class="card" x="168" y="108" width="114" height="60" rx="12" filter="url(#sh)"/>
<text class="t" x="225" y="142.5" text-anchor="middle">Clients</text>
<rect class="card" x="316" y="108" width="114" height="60" rx="12" filter="url(#sh)"/>
<text class="t" x="373" y="142.5" text-anchor="middle">Your gateway</text>
<path class="ln" d="M288 138L310 138"/>
<path class="ln hd" d="M304.5 141.4L310 138L304.5 134.6"/>
