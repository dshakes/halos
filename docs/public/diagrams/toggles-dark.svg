<rect class="dcard" x="40" y="270" width="328" height="24" rx="8"/>
<text class="xs xd" x="54" y="286">kill switch: one signed flip → OFF everywhere</text>
<text class="k ka" x="480" y="48">RESOLVED PER DEVELOPER · FROM VERIFIED IDENTITY</text>
