<circle class="bdg" cx="56" cy="197" r="8"/>
<text class="bn" x="56" y="200.4" text-anchor="middle">3</text>
<text class="m" x="74" y="201.5">10% of everyone else</text>
<rect class="pa" x="326.0" y="188" width="28.1" height="18" rx="9"/>
<text class="xs xa" x="340" y="200.6" text-anchor="middle">ON</text>
<rect class="chip" x="40" y="224" width="328" height="34" rx="8"/>
<text class="xs" x="56" y="245.5" text-anchor="middle">else</text>
<text class="m" x="74" y="245.5">default</text>
<rect class="pl" x="322.4" y="232" width="35.1" height="18" rx="9"/>
