<circle class="fa" cx="504" cy="206" r="12"/>
<text class="xs xw" x="504" y="210" text-anchor="middle">C</text>
<text class="t" x="526" y="203">chen</text>
<text class="m" x="526" y="219">bucket 0412 &lt; 1000</text>
